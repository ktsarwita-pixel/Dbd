<title>DBD Clone - Step 2: Sword</title>
<style>

  html, body {
    width: 100%; height: 100%;
    background: #11131a;
    overflow: hidden;
    touch-action: none;
    -webkit-user-select: none; user-select: none;
  }

    display: block;
    position: fixed; top: 0; left: 0;

    background: #1b1e27;
  }
</style>
</head>
<body>
<canvas id="game"></canvas>
<script>
(() => {
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d', { alpha: false }) || canvas.getContext('2d');

  // ---------- tunables ----------
  const MAP_MARGIN = 24;
  const MAX_SPEED  = 200;
  const ACCEL      = 12;
  const ANG_SPEED  = 16;
  const CHARGE_TIME = 0.8;
  const ATTACK = {
    duration:    0.60,
    lungeTime:   0.16,
    lungeSpeedBase:  240,
    lungeSpeedExtra: 340,
    hitStart:    0.20,
    hitEnd:      0.52,
    recoverHit:  2.0,    // recovery / inspect after a connecting hit
    recoverMiss: 1.5,    // recovery after a miss (slowed to 40% speed)
    inspectSO:   0.30,   // sword pose while inspecting the blade
    recoverSpeed: 0.60,  // movement speed multiplier during recovery
  };
  const KILLER_CD = 2.0;   // seconds between the killer dummy's auto-swings
  const REST_SO = -0.50, WIND_SO = -1.25, END_SO = 1.05;
  // ---- Second's passive: Overcharge ----
  // Holding the charge for SECOND.overchargeHoldTime seconds after it hits 100% causes the
  // charge bar to "break": it turns purple, visually expands, and the eventual lunge is even
  // faster than a normal max-charge swing. Landing an overcharged hit gives a much shorter
  // (1.5s) recovery at a light 90% speed penalty for 4s; whiffing an overcharged swing is
  // punished far less than normal (1s recovery, no speed penalty at all).
  const SECOND = {
    overchargeHoldTime:   3.0,   // extra seconds to hold past max charge to trigger overcharge
    overchargeLungeBonus: 230,   // flat extra lunge speed on top of a normal maxed swing
    overchargeRecoverHit:  1.5,
    overchargeRecoverMiss: 1.0,
    overchargeSpeedMultHit: 0.90,
    overchargeSpeedTimeHit: 4.0,
    barGrow: 1.55,                // charge-bar length multiplier once overcharged
    barColor: '#b56cff'
  };
  // ---- Bursts (generic killer mechanic, works for any killer) ----
  // Landing 3 melee (M1) hits in a row without missing banks one "burst". While a burst is
  // banked, it's shown on the M1 button; holding charge to max and then holding an EXTRA
  // 0.5s triggers a burst swing: the charge bar plays an epic upward-expand animation, the
  // lunge is even faster than a normal max charge, damage is boosted to 50, and (unlike a
  // normal or Second-overcharged swing) the harsher recovery + speed penalty apply the same
  // whether the swing hits OR misses.
  const BURST = {
    streakNeeded: 3,
    holdTime:     0.5,
    lungeBonus:   300,
    damage:       50,
    recover:      4.0,   // applies on hit AND miss
    speedMult:    0.50,  // applies on hit AND miss
    speedTime:    5.0,
    barGrow:      1.9,
    color: '#ff9d3d'
  };
  // ---- Burst + Second's Overcharge combined ----
  // If a burst swing is ALSO held long enough to break into Second's overcharge, the two
  // stack into one super-charged "combo" swing: the bar expands further still with a
  // brighter combined effect, the lunge is the fastest of all, damage is 75, and recovery +
  // the speed penalty both apply equally whether the swing connects or misses.
  const COMBO = {
    lungeBonus: 520,
    damage:     75,
    recover:    6.0,    // applies on hit AND miss
    speedMult:  0.25,   // applies on hit AND miss
    speedTime:  3.0,
    barGrow:    2.6
  };
  // ---- Jason's passive: HARD STAB ----
  // Landing 2 M1 hits in a row on a survivor ARMS Hard Stab (Jason only). The next M1 becomes a
  // dedicated thrust: a different wind-up/stab animation (coil back, then an explosive straight
  // lunge instead of the wide slash arc), the lunge distance for whatever charge was held is
  // multiplied by 1.2x, the reach box becomes longer + narrower (piercing), and a connecting stab
  // inflicts DEEP WOUND on the survivor: 5 seconds of bleeding that ticks 5 damage every 1s and
  // leaves blood trails/drips on the ground beneath them.
  // The armed stab is spent the moment the swing launches (hit or miss), and the stab swing itself
  // does not count toward re-arming, so the passive naturally cycles every 3rd landed hit.
  const HARDSTAB = {
    hitsNeeded:     2,      // consecutive landed M1s required to arm the passive
    lungeMult:      1.2,    // lunge distance multiplier applied to the whole charged lunge
    deepDuration:   5.0,    // DEEP WOUND lifetime in seconds
    deepTickDamage: 5,      // damage per bleed tick
    deepTickTime:   1.0,    // seconds between bleed ticks
    stabExtend:     16,     // extra forward reach (px) at full thrust extension
    boxLenBonus:    10,     // stab hitbox is longer...
    boxWidthMult:   0.72,   // ...and narrower than a normal swing (a piercing thrust)
    trailTime:      0.09,   // seconds between blood-trail drips while deep wounded
    color:      '#ff4646',
    colorDeep:  '#8e0d0d',
    colorLight: '#ffb0a4'
  };
  const BOX = { fwd: 20, halfLen: 24, halfW: 20 };  // attack hitbox: a box in front
  // Second wields a long sword: longer blade + longer/wider reach box than Jason's short sword.
  const BOX_LONGSWORD = { fwd: 26, halfLen: 34, halfW: 21 };
  const THROW = {
    speed: 430,
    returnSpeed: 520,
    range: 720,
    radius: 8,
    damage: 25,
    returnDamage: 5,
    slowMult: 0.80,
    slowTime: 4.0,
    stickTime: 4.0,
    cooldownHit: 10.0,
    cooldownMiss: 15.0,
    aimCone: Math.PI / 3   // 60 degree total throw cone in front of Jason
  };
  const BLOCK = {
    windup: 0.30,      // faster delay before Jame's real block starts
    active: 2.00,      // parry/block window
    stunTime: 5.00,
    cooldown: 15.00,
    missSlowMult: 0.70,
    missSlowTime: 4.00
  };
  // ---- Jame's passive: RESURGEON ----
  // Every PERFECT block (a parry that actually connects with the killer's swing) banks one
  // Resurgeon charge, worth 10 HP. Charges stack to 3, but the chain is fragile: whiffing a
  // block attempt — letting the parry window expire without catching a swing — wipes every
  // banked charge, so all 3 parries must land cleanly with no misses in between.
  // The button lives beside the FIX-GEN button and stays dark until the first charge lands.
  // At 3/3 it arms, and HOLDING it fuses all three charges into a surgical recovery:
  // +30 HP and 20 seconds of total immunity to status effects.
  const RESURGEON = {
    maxCharges:     3,       // charges required before the button can be spent
    healPerCharge:  10,      // 1 perfect block = 10 HP  ->  3 charges = 30 HP
    holdTime:       1.3,     // seconds the button must be held to fuse the charges
    immuneTime:     20.0,    // seconds of status immunity granted on activation
    // Damage immunity is intentionally OFF: "immune to any effects" is read as status
    // effects (slows, bleeds, knockback), not raw damage. Flip this to true to also make
    // Jame untouchable by the killer's melee for the duration.
    immuneToDamage: false,
    color:      '#3ce08a',
    colorDeep:  '#0b5c37',
    colorLight: '#d6ffec',
    colorWarn:  '#ff6b6b'
  };
  // ---- Second's skill: GHOST TRAP ----
  // Landing a hit on a survivor ARMS the skill; using it places a spectral trap on the ground
  // in front of Second and disarms it again (so every trap must be earned with a fresh hit,
  // on top of the 20s cooldown). The trap is invisible to survivors beyond 2 grid cells and
  // fades in as they approach. A survivor who walks onto an armed trap is rooted and must land
  // 3 GREAT skill checks to break free. Being struck while trapped frees them early and grants
  // a 25% haste for 3s, so the killer must choose between the damage and the hold.
  const GHOST = {
    cooldown:       20.0,   // seconds between placements
    lifetime:       15.0,   // seconds the trap sits on the map before fading out
    placeDist:      46,     // how far in front of Second it lands
    radius:         24,     // trigger radius
    drawScale:      1.55,   // visual footprint relative to the trigger radius (reads at a glance)
    revealDist:     96,     // 2 grid cells (grid = 48px) — survivor reveal range
    fadeBand:       34,     // extra distance over which the reveal fades in smoothly
    checksNeeded:   4,      // escape pips required (GOOD = 1, GREAT = 2)
    goodPips:       1,      // a GOOD hit fills one pip
    greatPips:      2,      // a GREAT hit fills two — worth double
    missPenalty:    1,      // pips lost on a genuine miss
    checkDuration:  1.45,
    successZone:    0.50,   // GOOD band width (radians of the sweep), matches generators
    greatZoneFrac:  0.34,   // GREAT sliver as a fraction of the GOOD band
    checkGap:       0.35,   // pause between one check resolving and the next spawning
    escapeHaste:    1.25,   // +25% movement speed...
    escapeHasteTime: 3.0,   // ...for 3 seconds, when freed by taking a hit
    // Training-dummy escape AI (killer mode only). Rather than teleporting the needle, the
    // dummy picks an aim point and presses when the sweep genuinely reaches it — so it really
    // does nail the checks. aiAimSigma is its precision in radians; small = very accurate.
    aiAimSigma:     0.040,  // typical aim error (GREAT band is +/-0.085 rad, so this mostly hits)
    aiFumbleChance: 0.16,   // chance of a sloppy attempt that lands GOOD or misses
    aiFumbleSigma:  0.34,   // aim error on a fumbled attempt (can fall outside GOOD)
    aiReaction:     0.055,  // reaction lag (s) applied to the press, like a human
    color:      '#8f6cff',
    colorDeep:  '#3a1c78',
    colorLight: '#e0d4ff',
    colorWarn:  '#ff6b6b'
  };
  const GEN = {
    r: 24,
    interactRange: 72,
    repairTime: 38,
    skillIntervalMin: 3.2,   // skill checks now fire at randomized intervals (more interesting / less predictable)
    skillIntervalMax: 6.8,
    checkDuration: 1.55,
    successZone: 0.50,
    greatZoneFrac: 0.34,     // fraction of the success zone that counts as a "GREAT" bonus hit
    successBonus: 0.08,
    greatBonusMult: 1.7,     // GREAT hits award extra progress
    failPenalty: 0.07,
    lockGap: 8               // gap between survivor's body and the generator edge while locked in
  };

  // ---------- characters ----------
  const CHAR_SKINS = {
    jason:  { name:'Jason',  c0:'#e0625a', c1:'#7a1818', stroke:'#ffc9c2' },
    jame:   { name:'Jame',   c0:'#8fe0a8', c1:'#1f7d4a', stroke:'#d4ffe2' },
    second: { name:'Second', c0:'#b98ee0', c1:'#4a1f7d', stroke:'#e5d4ff' }
  };
  const KILLERS   = [{ id:'jason' }, { id:'second' }];
  const SURVIVORS = [{ id:'jame' }];
  const DEFAULT_KILLER = 'jason', DEFAULT_SURVIVOR = 'jame';

  // ---------- world & offscreen caches ----------
  let map = { x:0, y:0, w:0, h:0 };
  let vpCache = { w:800, h:600 };
  let cachedUiScale = 1;
  let cachedDpr = 1;
  let cachedBgGradient = null;
  let cachedFloorVignette = null;
  let cachedDamageVignette = null;
  let floorCanvas = null;
  const spriteCache = { bodies: {}, genWork: null, genDone: null, r: 0, genR: 0, dpr: 0 };
  const hudCache = {
    attack:    { x:0, y:0, r:42 },
    resurgeon: { x:0, y:0, r:40, rCore:40, rOuter:47 },
    skill:     { x:0, y:0, r:40 },
    hardStab:  { x:0, y:0, r:40, rCore:40, rOuter:47 },
    aimSlider: { x:0, y:0, w:126, h:30, cx:0, cy:0 },
    debug:     { x:0, y:0, r:17 },
    info:      { x:0, y:0, r:17 },
    mode:      { x:0, y:0, r:17 },
    menu:      { x:0, y:0, r:17 },
    reset:     { x:0, y:0, r:17 },
    map:       { x:0, y:0, r:17 }
  };
  const dialLabelCache = new Map();
  // ---- glow system: no shadowBlur in per-frame drawing ----
  // shadowBlur forces a blur pass on every draw and its first use is a visible stall, so glows are
  // either baked once into a cached sprite (weapons) or built from cheap additive halos (UI/effects).
  var fxReady = false;                 // var: safe to read before the const block below runs
  const glowSprites = new Map();
  const GLOW_SHIFT = 4000;             // bake: silhouette is pushed off-canvas, its shadow shifted back
  function parseGlow(css) {
    const m = /rgba?\(\s*(\d+)\s*,\s*(\d+)\s*,\s*(\d+)\s*(?:,\s*([\d.]+)\s*)?\)/.exec(css);
    if (!m) return { rgb: '255,255,255', a: 1 };
    return { rgb: `${m[1]},${m[2]},${m[3]}`, a: m[4] === undefined ? 1 : parseFloat(m[4]) };
  }
  function bakeGlow(key, x0, y0, x1, y1, blur, rgb, paint) {
    let s = glowSprites.get(key);
    if (s !== undefined) return s;
    const d = cachedDpr || 1;
    const pad = Math.ceil(blur * 1.6) + 2;
    const ox = x0 - pad, oy = y0 - pad;
    const w = (x1 - x0) + pad * 2, h = (y1 - y0) + pad * 2;
    const c = makeOffscreen(Math.ceil(w * d), Math.ceil(h * d));
    if (!c) { glowSprites.set(key, null); return null; }
    const g = c.getContext('2d');
    g.scale(d, d);
    g.shadowColor = `rgb(${rgb})`; g.shadowBlur = blur;
    g.shadowOffsetX = GLOW_SHIFT * d; g.shadowOffsetY = 0;
    g.translate(-ox - GLOW_SHIFT, -oy);
    g.fillStyle = '#ffffff';
    paint(g);
    s = { canvas: c, ox, oy, w, h };
    glowSprites.set(key, s);
    return s;
  }
  // Blit a baked glow in the current local space; `a` is the glow's own alpha.
  function blitGlow(s, dx, dy, a) {
    if (!s || a <= 0.004) return;
    const pa = ctx.globalAlpha;
    ctx.globalAlpha = pa * Math.min(1, a);
    ctx.drawImage(s.canvas, s.ox + dx, s.oy + dy, s.w, s.h);
    ctx.globalAlpha = pa;
  }
  function swordGlowSprite(longsword, bladeL, rgb, blur) {
    const g0 = GRIP_DIST;
    const bw = longsword ? 4.3 : 3.6, mw = longsword ? 2.9 : 2.4;
    return bakeGlow(`sw|${longsword ? 1 : 0}|${bladeL}|${blur}|${rgb}|${cachedDpr}`,
      g0 - 2, -bw, g0 + bladeL + 2, bw, blur, rgb, (g) => {
        g.beginPath();
        g.moveTo(g0, -bw); g.lineTo(g0 + bladeL * 0.72, -mw); g.lineTo(g0 + bladeL, 0);
        g.lineTo(g0 + bladeL * 0.72, mw); g.lineTo(g0, bw); g.closePath(); g.fill();
      });
  }
  function knifeGlowSprite() {
    const K = KNIFE_ART;
    return bakeGlow(`knife|${cachedDpr}`, K.tangX, -K.barbY, K.tip + 1, K.barbY, 10, '170,220,255', (g) => {
      g.beginPath();
      g.moveTo(K.tangX, -K.barbY); g.lineTo(K.midX, -K.midY); g.lineTo(K.tip, 0);
      g.lineTo(K.midX, K.midY); g.lineTo(K.tangX, K.barbY); g.closePath(); g.fill();
    });
  }
  // Soft additive halo for a disk (replaces a shadowBlur on a round shape).
  function glowDisk(x, y, r, rgb, a) {
    a = clamp(a, 0, 1);
    if (a <= 0.004 || r <= 0.5) return;
    const g = ctx.createRadialGradient(x, y, r * 0.15, x, y, r);
    g.addColorStop(0, `rgba(${rgb},${(0.85 * a).toFixed(3)})`);
    g.addColorStop(0.5, `rgba(${rgb},${(0.3 * a).toFixed(3)})`);
    g.addColorStop(1, `rgba(${rgb},0)`);
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
  }
  // Soft additive halo around an arc (replaces a shadowBlur on a stroked arc).
  function glowRing(x, y, r, a0, a1, rgb, lw, a) {
    a = clamp(a, 0, 1);
    if (a <= 0.004) return;
    const w = Math.max(1, lw);
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    ctx.lineCap = 'round';
    ctx.strokeStyle = `rgb(${rgb})`;
    ctx.globalAlpha = 0.16 * a; ctx.lineWidth = w * 4;
    ctx.beginPath(); ctx.arc(x, y, r, a0, a1); ctx.stroke();
    ctx.globalAlpha = 0.32 * a; ctx.lineWidth = w * 2;
    ctx.beginPath(); ctx.arc(x, y, r, a0, a1); ctx.stroke();
    ctx.restore();
  }
  // Warm everything that would otherwise be built lazily on the first M1 / throw / skill.
  function prewarmEffects() {
    const dprKey = String(cachedDpr);
    if (fxReady === dprKey) return;
    fxReady = dprKey;
    swordGlowSprite(false, BLADE_LEN, '255,120,120', 14);
    swordGlowSprite(false, BLADE_LEN, '255,60,50', 22);
    swordGlowSprite(false, BLADE_LEN, '255,220,120', 14);
    swordGlowSprite(true, BLADE_LEN_LONGSWORD, '180,110,255', 20);
    swordGlowSprite(true, BLADE_LEN_LONGSWORD, '255,120,120', 14);
    swordGlowSprite(true, BLADE_LEN_LONGSWORD, '255,60,50', 22);
    knifeGlowSprite();
    // glyph warm-up: every HUD label size, bold and regular, rasterised once up front
    const wc = makeOffscreen(256, 32);
    if (wc) {
      const g = wc.getContext('2d');
      for (let s = 6; s <= 26; s++) {
        g.font = `bold ${s}px system-ui,sans-serif`; g.fillText('0123456789 ABCDEFGHIJKLMNOPQRSTUVWXYZ', 0, 16);
        g.font = `${s}px system-ui,sans-serif`;     g.fillText('0123456789 ABCDEFGHIJKLMNOPQRSTUVWXYZ', 0, 16);
      }
    }
  }
  const nameplateCache = new Map();
  let infoWrapCache = { key: '', noticeLayout: null, subLayout: null, ainfoLines: null, updatesLines: null };
  let mode = 'killer';   // 'killer' = you attack the training dummy | 'survivor' = dummy is a killer
  let playerChar = 'jason';

  function queryViewportRaw() {
    const vv = window.visualViewport;
    if (vv && vv.width > 0 && vv.height > 0) return { w: vv.width, h: vv.height };
    const de = document.documentElement;
    return { w: (de && de.clientWidth) || window.innerWidth || 800, h: (de && de.clientHeight) || window.innerHeight || 600 };
  }
  function getViewport() {
    return vpCache;
  }
  function uiScale() {
    return cachedUiScale;
  }
  function rebuildHudCache() {
    const sc = cachedUiScale;
    const abR = 42 * sc, abInset = 10 * sc;
    const abX = map.x + map.w - abInset - abR, abY = map.y + map.h - abInset - abR;
    hudCache.attack.x = abX; hudCache.attack.y = abY; hudCache.attack.r = abR;

    const rCore = 40 * sc, rOuter = rCore + 7 * sc, gap = 12 * sc;
    const minX = map.x + rOuter + 4 * sc;
    let resX = abX - (abR + gap + rOuter);
    if (resX < minX) resX = minX;
    hudCache.resurgeon.x = resX; hudCache.resurgeon.y = abY;
    hudCache.resurgeon.r = rCore; hudCache.resurgeon.rCore = rCore; hudCache.resurgeon.rOuter = rOuter;

    let hsX = abX - (abR + 21 * sc + gap + rOuter);
    if (hsX < minX) hsX = minX;
    hudCache.hardStab.x = hsX; hudCache.hardStab.y = abY;
    hudCache.hardStab.r = rCore; hudCache.hardStab.rCore = rCore; hudCache.hardStab.rOuter = rOuter;

    const sbR = 40 * sc;
    const sbX = abX, sbY = abY - abR - gap - sbR;
    hudCache.skill.x = sbX; hudCache.skill.y = sbY; hudCache.skill.r = sbR;

    const slW = 126 * sc, slH = 30 * sc;
    let slX = sbX - slW * 0.5;
    slX = Math.max(map.x + 8*sc, Math.min(map.x + map.w - slW - 8*sc, slX));
    const slY = sbY - sbR - slH - 14 * sc;
    hudCache.aimSlider.x = slX; hudCache.aimSlider.y = slY;
    hudCache.aimSlider.w = slW; hudCache.aimSlider.h = slH;
    hudCache.aimSlider.cx = slX + slW * 0.5; hudCache.aimSlider.cy = slY + slH * 0.5;

    const topR = 17 * sc, topInset = 10 * sc, topGap = 8 * sc;
    hudCache.debug.x = map.x + map.w - topInset - topR; hudCache.debug.y = map.y + topInset + topR; hudCache.debug.r = topR;
    hudCache.info.x  = hudCache.debug.x - topR*2 - topGap; hudCache.info.y = hudCache.debug.y; hudCache.info.r = topR;
    hudCache.mode.x  = map.x + topInset + topR; hudCache.mode.y = map.y + topInset + topR; hudCache.mode.r = topR;
    hudCache.menu.x  = hudCache.mode.x + topR*2 + topGap; hudCache.menu.y = hudCache.mode.y; hudCache.menu.r = topR;
    hudCache.reset.x = hudCache.menu.x + topR*2 + topGap; hudCache.reset.y = hudCache.mode.y; hudCache.reset.r = topR;
    hudCache.map.x = hudCache.reset.x + topR*2 + topGap; hudCache.map.y = hudCache.mode.y; hudCache.map.r = topR;
  }
  function makeOffscreen(w, h) {
    if (typeof document === 'undefined' || !document.createElement) return null;
    const c = document.createElement('canvas');
    c.width = Math.max(1, Math.ceil(w));
    c.height = Math.max(1, Math.ceil(h));
    return c;
  }
  function rebuildFloorCache(dpr) {
    if (!map.w || !map.h) return;
    const pad = 8;
    const fc = makeOffscreen((map.w + pad*2) * dpr, (map.h + pad*2) * dpr);
    if (!fc) return;
    const fctx = fc.getContext('2d');
    if (!fctx) return;
    fctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    fctx.translate(pad - map.x, pad - map.y);

    fctx.fillStyle = '#20242f';
    fctx.fillRect(map.x, map.y, map.w, map.h);

    fctx.strokeStyle = 'rgba(255,255,255,0.05)';
    fctx.lineWidth = 1;
    const grid = 48;
    fctx.beginPath();
    for (let x = map.x; x <= map.x + map.w; x += grid) { fctx.moveTo(x, map.y); fctx.lineTo(x, map.y + map.h); }
    for (let y = map.y; y <= map.y + map.h; y += grid) { fctx.moveTo(map.x, y); fctx.lineTo(map.x + map.w, y); }
    fctx.stroke();

    const cxC = map.x + map.w/2, cyC = map.y + map.h/2;
    const fv = fctx.createRadialGradient(cxC, cyC, Math.min(map.w,map.h)*0.2, cxC, cyC, Math.max(map.w,map.h)*0.7);
    fv.addColorStop(0, 'rgba(0,0,0,0)'); fv.addColorStop(1, 'rgba(0,0,0,0.35)');
    fctx.fillStyle = fv;
    fctx.fillRect(map.x, map.y, map.w, map.h);

    if (infoWrapCache.key === cacheKey && infoWrapCache.layout) {

    if (infoPage === 'notice') {

      // tiles side by side; phones stack them in a sheet at a readable scale.
      const phone = vp.w < 700;
      const dW = 520;
      let scale = phone ? 0.92 : Math.min(availW/dW, 1.15);

    const closeRect = padHit({ x: x0+W-cw-12*scale, y: y0+headH/2-cw/2, w: cw, h: cw }, hit);

    const fullX = x0 + pad, fullW = W - pad*2;
    const hitBox = (r, padY) => ({ x: r.x, y: r.y - padY, w: r.w, h: r.h + padY*2 });

    // mode tabs: MECHANICS and UPDATES side by side, switchable in one tap or with the arrow keys
    const tabY = y0 + headH + 10*scale, tabH = 36*scale, tabGap = 8*scale;
    const tabW = (fullW - tabGap) / 2;
    const tabs = [
      { id:'ainfo',   label:`MECHANICS  ·  ${AINFO_SECTIONS.length}`, rect:{ x:fullX,             y:tabY, w:tabW, h:tabH } },
      { id:'updates', label:`UPDATES  ·  ${UPDATE_LOG.length}`,       rect:{ x:fullX+tabW+tabGap, y:tabY, w:tabW, h:tabH } },
    ].map(t => ({ ...t, hit: hitBox(t.rect, 2*scale) }));

    const chips = [];
    let chipsBottom = tabY + tabH;
    if (infoPage === 'ainfo') {
      ctx.save(); ctx.font = `bold ${chipFont}px system-ui,sans-serif`;
      let cx = fullX, cy = tabY + tabH + 4*scale;
      for (const g of INFO_GROUPS) {

        if (infoFilter !== 'all' && meta.g !== infoFilter) continue;
        const lines = wrapText(sec.body, textW);

                  cardPadX, cardPadY, textPad, numW, gapY, tagH, chipFont,

  function setInfoPage(page) {

      if (pointInRect(x,y,L.aInfoRect))   { setInfoPage('ainfo');   return; }
      if (pointInRect(x,y,L.updatesRect)) { setInfoPage('updates'); return; }
      if (!pointInRect(x,y,L.panel)) { infoOpen=false; return; }
      return;
    }
    if (pointInRect(x,y,L.backRect)) { setInfoPage('notice'); return; }

    }
    for (const c of L.chips) {

  // One pointer model for mouse (id -1) and touch (its identifier). A press becomes a scrollbar drag,

  function infoPointerDown(id, x, y) {

    const inBar = !!L.bar && pointInRect(x, y, L.bar.hit);
    const inContent = pointInRect(x, y, L.contentRect);

    if (p.mode === 'bar') infoScrollTarget = barToScroll(y, getInfoLayout());

    else if (k === 'arrowdown') infoScrollBy(56*L.scale);

      if (ctx.measureText(test).width > maxWidth && cur) { lines.push(cur); cur = w; }
      else cur = test;

    const rsb = resetButton();

      if (Math.hypot(t.clientX-mpb.x,t.clientY-mpb.y)<=mpb.r) { mapOptionsOpen=true; e.preventDefault(); continue; }
      if (infoOpen) { infoPointerDown(t.identifier, t.clientX, t.clientY); e.preventDefault(); continue; }
      if (menuOpen) { handleMenuClick(t.clientX, t.clientY); e.preventDefault(); continue; }

      if (Math.hypot(t.clientX-db.x, t.clientY-db.y) <= db.r) { debug = !debug; e.preventDefault(); continue; }
      if (Math.hypot(t.clientX-ib.x, t.clientY-ib.y) <= ib.r) { infoOpen = true; setInfoPage('notice'); e.preventDefault(); continue; }
      if (Math.hypot(t.clientX-meb.x, t.clientY-meb.y) <= meb.r) { menuOpen = !menuOpen; e.preventDefault(); continue; }
      if (Math.hypot(t.clientX-rsb.x, t.clientY-rsb.y) <= rsb.r) { resetAll(); e.preventDefault(); continue; }

        const rb = resurgeonButton();
        if (Math.hypot(t.clientX-rb.x, t.clientY-rb.y) <= rb.r) {

          e.preventDefault(); continue;

        // While locked onto the generator, EXIT (skill-button slot) unlocks; the main round

        if (Math.hypot(t.clientX-sb.x, t.clientY-sb.y) <= sb.r) { exitGenLock(); e.preventDefault(); continue; }
        if (Math.hypot(t.clientX-btn.x, t.clientY-btn.y) <= btn.r) { genAction(); e.preventDefault(); continue; }
        e.preventDefault(); continue;
      }

        const sl = aimSlider();
        if (pointInRect(t.clientX, t.clientY, {x:sl.x-18, y:sl.y-18, w:sl.w+36, h:sl.h+36})) {

      if (resHoldId !== null && resHoldId === t.identifier) { resurgeonReleaseHold(); e.preventDefault(); }
      if (charging && t.identifier === chargeBtnId) { releaseCharge(); chargeBtnId = null; }
      if (joy.active && t.identifier === joy.id) {

  // ---------- helpers ----------

  function chargeBarRect() {

    ctx.beginPath();

    ctx.arcTo(x+w,y,x+w,y+h,r);
    ctx.arcTo(x+w,y+h,x,y+h,r);
    ctx.arcTo(x,y+h,x,y,r);

    if (p < 0.46) return lerp(WIND_SO, END_SO, easeIn((p-0.18)/0.28));

  // ---- HARD STAB swing animation ----
  // A completely different motion from the normal wide slash: instead of sweeping the blade

  // forward along his facing in one explosive thrust, holds the extension (with a small

  // stabOffset()    -> angular offset of the blade (ends at 0 = dead-straight ahead)
  // stabExtension() -> how far the whole weapon is pushed forward from the grip, in px
  const STAB_COIL_SO = -0.95;   // tight coiled-back pose during the wind-up

    if (p < 0.42) return lerp(STAB_COIL_SO, 0, easeIn((p-0.22)/0.20));              // explosive thrust
    if (p < 0.62) return Math.sin((p-0.42)/0.20*Math.PI*2) * 0.045;                 // held, slight tremor

      charge = Math.min(1, charge + pdt/CHARGE_TIME);

      // Burst hold-tracking: if a burst is banked, holding at 100% charge for BURST.holdTime
      // arms the burst swing (independent of, but stackable with, Second's overcharge below).
      if (charge >= 1 && burstCharges > 0 && !burstReady) {
        burstHoldT = Math.min(BURST.holdTime, burstHoldT + pdt);
        if (burstHoldT >= BURST.holdTime) {
          burstReady = true;
          burstBreakFX = 1;
          const bar = chargeBarRect();
          const comboNow = playerChar === 'second' && overcharged;
          if (comboNow) comboBreakFX = 1;
          const baseColor = comboNow ? ['#ffe28a','#b56cff','#ff9d3d'] : ['#ffce7a','#ff9d3d','#ffedb0'];
          for (let i=0;i<(comboNow?34:24);i++){
            const a = -Math.PI/2 + (Math.random()-0.5)*Math.PI*1.5;
            const sp = 80+Math.random()*(comboNow?260:190);
            addParticle({ x: bar.cx, y: bar.cy, vx: Math.cos(a)*sp, vy: Math.sin(a)*sp*0.6-60,
              life: 0.4+Math.random()*0.4, max:0.8, size: 1.4+Math.random()*2.8,
              color: baseColor[Math.floor(Math.random()*baseColor.length)], grav: 130, kind:'spark', glow:true });
          }
          for (let i=0;i<(comboNow?16:9);i++){
            addParticle({ x: bar.cx+(Math.random()-0.5)*bar.w, y: bar.y+Math.random()*bar.h,
              vx:(Math.random()-0.5)*36, vy:-60-Math.random()*90, life:0.45+Math.random()*0.35, max:0.8,
              size:1.2+Math.random()*1.8, color: comboNow ? '#fff0cf' : '#ffe9c2', grav: 40, kind:'spark', glow:true });
          }
          addTrauma(comboNow ? 0.5 : 0.32);
        }
      }

      if (playerChar === 'second' && charge >= 1) {
        overchargeT = Math.min(SECOND.overchargeHoldTime, overchargeT + pdt);
        if (!overcharged && (overchargePrimed || overchargeT >= SECOND.overchargeHoldTime)) {
          overcharged = true;
          overchargePrimed = false;
          overchargeBreakFX = 1;
          // If a burst is already armed the instant overcharge lands, this is the combo trigger.
          const comboNow = burstReady;
          if (comboNow) comboBreakFX = 1;
          // Passive feedback stays local to the charge bar (no camera shake / screen flash on
          // the player's view) — see the bar-break burst spawned right next to the bar below.
          const bar = chargeBarRect();
          const palette = comboNow ? ['#ffe28a','#d9aaff','#ff9d3d'] : ['#d9aaff','#7a2fe0'];
          for (let i=0;i<(comboNow?32:22);i++){
            const a = -Math.PI/2 + (Math.random()-0.5)*Math.PI*1.3;
            const sp = 60+Math.random()*(comboNow?220:160);
            addParticle({ x: bar.cx, y: bar.cy, vx: Math.cos(a)*sp, vy: Math.sin(a)*sp*0.6-40,
              life: 0.35+Math.random()*0.35, max:0.7, size: 1.2+Math.random()*2.4,
              color: palette[Math.floor(Math.random()*palette.length)], grav: 120, kind:'spark', glow:true });
          }
          for (let i=0;i<(comboNow?14:8);i++){
            addParticle({ x: bar.cx+(Math.random()-0.5)*bar.w, y: bar.y+Math.random()*bar.h,
              vx:(Math.random()-0.5)*30, vy:-40-Math.random()*60, life:0.4+Math.random()*0.3, max:0.7,
              size:1+Math.random()*1.6, color:'#f4e4ff', grav: 40, kind:'spark', glow:true });
          }
          addTrauma(comboNow ? 0.5 : 0);
        }
      }
    }
    if (overchargeBreakFX > 0) overchargeBreakFX = Math.max(0, overchargeBreakFX - dt*1.6);
    if (burstBreakFX > 0) burstBreakFX = Math.max(0, burstBreakFX - dt*1.4);
    if (comboBreakFX > 0) comboBreakFX = Math.max(0, comboBreakFX - dt*1.1);
    if (burstBankedFX > 0) burstBankedFX = Math.max(0, burstBankedFX - dt*1.8);
    // ---- HARD STAB indicator animation timers ----
    if (hardStabArmFX  > 0) hardStabArmFX  = Math.max(0, hardStabArmFX  - dt*1.5);
    if (hardStabFireFX > 0) hardStabFireFX = Math.max(0, hardStabFireFX - dt*1.6);
    hardStabPulse += dt;

    // ---- RESURGEON: immunity window, hold-to-fuse, and indicator animation ----
    if (player.immuneT > 0) {
      player.immuneT = Math.max(0, player.immuneT - pdt);
      if (player.immuneT <= 0) player.immuneFull = 0;   // back to the normal window next time
      // Immunity actively suppresses status effects for its whole duration, so anything
      // applied mid-window is scrubbed the same frame it lands.
      player.slowT = 0; player.blockSlowT = 0;
      player.overchargeSlowT = 0; player.burstSlowT = 0;
      if (player.immuneT > 0 && Math.random() < pdt*22) {
        const a = Math.random()*Math.PI*2, d = player.r + 4 + Math.random()*8;
        addParticle({ x: player.x + Math.cos(a)*d, y: player.y + Math.sin(a)*d,
          vx: Math.cos(a)*12, vy: Math.sin(a)*12 - 22,
          life: 0.35+Math.random()*0.35, max: 0.7, size: 0.9+Math.random()*1.5,
          color: RESURGEON.colorLight, grav: -12, kind:'spark', glow:true });
      }
    }
    if (player.healFlash > 0) player.healFlash = Math.max(0, player.healFlash - pdt*1.1);
    if (resGainFX > 0) resGainFX = Math.max(0, resGainFX - dt*1.7);
    if (resLostFX > 0) resLostFX = Math.max(0, resLostFX - dt*1.3);
    updateGhostTraps(dt);
    if (player.hasteT > 0) player.hasteT = Math.max(0, player.hasteT - pdt);
    if (dummy.hasteT  > 0) dummy.hasteT  = Math.max(0, dummy.hasteT  - ddt);
    if (player.hasteBurst > 0) player.hasteBurst = Math.max(0, player.hasteBurst - dt*2.2);
    if (dummy.hasteBurst  > 0) dummy.hasteBurst  = Math.max(0, dummy.hasteBurst  - dt*2.2);
    stepHasteFx('player', player, dt);
    stepHasteFx('dummy', dummy, dt);
    if (resFuseFX > 0) resFuseFX = Math.max(0, resFuseFX - dt*1.0);
    if (resIntFX  > 0) resIntFX  = Math.max(0, resIntFX  - dt*1.6);
    resPulse += dt;
    resAnim = lerp(resAnim, clamp(resCharges/RESURGEON.maxCharges, 0, 1), 1-Math.exp(-11*dt));
    resGlow = lerp(resGlow, resurgeonReady() ? 1 : 0, 1-Math.exp(-11*dt));
    // hold-to-fuse: only progresses while the button is genuinely held AND still at max charge
    if (resHolding) {
      if (!resurgeonReady()) { resHoldT = 0; resurgeonReleaseHold(); }
      else {
        resHoldT = Math.min(RESURGEON.holdTime, resHoldT + pdt);
        // charging-up sparks feeding into Jame while the fuse winds up
        if (Math.random() < pdt*40) {
          const a = Math.random()*Math.PI*2, d = 30+Math.random()*16;
          addParticle({ x: player.x + Math.cos(a)*d, y: player.y + Math.sin(a)*d,
            vx: -Math.cos(a)*110, vy: -Math.sin(a)*110,
            life: 0.22+Math.random()*0.2, max: 0.42, size: 1+Math.random()*1.8,
            color: RESURGEON.color, grav: 0, kind:'spark', glow:true });
        }
        if (resHoldT >= RESURGEON.holdTime) resurgeonActivate();
      }
    } else if (resHoldT > 0) {
      resHoldT = Math.max(0, resHoldT - dt*2.2);   // decay the ring if released early
    }
    hardStabAnim = lerp(hardStabAnim, clamp(hardStabHits/HARDSTAB.hitsNeeded, 0, 1), 1-Math.exp(-10*dt));
    hardStabGlow = lerp(hardStabGlow, hardStabReady ? 1 : 0, 1-Math.exp(-11*dt));

    // ---- DEEP WOUND: bleed ticks + blood trails left on the ground ----
    if (dummy.deepFlash > 0) dummy.deepFlash = Math.max(0, dummy.deepFlash - ddt);
    if (dummy.deepT > 0) {
      if (dummy.dead) {
        dummy.deepT = 0;
      } else {
        dummy.deepT = Math.max(0, dummy.deepT - ddt);
        dummy.deepTick -= ddt;
        if (dummy.deepTick <= 0 && !dummy.dead) {
          // catch up if a frame hitch swallowed more than one tick interval
          while (dummy.deepTick <= 0 && !dummy.dead) {
            dummy.deepTick += HARDSTAB.deepTickTime;
            deepWoundTick(dummy);
          }
        }
        // continuous blood-trail drips beneath the wounded survivor
        dummy.deepTrailT -= ddt;
        if (dummy.deepTrailT <= 0 && !dummy.dead) {
          dummy.deepTrailT = HARDSTAB.trailTime;
          bloodTrails.push({
            x: dummy.x + (Math.random()-0.5)*dummy.r*0.9,
            y: dummy.y + (Math.random()-0.5)*dummy.r*0.9 + dummy.r*0.35,
            r: 1.6+Math.random()*2.8, rot: Math.random()*Math.PI*2,
            life: 4.5, max: 4.5
          });
          if (bloodTrails.length > MAX_TRAILS) bloodTrails.splice(0, bloodTrails.length - MAX_TRAILS);
          // a couple of falling droplets so the bleed reads while standing still
          if (Math.random() < 0.5) {
            const a = Math.random()*Math.PI*2;
            addParticle({ x: dummy.x, y: dummy.y, vx: Math.cos(a)*20, vy: Math.sin(a)*20+30,
              life: 0.25+Math.random()*0.25, max: 0.5, size: 1+Math.random()*1.6,
              color: BLOOD[Math.floor(Math.random()*BLOOD.length)], grav: 300, kind:'blood' });
          }
        }
      }
    }
    // smooth progress-toward-next-burst ring, and a slow continuous spin for orbiting burst orbs
    hitStreakAnim = lerp(hitStreakAnim, clamp(hitStreak/BURST.streakNeeded, 0, 1), 1-Math.exp(-10*dt));
    burstOrbitAngle += dt * (burstReady ? 3.4 : 1.1);
    {
      // Bar length target: normal(1x) -> overcharge(1.55x) -> burst(1.9x) -> combo(2.6x).
      // Uses whichever tier is currently active/armed so the bar visibly grows in stages.
      const comboArmed = overcharged && burstReady;
      let targetGrow = 1;
      if (comboArmed) targetGrow = COMBO.barGrow;
      else if (burstReady) targetGrow = BURST.barGrow;
      else if (overcharged) targetGrow = SECOND.barGrow;
      barGrowAnim = lerp(barGrowAnim, targetGrow, 1-Math.exp(-9*dt));
    }
    if (block.cd > 0) block.cd = Math.max(0, block.cd - pdt);
    if (playerChar === 'jame' && block.state === 'windup') {
      block.timer += pdt;
      if (block.timer >= BLOCK.windup) { block.state='active'; block.timer=0; block.blocked=false; }
    } else if (block.state === 'active') {
      block.timer += pdt;
      if (block.timer >= BLOCK.active) {
        if (!block.blocked) {
          // Parry window expired without catching a swing: that's a missed block, which both
          // slows Jame and (per Resurgeon's rule) wipes any charges banked so far.
          if (player.immuneT <= 0) player.blockSlowT = BLOCK.missSlowTime;
          resurgeonBreakChain();
        }
        block.state='ready'; block.timer=0; block.blocked=false;
      }
    }
    if (dummy.flash > 0) dummy.flash = Math.max(0, dummy.flash - ddt);
    if (player.flash > 0) player.flash = Math.max(0, player.flash - pdt);
    if (dummy.slowT > 0) dummy.slowT = Math.max(0, dummy.slowT - ddt);
    if (player.slowT > 0) player.slowT = Math.max(0, player.slowT - pdt);
    if (player.overchargeSlowT > 0) player.overchargeSlowT = Math.max(0, player.overchargeSlowT - pdt);
    if (player.burstSlowT > 0) player.burstSlowT = Math.max(0, player.burstSlowT - pdt);
    if (player.blockSlowT > 0) player.blockSlowT = Math.max(0, player.blockSlowT - pdt);
    if (dummy.stunT > 0) dummy.stunT = Math.max(0, dummy.stunT - ddt);
    if (knife.cd > 0) knife.cd = Math.max(0, knife.cd - dt);
    if (gen.flash > 0) gen.flash = Math.max(0, gen.flash - dt);
    if (gen.failFlash > 0) gen.failFlash = Math.max(0, gen.failFlash - dt);
    if (gen.completeFlash > 0) gen.completeFlash = Math.max(0, gen.completeFlash - dt);
    if (gen.sparkT > 0) gen.sparkT = Math.max(0, gen.sparkT - dt);
    if (gen.repairing) {
      if (!canInteractGen()) { gen.repairing=false; gen.check=null; exitGenLock(); }
      else if (gen.progress < 1) {
        gen.spin += dt * 5.5;
        gen.progress = Math.min(1, gen.progress + dt / GEN.repairTime);
        if (gen.check) {
          gen.check.timer += dt;
          if (gen.check.timer >= (gen.check.dur || GEN.checkDuration)) endSkillCheck(false, false);
        } else {
          gen.skillT -= dt;
          if (gen.skillT <= 0) startSkillCheck();
        }
        if (gen.progress >= 1) { gen.repairing=false; gen.check=null; gen.completeFlash=1.2; exitGenLock(); }
      }
    }
    if (gen.sparkT > 0) {
      // small spark burst timed to a GREAT skill-check hit
      if (Math.random() < dt*40) {
        const a = Math.random()*Math.PI*2;
        addParticle({ x:gen.x+Math.cos(a)*gen.r*0.6, y:gen.y+Math.sin(a)*gen.r*0.6,
          vx:Math.cos(a)*90, vy:Math.sin(a)*90-40, life:0.2+Math.random()*0.2, max:0.4,
          size:1+Math.random()*1.6, color:'#fff3b0', grav:260, kind:'spark', glow:true });
      }
    }
    for (let i=genPopups.length-1;i>=0;i--){ genPopups[i].life-=dt; if (genPopups[i].life<=0) genPopups.splice(i,1); }
    if (trauma > 0) trauma = Math.max(0, trauma - dt*1.8);
    // smoothed health bars: hpDisp snaps fast, hpLag trails behind for a "damage echo" effect
    player.hpDisp = lerp(player.hpDisp, player.hp, 1-Math.exp(-16*dt));
    player.hpLag  = player.hpLag  > player.hp ? lerp(player.hpLag, player.hp, 1-Math.exp(-3*dt))  : player.hp;
    dummy.hpDisp  = lerp(dummy.hpDisp,  dummy.hp,  1-Math.exp(-16*dt));
    dummy.hpLag   = dummy.hpLag   > dummy.hp  ? lerp(dummy.hpLag,  dummy.hp,  1-Math.exp(-3*dt))  : dummy.hp;
    shakeAngle += dt * 23;
    camZoom = lerp(camZoom, 1, 1-Math.exp(-8*dt));
    camKickX = lerp(camKickX, 0, 1-Math.exp(-9*dt));
    camKickY = lerp(camKickY, 0, 1-Math.exp(-9*dt));
    if (vignettePulse > 0) vignettePulse = Math.max(0, vignettePulse - dt*1.6);
    menuAnim = lerp(menuAnim, menuOpen ? 1 : 0, 1-Math.exp(-14*dt));
    infoAnim = lerp(infoAnim, infoOpen ? 1 : 0, 1-Math.exp(-14*dt));
    // the content eases toward its scroll target instead of jumping
    if (infoOpen && infoAInfoOpen) {
      const d = infoScrollTarget - infoScroll;
      infoScroll = Math.abs(d) < 0.3 ? infoScrollTarget : infoScroll + d * (1 - Math.exp(-16*dt));
    }
    if (!dummy.dead && dummy.spawnT < 1) dummy.spawnT = Math.min(1, dummy.spawnT + dt/0.35);

    // input direction (fully ignored while locked onto a generator — survivor is pinned in place)
    let mx=0, my=0;
    // Raw directional input is always read. Translation is suppressed while docked on a
    // generator or fusing Resurgeon charges, but the raw vector is kept so a rooted Jame can
    // still TURN to face a threat even though he cannot reposition.
    let rawX = 0, rawY = 0;
    if (keys.has('w')||keys.has('arrowup'))    rawY-=1;
    if (keys.has('s')||keys.has('arrowdown'))  rawY+=1;
    if (keys.has('a')||keys.has('arrowleft'))   rawX-=1;
    if (keys.has('d')||keys.has('arrowright'))  rawX+=1;
    if (joy.active){ rawX=joy.dx; rawY=joy.dy; }
    const rawMag = Math.hypot(rawX, rawY);
    if (!genLock.active && !resHolding && !player.trapped) { mx = rawX; my = rawY; }
    const mag=Math.hypot(mx,my);
    if (mag>0.001){ mx/=mag; my/=mag; }

    if (genLock.active) {
      // Fully locked to the docking spot: snap position/velocity every frame so knockback,
      // collisions, etc. can't nudge the survivor off the generator.
      player.vx = 0; player.vy = 0;
      player.x = genLock.x; player.y = genLock.y;
      const targetAngle = Math.atan2(gen.y-player.y, gen.x-player.x);
      let diffL = targetAngle - player.angle;
      diffL = Math.atan2(Math.sin(diffL), Math.cos(diffL));
      player.angle += diffL * (1 - Math.exp(-ANG_SPEED*pdt));
    } else if (player.trapped) {
      // ---- ROOTED BY A GHOST TRAP ----
      // Pinned to the trap until 3 GREAT checks land or a hit frees them. Facing still
      // tracks input so the survivor can watch the killer close in.
      const tr = player.trapped;
      player.vx = 0; player.vy = 0;
      player.x = tr.x; player.y = tr.y;
      let targetAngleT = player.angle;
      if (rawMag > 0.05) targetAngleT = Math.atan2(rawY, rawX);
      else if (useMouseFacing && mouse.active) targetAngleT = Math.atan2(mouse.y-player.y, mouse.x-player.x);
      let diffT = targetAngleT - player.angle;
      diffT = Math.atan2(Math.sin(diffT), Math.cos(diffT));
      player.angle += diffT * (1 - Math.exp(-ANG_SPEED*pdt));
    } else if (resHolding) {
      // ---- ROOTED WHILE MERGING ----
      // Fusing Resurgeon charges plants Jame in place: velocity is killed and the position is
      // pinned every frame so leftover momentum, knockback or collisions can't slide him.
      // He may still turn to face a threat, which keeps the channel readable without letting
      // his reposition. Releasing the button restores movement instantly.
      if (resRootX === null) { resRootX = player.x; resRootY = player.y; }
      player.vx = 0; player.vy = 0;
      player.x = resRootX; player.y = resRootY;
      let targetAngleR = player.angle;
      if (rawMag > 0.05) targetAngleR = Math.atan2(rawY, rawX);
      else if (useMouseFacing && mouse.active) targetAngleR = Math.atan2(mouse.y-player.y, mouse.x-player.x);
      let diffR = targetAngleR - player.angle;
      diffR = Math.atan2(Math.sin(diffR), Math.cos(diffR));
      player.angle += diffR * (1 - Math.exp(-ANG_SPEED*pdt));
    } else {
    // target velocity (charged lunge overrides during its window)
    const lunging    = attack.active && attack.timer < ATTACK.lungeTime;
    const recovering = attack.active && attack.timer >= ATTACK.duration;
    let slowMult = 1;
    if (player.slowT > 0) slowMult = Math.min(slowMult, THROW.slowMult);
    if (player.blockSlowT > 0) slowMult = Math.min(slowMult, BLOCK.missSlowMult);
    // Recovery-speed penalty priority: a burst/combo swing always applies its own harsher,
    // outcome-independent penalty (player.burstSlowT). Otherwise, Second's overcharge passive
    // applies its own hit-only penalty (player.overchargeSlowT); a plain overcharge miss gets
    // no penalty. A normal swing just uses the standard ATTACK.recoverSpeed while recovering.
    if (recovering && !attack.overcharged && !attack.bursted) slowMult = Math.min(slowMult, ATTACK.recoverSpeed);
    if (player.overchargeSlowT > 0) slowMult = Math.min(slowMult, SECOND.overchargeSpeedMultHit);
    if (player.burstSlowT > 0) slowMult = Math.min(slowMult, player.burstSlowMult);
    // Ghost Trap escape haste is a BONUS, applied on top of any active slow.
    const hasteMult = player.hasteT > 0 ? GHOST.escapeHaste : 1;
    const speedMult  = slowMult * hasteMult;
    let tvx, tvy;
    if (lunging) { tvx=Math.cos(player.angle)*attack.lungeSpeed; tvy=Math.sin(player.angle)*attack.lungeSpeed; }
    else         { const roleSpeed=mode==='survivor'?1.18:1; tvx=mx*MAX_SPEED*speedMult*roleSpeed; tvy=my*MAX_SPEED*speedMult*roleSpeed; }
    const tS = 1 - Math.exp(-ACCEL*pdt);
    player.vx += (tvx - player.vx)*tS;
    player.vy += (tvy - player.vy)*tS;
    player.x += player.vx*pdt;
    player.y += player.vy*pdt;

    // facing
    let targetAngle = player.angle;
    if (mag > 0.05) targetAngle = Math.atan2(my,mx);
    else if (useMouseFacing && mouse.active) targetAngle = Math.atan2(mouse.y-player.y, mouse.x-player.x);
    let diff = targetAngle - player.angle;
    diff = Math.atan2(Math.sin(diff), Math.cos(diff));
    player.angle += diff * (1 - Math.exp(-ANG_SPEED*pdt));
    }
    syncThrowAimToJason();

    // clamp + collide
    player.x = clamp(player.x, map.x+player.r, map.x+map.w-player.r);
    player.y = clamp(player.y, map.y+player.r, map.y+map.h-player.r);
    if (!genLock.active) resolveCollisions();
    player.x = clamp(player.x, map.x+player.r, map.x+map.w-player.r);
    player.y = clamp(player.y, map.y+player.r, map.y+map.h-player.r);

    // Test run AI: periodically scores many short routes, predicts the player's motion,
    // avoids pinning itself to map edges, and varies its dodge so it doesn't run in a straight line.
    if (currentMap === 'Test run' && !dummy.dead && dummy.stunT <= 0) {
      const dx=player.x-dummy.x, dy=player.y-dummy.y, distance=Math.hypot(dx,dy)||1;
      const urgentThreat=mode==='killer' && (charging || attack.active || knife.state==='out' || knife.state==='return');
      chaseAI.think=urgentThreat?0:chaseAI.think-ddt;
      if (chaseAI.think<=0) {
        chaseAI.think=urgentThreat?0.025:0.075; chaseAI.phase+=1;
        const flee=mode==='killer';
        const horizon=flee?0.82:0.52;
        // Extrapolate short and long pursuit paths, clamping forecasts to the arena so a
        // boundary stop is not mistaken for continued full-speed travel through the wall.
        const forecast=(t)=>({x:clamp(player.x+player.vx*t,map.x+player.r,map.x+map.w-player.r),y:clamp(player.y+player.vy*t,map.y+player.r,map.y+map.h-player.r)});
        const pNear=forecast(0.32), pFar=forecast(horizon);
        const px=pFar.x, py=pFar.y;
        const threatVX=player.vx, threatVY=player.vy;
        const base=Math.atan2(flee ? -dy : py-dummy.y, flee ? -dx : px-dummy.x);
        let best=-Infinity, bestA=base;
        const speed=flee?216:250;
        const currentHeading=Math.hypot(dummy.vx,dummy.vy)>18?Math.atan2(dummy.vy,dummy.vx):chaseAI.heading;
        // Score a dense fan of candidate routes against two future positions; turn-cost stabilizes steering.
        for(let i=0;i<32;i++){
          const a=i*Math.PI*2/32;
          const tx=dummy.x+Math.cos(a)*speed*horizon, ty=dummy.y+Math.sin(a)*speed*horizon;
          const left=tx-map.x, right=map.x+map.w-tx, top=ty-map.y, bottom=map.y+map.h-ty;
          const edge=Math.min(left,right,top,bottom);
          const tNearX=dummy.x+Math.cos(a)*speed*0.32, tNearY=dummy.y+Math.sin(a)*speed*0.32;
          const sepNear=Math.hypot(tNearX-pNear.x,tNearY-pNear.y);
          const sepFar=Math.hypot(tx-px,ty-py);
          let hazardPenalty=0;
          if(flee){
            for(const trap of ghostTraps){ if(!trap.armed || trap.holding) continue; const td=Math.hypot(tx-trap.x,ty-trap.y); if(td<GHOST.radius+dummy.r+38) hazardPenalty+=((GHOST.radius+dummy.r+38-td)/10)*22; }
            if(knife.state==='out' || knife.state==='return'){

  function resolveCollisions() {
    for (let i=0;i<bodies.length;i++){
      for (let j=i+1;j<bodies.length;j++){
        const a=bodies[i], b=bodies[j];
        let dx=b.x-a.x, dy=b.y-a.y;
        let dist=Math.hypot(dx,dy)||0.0001;
        const minDist=a.r+b.r;
        if (dist<minDist){
          const overlap=minDist-dist;
          const nx=dx/dist, ny=dy/dist;
          const invA=a.static?0:1, invB=b.static?0:1, tot=invA+invB||1;
          a.x-=nx*overlap*(invA/tot); a.y-=ny*overlap*(invA/tot);
          b.x+=nx*overlap*(invB/tot); b.y+=ny*overlap*(invB/tot);
        }
      }
    }
  }

  // ---------- draw helpers ----------
  function drawBladeTrail(trail, colorTemplate) {
    if (trail.length < 2) return;
    ctx.save();
    ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    for (let i=1;i<trail.length;i++){
      const a = trail[i-1], b = trail[i];
      const k = i/trail.length;
      const alpha = k*k * Math.max(0, b.life/b.max) * 0.55;
      ctx.strokeStyle = colorTemplate.replace('ALPHA', alpha.toFixed(3));
      ctx.lineWidth = 1 + k*5;
      ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke();
    }
    ctx.restore();
  }
  function drawSword(cx, cy, absAngle, guardColor, glow, glowColor, bladeLen, opts) {

    // `ext` slides the whole weapon forward along its own axis for the Hard Stab thrust.
