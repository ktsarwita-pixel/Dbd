    const rsb=resetButton();
    const rsFlash = clamp(resetFlash, 0, 1);
    const rsSc = uiScale();
    ctx.save();

    ctx.beginPath(); ctx.arc(rsb.x, rsb.y, rsb.r + 6*rsSc, 0, Math.PI*2); ctx.clip();

    const press = Math.sin(clamp(rsFlash,0,1) * Math.PI) * 0.06;

    ctx.translate(rsb.x, rsb.y);

    const shG = ctx.createLinearGradient(rsb.x, rsb.y-rsb.r, rsb.x, rsb.y);

    ctx.fillStyle = shG; ctx.fillRect(rsb.x-rsb.r, rsb.y-rsb.r, rsb.r*2, rsb.r);

    // ---- RESET glyph: twin tapered arrows in a refresh cycle ----
    // Geometry is generated, not hand-tuned. Each arm is a TAPERED ribbon (built from an

    // arc's end. Orientation uses a formula verified to zero error:
    //   for a CCW arc ending at A1, the direction of travel is A1 + PI/2, and because the

      ctx.shadowBlur=0; ctx.shadowOffsetY=0;
      ctx.strokeStyle='rgba(130,175,255,0.30)'; ctx.lineWidth=1.5;
      roundRect(L.panel.x, L.panel.y, L.panel.w, L.panel.h, 16*sc); ctx.stroke();

      const isNotice = (L.mode === 'notice');
      const accent = L.mode === 'updates' ? '#ffcf85' : '#8fc7ff';
      const headBaseY = L.panel.y + L.headH/2;

      // header title
      ctx.fillStyle = accent;
      ctx.font=`bold ${Math.round(INFO_UI.headFont*sc)}px system-ui,sans-serif`;
      ctx.textAlign='center'; ctx.textBaseline='middle';
      ctx.fillText(isNotice ? 'NOTICE' : (L.mode === 'updates' ? 'UPDATES' : 'A-INFO'),
                   L.panel.x + L.panel.w/2, headBaseY);

      // header divider on sub-pages, so content can never appear to touch the title
      {
        const dy = L.panel.y + L.headH;
        const dg = ctx.createLinearGradient(L.panel.x, 0, L.panel.x+L.panel.w, 0);
        dg.addColorStop(0,   'rgba(130,175,255,0)');
        dg.addColorStop(0.5, 'rgba(130,175,255,0.32)');
        dg.addColorStop(1,   'rgba(130,175,255,0)');
        ctx.fillStyle = dg;
        ctx.fillRect(L.panel.x + 10*sc, dy, L.panel.w - 20*sc, 1.2);
      }

      // close button — generous tap target, small crisp glyph
      const cr0 = L.closeRect;
      ctx.strokeStyle='rgba(255,255,255,0.92)';
      ctx.lineWidth=Math.max(1.8, 2.2*sc); ctx.lineCap='round';
      ctx.beginPath();
      ctx.moveTo(cr0.gx, cr0.gy); ctx.lineTo(cr0.gx+cr0.gw, cr0.gy+cr0.gh);
      ctx.moveTo(cr0.gx+cr0.gw, cr0.gy); ctx.lineTo(cr0.gx, cr0.gy+cr0.gh);
      ctx.stroke();

      if (isNotice) {
        const hov = infoHover;
        const hovIn = (r) => !!hov && pointInRect(hov.x, hov.y, r);

        // header pill (left): marks the build as pre-game
        const pillTxt = 'PRE-GAME BUILD';
        ctx.font = `bold ${Math.round(9.5*sc)}px system-ui,sans-serif`;
        ctx.textAlign='center'; ctx.textBaseline='middle';
        const ph = 18*sc, pw = ctx.measureText(pillTxt).width + 16*sc;
        const pxp = L.panel.x + 14*sc, pyp = L.panel.y + L.headH/2 - ph/2;
        ctx.fillStyle = 'rgba(255,190,80,0.16)';
        roundRect(pxp, pyp, pw, ph, ph/2); ctx.fill();
        ctx.strokeStyle = 'rgba(255,190,80,0.7)'; ctx.lineWidth = 1;
        roundRect(pxp, pyp, pw, ph, ph/2); ctx.stroke();
        ctx.fillStyle = '#ffd98a';
        ctx.fillText(pillTxt, pxp + pw/2, pyp + ph/2);

        // notice card with an amber accent bar
        const nc = L.cardRect;
        ctx.fillStyle = 'rgba(255,255,255,0.038)';
        roundRect(nc.x, nc.y, nc.w, nc.h, 12*sc); ctx.fill();
        ctx.strokeStyle = 'rgba(255,255,255,0.08)'; ctx.lineWidth = 1;
        roundRect(nc.x, nc.y, nc.w, nc.h, 12*sc); ctx.stroke();
        ctx.fillStyle = 'rgba(255,190,80,0.9)';
        roundRect(nc.x + 8*sc, nc.y + 12*sc, 3*sc, nc.h - 24*sc, 1.5*sc); ctx.fill();
        ctx.fillStyle = 'rgba(234,240,252,0.96)';
        const nPx = Math.round(L.nFont);
        ctx.font = `${nPx}px system-ui,sans-serif`;
        ctx.textAlign='left'; ctx.textBaseline='alphabetic';
        for (let i = 0; i < L.lines.length; i++) {
          ctx.fillText(L.lines[i], L.textRect.x,
                       L.textRect.y + i*L.lineH + (L.lineH - L.nFont)/2 + L.nFont*0.8);
        }

        // two large tiles
        const curVer = (UPDATE_LOG.find(u => u.current) || UPDATE_LOG[0]).version.replace('UPDATE ', 'v');
        const tile = (r, accent, icon, title, subLines, stat) => {
          const hv = hovIn(r);
          ctx.fillStyle = `rgba(${accent},${hv ? 0.2 : 0.09})`;
          roundRect(r.x, r.y, r.w, r.h, 14*sc); ctx.fill();
          ctx.strokeStyle = `rgba(${accent},${hv ? 0.85 : 0.45})`; ctx.lineWidth = hv ? 1.5 : 1.2;
          roundRect(r.x, r.y, r.w, r.h, 14*sc); ctx.stroke();
          // icon disc
          const icx = r.x + 30*sc, icy = r.y + 30*sc;
          ctx.fillStyle = `rgba(${accent},0.22)`;
          ctx.beginPath(); ctx.arc(icx, icy, 18*sc, 0, Math.PI*2); ctx.fill();
          ctx.strokeStyle = 'rgba(255,255,255,0.95)'; ctx.lineWidth = 1.8*sc; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
          icon(icx, icy);
          // title and two-line subtitle
          ctx.textAlign='left'; ctx.textBaseline='middle';
          ctx.fillStyle = '#ffffff';
          ctx.font = `bold ${Math.round(16*sc)}px system-ui,sans-serif`;
          ctx.fillText(title, r.x + 60*sc, r.y + 30*sc);
          ctx.fillStyle = 'rgba(220,229,244,0.82)';
          ctx.font = `${Math.round(12.5*sc)}px system-ui,sans-serif`;
          ctx.fillText(subLines[0], r.x + 60*sc, r.y + 52*sc);
          ctx.fillText(subLines[1], r.x + 60*sc, r.y + 69*sc);
          // stat line and chevron
          ctx.textBaseline='alphabetic';
          ctx.fillStyle = `rgba(${accent},1)`;
          ctx.font = `bold ${Math.round(11*sc)}px system-ui,sans-serif`;
          ctx.fillText(stat, r.x + 18*sc, r.y + r.h - 16*sc);
          const chx = r.x + r.w - 22*sc, chy = r.y + r.h/2;
          ctx.strokeStyle = hv ? 'rgba(255,255,255,0.95)' : 'rgba(255,255,255,0.5)';
          ctx.lineWidth = 2*sc;
          ctx.beginPath(); ctx.moveTo(chx - 3*sc, chy - 6*sc); ctx.lineTo(chx + 3*sc, chy); ctx.lineTo(chx - 3*sc, chy + 6*sc); ctx.stroke();
        };
        tile(L.aInfoRect, '143,199,255',
          (x, y) => {   // open book
            ctx.beginPath();
            ctx.moveTo(x - 9*sc, y - 5*sc); ctx.quadraticCurveTo(x - 4*sc, y - 7*sc, x, y - 3.5*sc);
            ctx.lineTo(x, y + 7*sc); ctx.quadraticCurveTo(x - 4*sc, y + 4.5*sc, x - 9*sc, y + 6*sc); ctx.closePath();
            ctx.moveTo(x + 9*sc, y - 5*sc); ctx.quadraticCurveTo(x + 4*sc, y - 7*sc, x, y - 3.5*sc);
            ctx.lineTo(x, y + 7*sc); ctx.quadraticCurveTo(x + 4*sc, y + 4.5*sc, x + 9*sc, y + 6*sc); ctx.closePath();
            ctx.stroke();
          },
          'A-INFO', ['Game mechanics for', 'every character'],
          `${AINFO_SECTIONS.length} entries  ·  ${INFO_GROUPS.length - 1} groups`);
        tile(L.updatesRect, '255,190,80',
          (x, y) => {   // upward arrow over a base line: a new build
            ctx.beginPath();
            ctx.moveTo(x, y + 8*sc); ctx.lineTo(x, y - 7*sc);
            ctx.moveTo(x - 6*sc, y - 1*sc); ctx.lineTo(x, y - 7*sc); ctx.lineTo(x + 6*sc, y - 1*sc);
            ctx.moveTo(x - 7*sc, y + 8*sc); ctx.lineTo(x + 7*sc, y + 8*sc);
            ctx.stroke();
          },
          'UPDATES', ['What changed in', 'each build'],
          `${curVer}  ·  ${UPDATE_LOG.length} releases`);

        // footer hint
        ctx.fillStyle = 'rgba(170,186,210,0.7)';
        ctx.font = `${Math.round(11*sc)}px system-ui,sans-serif`;
        ctx.textAlign='center'; ctx.textBaseline='middle';
        ctx.fillText(L.phone ? 'Tap a tile to open it' : 'Tap a tile to open it  ·  Esc closes',
                     L.footRect.x + L.footRect.w/2, L.footRect.y + L.footRect.h/2);
      } else {
        // back arrow
        const br = L.backRect;
        ctx.strokeStyle='rgba(255,255,255,0.92)'; ctx.lineCap='round'; ctx.lineJoin='round';
        ctx.lineWidth=Math.max(1.8, 2.2*sc);
        const bmx = br.gx+br.gw*0.68, bmy = br.gy+br.gh/2, bs = br.gh*0.34;
        ctx.beginPath(); ctx.moveTo(bmx, bmy-bs); ctx.lineTo(bmx-bs*1.05, bmy); ctx.lineTo(bmx, bmy+bs); ctx.stroke();

        const hov = infoHover;
        const hovIn = (r) => !!hov && pointInRect(hov.x, hov.y, r);

        // mode tabs
        ctx.textAlign='center'; ctx.textBaseline='middle';
        for (const t of L.tabs) {
          const r = t.rect, on = t.id === L.mode;
          const a = t.id === 'updates' ? '255,190,80' : '143,199,255';
          ctx.fillStyle = on ? `rgba(${a},0.20)` : (hovIn(t.hit) ? 'rgba(255,255,255,0.07)' : 'rgba(255,255,255,0.03)');
          roundRect(r.x, r.y, r.w, r.h, 10*sc); ctx.fill();
          ctx.strokeStyle = on ? `rgba(${a},0.9)` : 'rgba(255,255,255,0.12)'; ctx.lineWidth = on ? 1.5 : 1;
          roundRect(r.x, r.y, r.w, r.h, 10*sc); ctx.stroke();
          ctx.fillStyle = on ? '#ffffff' : 'rgba(220,229,244,0.78)';
          ctx.font = `bold ${Math.round(INFO_UI.labelFont*sc)}px system-ui,sans-serif`;
          ctx.fillText(t.label, r.x + r.w/2, r.y + r.h/2);
        }

        // filter chips (mechanics only)
        if (L.mode === 'ainfo') {
          ctx.font = `bold ${L.chipFont}px system-ui,sans-serif`;
          for (const c of L.chips) {
            const r = c.rect, on = c.id === infoFilter, hv = hovIn(c.hit);
            ctx.fillStyle = on ? hexA(c.col, 0.22) : (hv ? 'rgba(255,255,255,0.08)' : 'rgba(255,255,255,0.03)');
            roundRect(r.x, r.y, r.w, r.h, r.h/2); ctx.fill();
            ctx.strokeStyle = on ? hexA(c.col, 0.9) : 'rgba(255,255,255,0.14)'; ctx.lineWidth = on ? 1.4 : 1;
            roundRect(r.x, r.y, r.w, r.h, r.h/2); ctx.stroke();
            ctx.fillStyle = on ? '#ffffff' : 'rgba(220,229,244,0.8)';
            ctx.fillText(c.label, r.x + r.w/2, r.y + r.h/2);
          }
        }

        // cards
        const cr = L.contentRect;
        ctx.save();
        roundRect(cr.x, cr.y, cr.w, cr.h, 8*sc); ctx.clip();
        const sy0 = cr.y - infoScroll;
        const bodyPx = Math.round(L.bodyFont);
        const bodyCol = 'rgba(220,229,244,0.93)';
        for (const cd of L.cards) {
          const top = sy0 + cd.y;
          if (top + cd.h < cr.y - 2 || top > cr.y + cr.h + 2) continue;   // only draw what is on screen
          const hv = hovIn({ x:cr.x, y:top, w:cr.w, h:cd.h });
          ctx.fillStyle = hv ? 'rgba(255,255,255,0.075)' : 'rgba(255,255,255,0.038)';
          roundRect(cr.x, top, cr.w, cd.h, 12*sc); ctx.fill();
          ctx.strokeStyle = hv ? 'rgba(255,255,255,0.16)' : 'rgba(255,255,255,0.08)'; ctx.lineWidth = 1;
          roundRect(cr.x, top, cr.w, cd.h, 12*sc); ctx.stroke();
          const textX = cr.x + L.textPad;

          if (cd.kind === 'ainfo') {
            // accent bar in the group colour, then the tag pill, then the title, then the body
            ctx.fillStyle = cd.col;
            roundRect(cr.x + L.accentX, top + 10*sc, L.accentW, cd.h - 20*sc, L.accentW/2); ctx.fill();
            const py = top + L.cardPadY, ph = L.tagH;
            ctx.font = `bold ${Math.round(9.5*sc)}px system-ui,sans-serif`;
            ctx.textAlign='center'; ctx.textBaseline='middle';
            const tagTxt = cd.tag.toUpperCase();
            const tw = ctx.measureText(tagTxt).width + 14*sc;
            ctx.fillStyle = hexA(cd.col, 0.16);
            roundRect(textX, py, tw, ph, ph/2); ctx.fill();
            ctx.strokeStyle = hexA(cd.col, 0.6); ctx.lineWidth = 1;
            roundRect(textX, py, tw, ph, ph/2); ctx.stroke();
            ctx.fillStyle = cd.col;
            ctx.fillText(tagTxt, textX + tw/2, py + ph/2);

            const titleMidY = py + ph + 5*sc + L.titleLineH/2;
            ctx.textAlign='left'; ctx.textBaseline='middle';
            ctx.fillStyle = '#ffffff';
            ctx.font = `bold ${Math.round(L.titleFont)}px system-ui,sans-serif`;
            ctx.fillText(cd.title, textX, titleMidY);

            ctx.textBaseline='alphabetic';
            ctx.fillStyle = bodyCol;
            ctx.font = `${bodyPx}px system-ui,sans-serif`;
            let ty = top + L.cardPadY + (ph + 5*sc + L.titleLineH) + 8*sc;
            for (const ln of cd.lines) {
              ctx.fillText(ln, textX, ty + (L.lineH - L.bodyFont)/2 + L.bodyFont*0.8);
              ty += L.lineH;
            }
          } else {
            // version heading with a NOW badge on the current build, then numbered notes
            const cur = cd.rel.current;
            const acc = cur ? '255,190,80' : '150,172,204';
            ctx.fillStyle = `rgba(${acc},0.9)`;
            roundRect(cr.x + L.accentX, top + 10*sc, L.accentW, cd.h - 20*sc, L.accentW/2); ctx.fill();
            const midY = top + L.cardPadY + L.verLineH/2;
            ctx.textAlign='left'; ctx.textBaseline='middle';
            ctx.fillStyle = cur ? '#ffd98a' : '#a8bcd8';
            ctx.font = `bold ${Math.round(L.verFont)}px system-ui,sans-serif`;
            ctx.fillText(cd.rel.version, textX, midY);
            if (cur) {
              const vw = ctx.measureText(cd.rel.version).width;
              const bw = 38*sc, bh = 15*sc, bx = textX + vw + 9*sc, by = midY - bh/2;
              ctx.fillStyle = 'rgba(255,190,80,0.92)';
              roundRect(bx, by, bw, bh, 4*sc); ctx.fill();
              ctx.fillStyle = '#2a1c05'; ctx.font = `bold ${Math.round(9*sc)}px system-ui,sans-serif`;
              ctx.textAlign='center';
              ctx.fillText('NOW', bx + bw/2, midY);
            }
            ctx.textAlign='right'; ctx.fillStyle = 'rgba(170,186,210,0.8)';
            ctx.font = `${Math.round(10.5*sc)}px system-ui,sans-serif`;
            ctx.fillText(`${cd.rel.notes.length} changes`, cr.x + cr.w - L.cardPadX, midY);

            let ty = top + L.cardPadY + L.verLineH + 8*sc;
            for (let n = 0; n < cd.notes.length; n++) {
              const lines = cd.notes[n];
              const cy = ty + L.lineH/2;
              const badgeX = textX + 7*sc;
              ctx.fillStyle = cur ? 'rgba(255,190,80,0.18)' : 'rgba(150,172,204,0.14)';
              ctx.beginPath(); ctx.arc(badgeX, cy, 8*sc, 0, Math.PI*2); ctx.fill();
              ctx.fillStyle = cur ? '#ffd98a' : '#a8bcd8';
              ctx.font = `bold ${Math.round(9*sc)}px system-ui,sans-serif`;
              ctx.textAlign='center'; ctx.textBaseline='middle';
              ctx.fillText(String(n+1), badgeX, cy);
              ctx.textAlign='left'; ctx.textBaseline='alphabetic';
              ctx.fillStyle = bodyCol;
              ctx.font = `${bodyPx}px system-ui,sans-serif`;
              let ly = ty;
              for (const ln of lines) {
                ctx.fillText(ln, textX + L.numW, ly + (L.lineH - L.bodyFont)/2 + L.bodyFont*0.8);
                ly += L.lineH;
              }
              ty += lines.length*L.lineH + 8*sc;
            }
          }
        }
        ctx.restore();

        // scrollbar: draggable track and thumb
        if (L.bar) {
          const b = L.bar;
          ctx.fillStyle = 'rgba(255,255,255,0.07)';
          roundRect(b.x, b.y, b.w, b.h, 2*sc); ctx.fill();
          const thumbY = b.y + (b.h - b.thumbH) * (infoScroll / Math.max(1, L.maxScroll));
          const active = (infoPtr && infoPtr.mode === 'bar') || hovIn(b.hit);
          const tc = L.mode === 'updates' ? '255,200,120' : '160,205,255';
          ctx.fillStyle = `rgba(${tc},${active ? 0.95 : 0.7})`;
          roundRect(b.x, thumbY, b.w, b.thumbH, 2*sc); ctx.fill();
        }
        // fade edges hint that there is more to scroll
        const fadeH = 16*sc;
        const gTop = ctx.createLinearGradient(0, cr.y, 0, cr.y+fadeH);
        gTop.addColorStop(0, 'rgba(26,31,42,0.98)'); gTop.addColorStop(1, 'rgba(26,31,42,0)');
        ctx.fillStyle = gTop; ctx.fillRect(cr.x, cr.y, cr.w, fadeH);
        const gBot = ctx.createLinearGradient(0, cr.y+cr.h-fadeH, 0, cr.y+cr.h);
        gBot.addColorStop(0, 'rgba(22,26,36,0)'); gBot.addColorStop(1, 'rgba(22,26,36,0.98)');
        ctx.fillStyle = gBot; ctx.fillRect(cr.x, cr.y+cr.h-fadeH, cr.w, fadeH);
      }
      ctx.textAlign='left'; ctx.textBaseline='alphabetic';
      ctx.restore();
    }
  }

  // ---- HASTE trail state (speed-driven) ----
  // The haste streaks and chevrons no longer run on a fixed clock. Their phase advances with the
  // entity's REAL smoothed speed, so they stop when it stops, speed up with it and slow down with it.
  // While it is standing still, the trail gives way to small particles puffing off the body.
  const hasteFxSt = { player: null, dummy: null };
  function hasteFxNew() { return { sp:0, mv:0, ph:0, ph2:0, puffAcc:0, puffs:[], full: GHOST.escapeHasteTime }; }
  hasteFxSt.player = hasteFxNew(); hasteFxSt.dummy = hasteFxNew();
  function hasteFxReset() {
    for (const k of ['player','dummy']) hasteFxSt[k] = hasteFxNew();
  }
  function stepHasteFx(who, ent, dt) {
    const st = hasteFxSt[who];
    // the drain ring's full length: the duration the current haste session started with
    if (!(ent.hasteT > 0)) st.full = GHOST.escapeHasteTime;
    else if (ent.hasteT > st.full) st.full = ent.hasteT;
    const top = MAX_SPEED * GHOST.escapeHaste;                 // full haste sprint = 1.0
    const spd = Math.hypot(ent.vx || 0, ent.vy || 0);
    const target = clamp(spd / top, 0, 1.2);
    // ease the visual speed toward the real speed: speeding up and slowing down both read smoothly
    st.sp += (target - st.sp) * (1 - Math.exp(-dt * 8));
    if (st.sp < 0.001) st.sp = 0;
    st.ph  = (st.ph  + dt * 2.6 * st.sp) % 1;                  // streak clock (cycles/s scale with speed)
    st.ph2 = (st.ph2 + dt * 2.2 * st.sp) % 1;                  // chevron clock
    st.mv  = clamp((st.sp - 0.06) / 0.2, 0, 1);                // 0 = stopped, 1 = clearly moving
    // while stopped (and still hasted), particles puff out of the body and drift away
    const idle = 1 - st.mv;
    if (ent.hasteT > 0 && idle > 0.05 && !ent.dead) {
      st.puffAcc += dt * 16 * idle;
      while (st.puffAcc >= 1) {
        st.puffAcc -= 1;
        if (st.puffs.length >= 40) break;
        const ang = Math.random() * Math.PI * 2;
        const rr  = ent.r * (0.9 + Math.random() * 0.3);
        const sp2 = 16 + Math.random() * 22;
        const life = 0.55 + Math.random() * 0.3;
        st.puffs.push({ x: ent.x + Math.cos(ang)*rr, y: ent.y + Math.sin(ang)*rr,
                        vx: Math.cos(ang)*sp2, vy: Math.sin(ang)*sp2,
                        life, max: life, r: 1.6 + Math.random() * 1.6 });
      }
    } else {
      st.puffAcc = 0;
    }
    for (let i = st.puffs.length - 1; i >= 0; i--) {
      const p = st.puffs[i];
      p.life -= dt;
      p.x += p.vx * dt; p.y += p.vy * dt;
      const damp = Math.max(0, 1 - 2.2 * dt);
      p.vx *= damp; p.vy *= damp;
      if (p.life <= 0) { st.puffs[i] = st.puffs[st.puffs.length - 1]; st.puffs.pop(); }
    }
  }

  // ---- GHOST TRAP escape haste indicator ----
  // Shared by both entities so the survivor's +25% speed burst looks identical whether you are
  // the one running or the killer watching them get away.
  // Visual language is deliberately distinct from every other status already on screen:
  //   * SLOWED      = solid blue ring at r+10
  //   * DEEP WOUND  = draining red ring at r+8
  //   * IMMUNE      = green hex lattice at r+9 / drain ring at r+13
  //   * HASTE (new) = GREEN SPEED CHEVRONS sweeping backwards + trailing motion streaks,
  //                   drawn at r+6 with its own drain arc at r+16, so no band collides.
  // Placed here (not inline) so it can be called from the player and dummy draw passes.
  function drawHasteFX(ex, ey, er, hasteT, facingAngle, vx, vy, burst, who) {
    const st = hasteFxSt[who];
    const k = clamp(hasteT / (st.full || GHOST.escapeHasteTime), 0, 1);
    if (k <= 0) return;
    // fade the whole effect out over its last 0.5s so it never pops off
    const a = clamp(hasteT / 0.5, 0, 1);
    // Chevrons trail BEHIND the direction of travel. Fall back to facing when standing still
    // so the effect still reads while stationary.
    const spd = Math.hypot(vx || 0, vy || 0);
    const dir = spd > 12 ? Math.atan2(vy, vx) : facingAngle;
    const back = dir + Math.PI;
    const ca = Math.cos(back), sa = Math.sin(back);
    const px = -sa, py = ca;

    ctx.save();
    ctx.lineCap = 'round'; ctx.lineJoin = 'round';

    // 1) speed streaks flowing off the back — the core "I am fast" cue
    for (let i = 0; i < 5; i++) {
      const phase = (st.ph + i * 0.2) % 1;             // 0..1, cycles outward at a speed-driven rate
      const d0 = er + 2 + phase * (10 + 14 * st.sp);   // faster = streaks reach further
      const len = (8 + (1 - phase) * 7) * (0.45 + 0.55 * st.sp);
      const off = ((i % 2) ? 1 : -1) * (3 + (i >> 1) * 5);
      const fade = Math.sin(phase * Math.PI) * st.mv;  // fade in then out, gone once stopped
      ctx.strokeStyle = `rgba(140,255,190,${0.55 * fade * a})`;
      ctx.lineWidth = 2.4 - phase * 1.2;
      ctx.beginPath();
      ctx.moveTo(ex + ca * d0 + px * off,           ey + sa * d0 + py * off);
      ctx.lineTo(ex + ca * (d0 + len) + px * off,   ey + sa * (d0 + len) + py * off);
      ctx.stroke();
    }

    // 2) stacked chevrons pointing along travel, sweeping outward behind the runner
    for (let i = 0; i < 3; i++) {
      const phase = (st.ph2 + i / 3) % 1;
      const d = er + 4 + phase * (8 + 12 * st.sp);
      const w = 6.5 - phase * 2.0;
      const fade = Math.sin(phase * Math.PI) * st.mv;
      ctx.strokeStyle = `rgba(90,255,165,${0.75 * fade * a})`;
      ctx.lineWidth = 2.6 - phase * 1.0;
      ctx.beginPath();
      ctx.moveTo(ex + ca * (d + 4) + px * w, ey + sa * (d + 4) + py * w);
      ctx.lineTo(ex + ca * d,                ey + sa * d);
      ctx.lineTo(ex + ca * (d + 4) - px * w, ey + sa * (d + 4) - py * w);
      ctx.stroke();
    }

    // 1b) while stopped, the trail gives way to particles puffing off the body (world space)
    for (const p of st.puffs) {
      const f = clamp(p.life / p.max, 0, 1);
      ctx.fillStyle = `rgba(150,255,200,${0.7 * f * a})`;
      ctx.beginPath(); ctx.arc(p.x, p.y, p.r * (0.4 + 0.6 * f), 0, Math.PI * 2); ctx.fill();
    }

    // 3) forward-leaning arc hugging the body, brightest at the leading edge
    ctx.strokeStyle = `rgba(150,255,200,${0.45 * a})`;
    ctx.lineWidth = 2.6;
    ctx.beginPath();
    ctx.arc(ex, ey, er + 6, dir - 0.85, dir + 0.85);
    ctx.stroke();

    // 3b) one-shot launch ring: snaps outward the instant they are freed
    const bk = clamp(burst || 0, 0, 1);
    if (bk > 0.01) {
      ctx.save();
      ctx.globalAlpha = bk * a;
      ctx.strokeStyle = '#d9ffe9';
      ctx.lineWidth = 3.2 * bk;
      ctx.beginPath();
      ctx.arc(ex, ey, er + 4 + (1 - bk) * 30, 0, Math.PI*2);
      ctx.stroke();
      ctx.restore();
    }

    // 4) duration drain ring — sits outside every other status band
    ctx.strokeStyle = `rgba(190,255,220,${0.8 * a})`;
    ctx.lineWidth = 2.4;
    ctx.beginPath();
    ctx.arc(ex, ey, er + 16, -Math.PI / 2, -Math.PI / 2 + k * Math.PI * 2);
    ctx.stroke();
    ctx.restore();

    // 5) label — sits ABOVE the nameplate band (which occupies ey - r - 30) so the two can
    // never overlap, and is clamped so it cannot slide off the top of the screen.
    ctx.fillStyle = `rgba(170,255,205,${0.9 * a})`;
    ctx.font = 'bold 10px system-ui,sans-serif';
    ctx.textAlign = 'center'; ctx.textBaseline = 'alphabetic';
    ctx.fillText(`HASTE +25%  ${hasteT.toFixed(1)}s`,
                 ex, clamp(ey - er - 46, 12, getViewport().h - 8));
    ctx.textAlign = 'left';
  }

  function drawShadow(x,y,r){
    ctx.save(); ctx.translate(x, y+r*0.55); ctx.scale(1,0.45);
    ctx.beginPath(); ctx.arc(0,0,r*0.95,0,Math.PI*2);
    ctx.fillStyle='rgba(0,0,0,0.28)'; ctx.fill(); ctx.restore();
  }

  // ---------- loop ----------
  let last=performance.now();

  // ---------- ADMIN PANEL (dev tools) ----------
  // Toggle with the ADMIN button (bottom-left) or F9. Options:
  //   FPS counter  - live frames-per-second readout at the top centre
  //   No cooldown  - knife, block and ghost-trap cooldowns are held at zero
  //   Unlimited HP - the player is held at full health every frame
  const admin = { fps: false, noCD: false, hp: false };
  let adminFrames = 0, adminT0 = 0, adminFpsVal = 0;
  function adminApply() {
    if (admin.noCD) { knife.cd = 0; block.cd = 0; ghostCD = 0; }
    if (admin.hp)   { player.hp = 100; player.hpDisp = 100; player.hpLag = 100; }
  }
  function adminFrame(now) {
    adminFrames++;
    if (!adminT0) adminT0 = now;
    const span = now - adminT0;
    if (span >= 500) {
      adminFpsVal = Math.round(adminFrames * 1000 / span);
      adminFrames = 0; adminT0 = now;
      if (admin.fps && adminFpsEl) adminFpsEl.textContent = 'FPS ' + adminFpsVal;
    }
  }
  // ---- give console ----
  //   give player <effect> [seconds]   timed buffs/debuffs and one-off charges
  //   give passive <name>              a character's own passive; must match the selected character
  // Effects use the same state the real game uses, so they play out normally.
  const ADMIN_EFFECTS = {
    haste:      { timed: true, dflt: () => GHOST.escapeHasteTime,
                  run(d) { player.hasteT = d; player.hasteBurst = 1; hasteFxSt.player.full = d; } },
    slow:       { timed: true, dflt: () => THROW.slowTime,
                  run(d) { player.slowT = d; } },
    blockslow:  { timed: true, dflt: () => BLOCK.missSlowTime,
                  run(d) { player.blockSlowT = d; } },
    overcharge: { timed: true, dflt: () => SECOND.overchargeSpeedTimeHit,
                  run(d) { player.overchargeSlowT = d; } },
    burstslow:  { timed: true, dflt: () => BURST.speedTime,
                  run(d) { player.burstSlowT = d; player.burstSlowMult = BURST.speedMult; } },
    immune:     { timed: true, dflt: () => RESURGEON.immuneTime,
                  run(d) { player.immuneT = d; player.immuneFull = d; } },
    burst:      { run() { burstCharges++; burstBankedFX = 1; return { note: 'charges: ' + burstCharges }; } },
    clear:      { run() { player.hasteT = 0; player.hasteBurst = 0; player.slowT = 0; player.blockSlowT = 0;
                          player.overchargeSlowT = 0; player.burstSlowT = 0; player.immuneT = 0;
                          return { note: 'timed effects removed' }; } },
  };
  // Passives: each one belongs to a single character.
  const ADMIN_PASSIVES = {
    hardstab:   { who: 'jason',  label: 'Hard Stab', note: 'armed for next M1',
                  run() { hardStabReady = true; hardStabArmFX = 1; } },
    resurgeon:  { who: 'jame',   label: 'Resurgeon', note: 'charges full',
                  run() { resCharges = RESURGEON.maxCharges; } },
    overcharge: { who: 'second', label: 'Overcharge', note: 'next full charge breaks at once',
                  run() { overchargePrimed = true; } },
  };
  const ADMIN_NAME = { jason: 'Jason', jame: 'Jame', second: 'Second' };
  const adminHas = (obj, k) => Object.prototype.hasOwnProperty.call(obj, k);
  function adminRunPassive(rest) {
    const s = rest.trim();
    if (!s) return { ok: false, msg: 'Passives: ' + adminPassiveList() + '. Example: give passive hardstab' };
    if (/\d/.test(s)) return { ok: false, msg: 'Passives have no duration' };
    const key = s.replace(/[\s_-]+/g, '');
    if (!adminHas(ADMIN_PASSIVES, key)) return { ok: false, msg: 'Unknown passive "' + s + '". Passives: ' + adminPassiveList() };
    const pz = ADMIN_PASSIVES[key];
    if (playerChar !== pz.who)
      return { ok: false, msg: pz.label + ' is ' + ADMIN_NAME[pz.who] + "'s passive. Switch to " + ADMIN_NAME[pz.who] + ' first (now ' + ADMIN_NAME[playerChar] + ')' };
    pz.run();
    return { ok: true, msg: 'Gave passive ' + key + ' (' + pz.note + ')' };
  }
  function adminPassiveList() {
    return Object.keys(ADMIN_PASSIVES).map(k => k + ' (' + ADMIN_NAME[ADMIN_PASSIVES[k].who] + ')').join(', ');
  }
  function adminRunCommand(raw) {
    let s = String(raw || '').trim().toLowerCase();
    if (!s) return { ok: false, msg: 'Type e.g. give player haste 10 or give passive hardstab' };
    s = s.replace(/^give\s+/, '');
    if (/^passive(\s|$)/.test(s)) return adminRunPassive(s.replace(/^passive\s*/, ''));
    s = s.replace(/^player\s+/, '');
    let dur = null;
    const m = s.match(/^(.*?)\s+(\d+(?:\.\d+)?)\s*s?$/);      // trailing number = seconds
    if (m) { s = m[1]; dur = parseFloat(m[2]); }
    const key = s.replace(/[\s_-]+/g, '');
    if (!adminHas(ADMIN_EFFECTS, key)) {
      if (adminHas(ADMIN_PASSIVES, key)) return { ok: false, msg: key + ' is a passive. Use: give passive ' + key };
      return { ok: false, msg: 'Unknown effect "' + s + '". Try: ' + Object.keys(ADMIN_EFFECTS).join(', ') };
    }
    const eff = ADMIN_EFFECTS[key];
    if (dur !== null && !eff.timed) return { ok: false, msg: key + ' has no duration' };
    if (dur !== null && !(dur >= 0.1 && dur <= 600)) return { ok: false, msg: 'Duration must be between 0.1 and 600 seconds' };
    const d = eff.timed ? (dur !== null ? dur : eff.dflt()) : null;
    const r = eff.run(d) || {};
    if (key === 'clear') return { ok: true, msg: 'Cleared timed effects' };
    const note = eff.timed ? d.toFixed(1) + 's' + (dur !== null ? ' custom' : '') : (r.note || '');
    return { ok: true, msg: 'Gave player ' + key + (note ? ' (' + note + ')' : '') };
  }

  const adminFpsEl = document.createElement('div');
  adminFpsEl.style.cssText = 'position:fixed;top:8px;left:50%;transform:translateX(-50%);z-index:9998;' +
    'font:700 13px/1 ui-monospace,Menlo,Consolas,monospace;color:#9dffb0;background:rgba(0,0,0,0.55);' +
    'padding:4px 8px;border-radius:6px;pointer-events:none;display:none;';
  document.body.appendChild(adminFpsEl);

  // ---- admin console (F9) ----
  // Sections: DEBUG switches, EFFECTS chips (with an optional seconds box), PASSIVES buttons,
  // a COMMAND line for typed commands, and a LOG of recent results.
  const adminStyle = document.createElement('style');
  adminStyle.textContent = [
    '#adminUI{position:fixed;left:10px;bottom:10px;z-index:9999;font:12px system-ui,sans-serif;color:#e8ecf4;display:flex;flex-direction:column-reverse;align-items:flex-start;gap:6px;}',
    '#adminUI button{font:600 11px system-ui,sans-serif;color:#dfe6f5;background:#161c2a;border:1px solid #3c4661;border-radius:6px;padding:5px 8px;cursor:pointer;}',
    '#adminUI button:hover{background:#1d2536;border-color:#6a7490;}',
    '#adminUI button:active{transform:translateY(1px);}',
    '#adminUI #adminBtn{font:700 11px system-ui,sans-serif;letter-spacing:.08em;padding:6px 10px;border-color:#6a7490;background:rgba(20,24,34,0.9);}',
    '#adminPanel{display:none;width:300px;max-height:calc(100vh - 70px);overflow:auto;padding:12px;background:rgba(10,12,18,0.95);border:1px solid #2c3446;border-radius:10px;box-shadow:0 8px 24px rgba(0,0,0,0.45);box-sizing:border-box;}',
    '#adminPanel .adm-top{display:flex;align-items:center;justify-content:space-between;}',
    '#adminPanel .adm-title{font-weight:700;font-size:13px;}',
    '#adminPanel .adm-x{padding:1px 7px;font-size:12px;}',
    '#adminPanel .adm-char{color:#8c95aa;font-size:11px;margin-top:3px;}',
    '#adminPanel .adm-sec{margin-top:10px;padding-top:8px;border-top:1px solid #262e40;}',
    '#adminPanel .adm-h{font:700 10px system-ui,sans-serif;letter-spacing:.12em;color:#8c95aa;margin-bottom:6px;}',
    '#adminPanel .adm-row{display:flex;align-items:center;justify-content:space-between;padding:3px 0;cursor:pointer;}',
    '#adminPanel input[type=checkbox]{width:16px;height:16px;accent-color:#4dd24d;cursor:pointer;margin:0;}',
    '#adminPanel .adm-grid{display:grid;grid-template-columns:1fr 1fr;gap:5px;}',
    '#adminPanel .adm-grid button{text-align:left;}',
    '#adminPanel .adm-grid button span{display:block;color:#7d869b;font-weight:400;font-size:10px;}',
    '#adminPanel .adm-dur{display:flex;align-items:center;gap:8px;margin-bottom:6px;color:#aab3c6;font-size:11px;}',
    '#adminPanel input.adm-in{flex:1;min-width:0;background:#0c0f16;color:#e8ecf4;border:1px solid #3c4661;border-radius:5px;padding:5px 6px;font:12px ui-monospace,Menlo,Consolas,monospace;box-sizing:border-box;}',
    '#adminPanel .adm-cmd{display:flex;gap:6px;}',
    '#adminPanel .adm-log{max-height:120px;overflow:auto;font:11px ui-monospace,Menlo,Consolas,monospace;line-height:1.45;}',
    '#adminPanel .adm-log div{padding:1px 0;}',
    '#adminPanel .adm-note{margin-top:10px;color:#7d869b;font-size:10.5px;line-height:1.5;}',
  ].join('\n');
  document.head.appendChild(adminStyle);

  const ADM_CHIPS = [
    ['haste', 'Haste', 'escape +25% speed', 1],
    ['slow', 'Slow', 'movement -20%', 1],
    ['blockslow', 'Block slow', 'block-miss slow', 1],
    ['overcharge', 'Overcharge slow', 'post-overcharge slow', 1],
    ['burstslow', 'Burst slow', 'burst recovery slow', 1],
    ['immune', 'Immunity', 'status immunity', 1],
    ['burst', '+1 burst', 'banked burst charge', 0],
    ['clear', 'Clear timed', 'remove timed effects', 0],
  ];
  const ADM_PASSIVE_BTNS = [
    ['hardstab', 'Hard Stab', 'Jason'],
    ['resurgeon', 'Resurgeon', 'Jame'],
    ['overcharge', 'Overcharge', 'Second'],
  ];
  const adminUI = document.createElement('div');
  adminUI.id = 'adminUI';
  adminUI.innerHTML =
    '<button id="adminBtn" type="button">ADMIN</button>' +
    '<div id="adminPanel">' +
      '<div class="adm-top"><div class="adm-title">Admin console</div>' +
        '<button id="adminClose" class="adm-x" type="button" title="Close (F9)">\u2715</button></div>' +
      '<div class="adm-char" id="adm_char"></div>' +
      '<div class="adm-sec"><div class="adm-h">DEBUG</div>' +
        '<label class="adm-row"><span>FPS counter</span><input type="checkbox" id="adm_fps"></label>' +
        '<label class="adm-row"><span>No cooldown</span><input type="checkbox" id="adm_cd"></label>' +
        '<label class="adm-row"><span>Unlimited HP</span><input type="checkbox" id="adm_hp"></label>' +
      '</div>' +
      '<div class="adm-sec"><div class="adm-h">EFFECTS</div>' +
        '<div class="adm-dur"><span>Seconds</span><input class="adm-in" id="adm_dur" type="number" min="0.1" max="600" step="0.5" placeholder="default"></div>' +
        '<div class="adm-grid">' +
          ADM_CHIPS.map(c => '<button type="button" data-eff="' + c[0] + '" data-timed="' + c[3] + '">' + c[1] +
            '<span>' + c[2] + '</span></button>').join('') +
        '</div></div>' +
      '<div class="adm-sec"><div class="adm-h">PASSIVES</div>' +
        '<div class="adm-grid">' +
          ADM_PASSIVE_BTNS.map(c => '<button type="button" data-pas="' + c[0] + '">' + c[1] +
            '<span>' + c[2] + ' only</span></button>').join('') +
        '</div></div>' +
      '<div class="adm-sec"><div class="adm-h">COMMAND</div>' +
        '<div class="adm-cmd">' +
          '<input class="adm-in" id="adm_cmd" type="text" placeholder="give player haste 10" spellcheck="false" autocomplete="off">' +
          '<button type="button" id="adm_cmd_go">Run</button>' +
        '</div></div>' +
      '<div class="adm-sec"><div class="adm-h">LOG</div><div class="adm-log" id="adm_log"></div></div>' +
      '<div class="adm-note">Passives need their character selected. Seconds only apply to timed effects. Typing in this panel never moves your character.</div>' +
    '</div>';
  document.body.appendChild(adminUI);
  // keep admin clicks away from the game's own pointer/touch handlers
  for (const ev of ['pointerdown', 'pointerup', 'touchstart', 'touchend', 'mousedown', 'mouseup', 'click']) {
    adminUI.addEventListener(ev, (e) => e.stopPropagation());
  }
  // typing in a console box stays in the box; F9 and button presses still reach the game
  for (const ev of ['keydown', 'keyup']) {
    adminUI.addEventListener(ev, (e) => { if (e.key !== 'F9' && e.target.tagName === 'INPUT') e.stopPropagation(); });
  }
  const adminPanel = document.getElementById('adminPanel');
  const adminLog = document.getElementById('adm_log');
  const adminCharEl = document.getElementById('adm_char');
  const adminDur = document.getElementById('adm_dur');
  const adminCmd = document.getElementById('adm_cmd');
  const ADM_NAMES = { jason: 'Jason', jame: 'Jame', second: 'Second' };
  function adminRefresh() {
    adminCharEl.textContent = 'Playing as ' + (ADM_NAMES[playerChar] || playerChar) + ' \u00b7 ' + (mode === 'killer' ? 'Killer' : 'Survivor');
  }
  function adminSetPanel(open) {
    adminPanel.style.display = open ? 'block' : 'none';
    if (open) adminRefresh();
  }
  function adminSyncUI() {
    adminFpsEl.style.display = admin.fps ? 'block' : 'none';
    if (!admin.fps) adminFpsEl.textContent = '';
    const n = (admin.fps ? 1 : 0) + (admin.noCD ? 1 : 0) + (admin.hp ? 1 : 0);
    document.getElementById('adminBtn').textContent = n ? 'ADMIN \u00b7 ' + n : 'ADMIN';
  }
  function adminNotify(r) {
    const row = document.createElement('div');
    row.textContent = (r.ok ? '\u2713 ' : '\u2715 ') + r.msg;
    row.style.color = r.ok ? '#9dffb0' : '#ff9a8a';
    adminLog.insertBefore(row, adminLog.firstChild);
    while (adminLog.children.length > 6) adminLog.removeChild(adminLog.lastChild);
    adminRefresh();
  }
  function adminExec(cmd) { const r = adminRunCommand(cmd); adminNotify(r); return r; }

  document.getElementById('adminBtn').addEventListener('click', () => adminSetPanel(adminPanel.style.display !== 'block'));
  document.getElementById('adminClose').addEventListener('click', () => adminSetPanel(false));
  document.getElementById('adm_fps').addEventListener('change', (e) => { admin.fps = e.target.checked; adminSyncUI(); });
  document.getElementById('adm_cd').addEventListener('change', (e) => { admin.noCD = e.target.checked; adminSyncUI(); });
  document.getElementById('adm_hp').addEventListener('change', (e) => { admin.hp = e.target.checked; adminSyncUI(); });
  adminUI.querySelectorAll('[data-eff]').forEach((btn) => btn.addEventListener('click', () => {
    const secs = adminDur.value.trim();
    const timed = btn.dataset.timed === '1';
    adminExec('give player ' + btn.dataset.eff + (timed && secs ? ' ' + secs : ''));
    btn.blur();                                                  // hand the keyboard back to the game
  }));
  adminUI.querySelectorAll('[data-pas]').forEach((btn) => btn.addEventListener('click', () => {
    adminExec('give passive ' + btn.dataset.pas);
    btn.blur();
  }));
  function adminSubmit() {
    const r = adminExec(adminCmd.value);
    if (r.ok) adminCmd.select();
  }
  document.getElementById('adm_cmd_go').addEventListener('click', adminSubmit);
  adminCmd.addEventListener('keydown', (e) => { if (e.key === 'Enter') { e.preventDefault(); adminSubmit(); adminCmd.blur(); } });
  adminDur.addEventListener('keydown', (e) => { if (e.key === 'Enter') { e.preventDefault(); adminDur.blur(); } });
  for (const inp of [adminCmd, adminDur]) {
    inp.addEventListener('focus', () => keys.clear());          // a key held while clicking in must not keep walking the player
  }
  window.addEventListener('keydown', (e) => {
    if (e.key === 'F9') { e.preventDefault(); adminSetPanel(adminPanel.style.display !== 'block'); }
  });
  setInterval(() => { if (adminPanel.style.display === 'block') adminRefresh(); }, 400);
  adminRefresh();

  let rafId = 0;
  function loop(now){
    if (document.hidden) { rafId = 0; return; }
    const dt=Math.min((now-last)/1000, 0.05);
    last=now;
    adminFrame(now);
    update(dt); draw();
    rafId=requestAnimationFrame(loop);
  }
  document.addEventListener('visibilitychange', () => {
    if (document.hidden) {
      if (rafId) cancelAnimationFrame(rafId);
      rafId = 0;
      last = performance.now();
    } else if (!rafId) {
      last = performance.now();
      rafId = requestAnimationFrame(loop);
    }
  });

  window.addEventListener('resize', resize);
  window.addEventListener('orientationchange', resize);
  window.addEventListener('load', resize);
  if (window.visualViewport) {
    window.visualViewport.addEventListener('resize', resize);
    window.visualViewport.addEventListener('scroll', resize);
  }
  resize();
  layoutPlayer();
  initAmbientMotes();
  setTimeout(resize, 250);   // catch late mobile layout / URL-bar settle
  rafId=requestAnimationFrame(loop);
})();
</script>
</body>
</html>
