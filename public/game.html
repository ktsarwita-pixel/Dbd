    dialBloom(d, '255,64,48', glow * (0.55 + 0.45*beat));
    dialShockRing(d, armK,  HARDSTAB.color, R*0.90, 2.3*sc);
    dialShockRing(d, fireK, '#ffd9d0',      R*0.60, 2.0*sc);

    if (armed) { dialFace(d, '#6b1a14', '#3d0d0a', '#1e0605', 0.85); }
    else       { dialFace(d, 'rgba(58,49,53,0.94)', 'rgba(38,32,35,0.94)', 'rgba(22,18,21,0.94)', 0.5); }

    dialSegments(d, HARDSTAB.hitsNeeded, hardStabAnim, sc,
      armed ? `rgba(255,158,132,${0.92+0.08*beat})` : '#ff6146',
      'rgba(255,255,255,0.12)',
      armed ? 'rgba(255,80,60,0.9)' : null);

    // ---- ICON: upright dagger emblem, two-tone steel blade (SVG) ----
    const steelInk = armed ? '#ffffff' : 'rgba(238,233,236,0.92)';
    const steelDk  = armed ? 'rgba(200,190,196,0.95)' : 'rgba(160,156,166,0.9)';
    const guardInk = armed ? '#e0503e' : 'rgba(164,130,132,0.88)';
    const woodInk  = armed ? '#8e3426' : 'rgba(110,92,96,0.9)';
    paintSvg([
      { d: SKILL_ART.dBladeL, fill: steelInk },
      { d: SKILL_ART.dBladeR, fill: steelDk },
      { d: SKILL_ART.fuller,  stroke: 'rgba(40,30,36,0.4)', w: 0.6 },
      { d: SKILL_ART.dGuard,  fill: guardInk },
      { d: SKILL_ART.dGrip,   stroke: woodInk, w: 2.4 },
      { d: SKILL_ART.dWrap,   stroke: 'rgba(255,255,255,0.35)', w: 0.6 },
      { d: SKILL_ART.dPommel, fill: guardInk },
    ], d.x, d.y - 1.2, R * 1.2 * (armed ? 1 + 0.025*beat : 0.95), steelInk);

    dialLabel(d, armed ? 'READY' : `${hardStabHits}/${HARDSTAB.hitsNeeded}`, sc,
      armed ? `rgba(255,208,198,${0.94+0.06*beat})` : 'rgba(228,206,206,0.82)', 0.62);
    dialRim(d, sc, armed ? `rgba(255,152,132,${0.88+0.12*beat})` : 'rgba(255,255,255,0.24)', armed ? 1.9 : 1.3);

    ctx.restore();   // release the containment clip
    ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';
  }

  // ---- RESURGEON button renderer ----
  // Same STRICT CONTAINMENT CONTRACT as the Hard Stab badge: one clip on rOuter, label inside
  // the dial, hard clearance from the GEN/FIX button, the BLOCK/EXIT button and the arena edge.
  function drawResurgeonButton() {
    const d = resurgeonButton();
    const sc = uiScale();
    const R = d.rCore;
    const armed = resurgeonReady();
    const glow = clamp(resGlow, 0, 1);
    const beat = 0.5 + 0.5*Math.sin(resPulse*3.6);
    const gainK = clamp(resGainFX, 0, 1);
    const lostK = clamp(resLostFX, 0, 1);
    const fuseK = clamp(resFuseFX, 0, 1);
    const intK  = clamp(resIntFX, 0, 1);
    const holdK = clamp(resHoldT / RESURGEON.holdTime, 0, 1);
    const alpha = clamp(Math.max(resAnim, glow, gainK, lostK, fuseK, intK) * 1.2, 0, 1);

    ctx.save();
    ctx.globalAlpha = alpha;
    // ---- THE CONTAINMENT CLIP ----
    ctx.beginPath(); ctx.arc(d.x, d.y, d.rOuter, 0, Math.PI*2); ctx.clip();

    // bloom brightens as the fuse winds up, so holding visibly "charges" the button
    dialBloom(d, '60,224,138', Math.max(glow * (0.5 + 0.5*beat), easeIn(holdK)));
    dialShockRing(d, gainK, RESURGEON.color,      R*0.92, 2.4*sc);
    dialShockRing(d, lostK, RESURGEON.colorWarn,  R*0.55, 2.2*sc);
    dialShockRing(d, fuseK, RESURGEON.colorLight, R*0.35, 2.7*sc);
    dialShockRing(d, intK,  RESURGEON.colorWarn,  R*0.30, 2.5*sc);

    if (armed)            dialFace(d, '#1f8a5c', '#0d5537', '#052a1c', 0.9);
    else if (lostK > 0.2) dialFace(d, 'rgba(104,46,46,0.94)', 'rgba(64,26,26,0.94)', 'rgba(34,14,14,0.94)', 0.45);
    else                  dialFace(d, 'rgba(44,62,54,0.94)', 'rgba(28,40,35,0.94)', 'rgba(15,23,20,0.94)', 0.5);

    dialSegments(d, RESURGEON.maxCharges, resAnim, sc,
      armed ? `rgba(158,255,206,${0.94+0.06*beat})` : RESURGEON.color,
      'rgba(255,255,255,0.12)',
      armed ? 'rgba(60,224,138,0.95)' : null);

    // ---- MERGE ANIMATION ----
    // Reads as three charges being physically pulled together and compressed into one core.
    // Everything is derived from holdK (0..1) so it stays perfectly in sync with the 1.3s hold,
    // and every radius is a fraction of R so it can never escape the containment clip.
    if (holdK > 0.004) {
      const fuseR = R - 8.6*sc;
      const eK = easeInOut(holdK);

      // 1) the three charge orbs spiral inward from their segment positions and converge
      for (let i = 0; i < RESURGEON.maxCharges; i++) {
        const baseA = -Math.PI/2 + i*(Math.PI*2/RESURGEON.maxCharges);
        // each orb sweeps 2/3 turn inward while collapsing toward the centre
        const a = baseA + eK * Math.PI * 1.35;
        const orbR = (R - 3.4*sc) * (1 - eK*0.94);
        const ox = d.x + Math.cos(a)*orbR, oy = d.y + Math.sin(a)*orbR;
        // comet tail behind each orb
        ctx.save();
        ctx.globalAlpha = alpha * (0.30 + 0.35*eK);
        ctx.strokeStyle = RESURGEON.color; ctx.lineWidth = 1.6*sc; ctx.lineCap = 'round';
        ctx.beginPath(); ctx.arc(d.x, d.y, orbR, a - 0.55*(1-eK*0.6), a); ctx.stroke();
        ctx.restore();
        // the orb itself, shrinking as it merges into the core
        const orbSize = (2.3 - 0.9*eK) * sc;
        ctx.save();
        glowDisk(ox, oy, orbSize * 3.2 + 2*sc, '120,255,190', 0.85);
        const og = ctx.createRadialGradient(ox, oy, 0.2, ox, oy, Math.max(0.05, orbSize));
        og.addColorStop(0, '#ffffff'); og.addColorStop(1, RESURGEON.color);
        ctx.fillStyle = og;
        ctx.beginPath(); ctx.arc(ox, oy, Math.max(0.05, orbSize), 0, Math.PI*2); ctx.fill();
        ctx.restore();
      }

      // 2) the fusing core swells at the centre as the orbs arrive
      const coreR = (1.2 + 5.4*easeIn(holdK)) * sc * (1 + 0.10*Math.sin(resPulse*22));
      ctx.save();
      glowDisk(d.x, d.y, coreR * 2.4 + 4*sc, '214,255,236', 0.4 + 0.5*holdK);
      const cg = ctx.createRadialGradient(d.x, d.y, 0.2, d.x, d.y, Math.max(0.05, coreR));
      cg.addColorStop(0, '#ffffff');
      cg.addColorStop(0.55, RESURGEON.colorLight);
      cg.addColorStop(1, 'rgba(60,224,138,0)');
      ctx.fillStyle = cg;
      ctx.beginPath(); ctx.arc(d.x, d.y, Math.max(0.05, coreR), 0, Math.PI*2); ctx.fill();
      ctx.restore();

      // 3) containment arc sweeping closed, with a bright leading head
      const a1 = -Math.PI/2 + holdK*Math.PI*2;
      ctx.save();
      glowRing(d.x, d.y, fuseR, -Math.PI/2, a1, '214,255,236', 2.5*sc, 0.8);
      ctx.strokeStyle = RESURGEON.colorLight; ctx.lineWidth = 2.5*sc; ctx.lineCap = 'round';
      ctx.beginPath(); ctx.arc(d.x, d.y, fuseR, -Math.PI/2, a1); ctx.stroke();
      ctx.restore();
      ctx.save();
      ctx.fillStyle = '#ffffff';
      ctx.globalAlpha = alpha * (0.7 + 0.3*Math.sin(resPulse*20));
      ctx.beginPath();
      ctx.arc(d.x + Math.cos(a1)*fuseR, d.y + Math.sin(a1)*fuseR, 1.9*sc, 0, Math.PI*2);
      ctx.fill();
      ctx.restore();

      // 4) tightening ring in the final third — the "about to pop" tell
      if (holdK > 0.62) {
        const t2 = (holdK - 0.62) / 0.38;
        ctx.save();
        ctx.globalAlpha = alpha * (0.35 + 0.5*t2);
        ctx.strokeStyle = '#ffffff'; ctx.lineWidth = (0.9 + 1.5*t2)*sc;
        ctx.beginPath(); ctx.arc(d.x, d.y, fuseR * (1 - 0.55*easeIn(t2)), 0, Math.PI*2); ctx.stroke();
        ctx.restore();
      }
    }

    // ---- ICON: glass shield with a raised medical plus (SVG) ----
    const resInk    = armed ? '#f2fff8' : 'rgba(202,220,210,0.8)';
    const resAccent = armed ? `rgba(132,255,198,${0.9+0.1*beat})` : 'rgba(152,202,177,0.46)';
    paintSvg([
      { d: SKILL_ART.shield,   fill: glassFill(armed ? 'rgba(60,224,138,0.5)' : 'rgba(60,110,90,0.4)', armed ? 'rgba(10,64,42,0.6)' : 'rgba(12,20,17,0.42)') },
      { d: SKILL_ART.shield,   stroke: resAccent, w: 1.7 },
      { d: SKILL_ART.shieldIn, stroke: resAccent, w: 0.7 },
      { d: SKILL_ART.plus,     stroke: 'rgba(255,255,255,0.22)', w: 4.8 },
      { d: SKILL_ART.plus,     stroke: resInk, w: 2.6 },
    ], d.x, d.y - 1.2, R * 1.3, resInk);

    // interrupted flash: a brief warm wash so a cancelled merge is unmistakable
    if (intK > 0.01) {
      ctx.save();
      ctx.globalAlpha = alpha * intK * 0.45;
      ctx.fillStyle = RESURGEON.colorWarn;
      ctx.beginPath(); ctx.arc(d.x, d.y, R*0.955, 0, Math.PI*2); ctx.fill();
      ctx.restore();
    }
    dialLabel(d,
      intK > 0.35 ? 'HIT!' : (armed ? (resHolding ? 'FUSING' : 'HOLD') : `${resCharges}/${RESURGEON.maxCharges}`), sc,
      intK > 0.35 ? `rgba(255,214,214,${0.9+0.1*beat})`
                  : (armed ? `rgba(196,255,224,${0.95+0.05*beat})` : 'rgba(202,222,212,0.82)'), 0.62);
    dialRim(d, sc, armed ? `rgba(158,255,206,${0.9+0.1*beat})` : 'rgba(255,255,255,0.24)', armed ? 2.0 : 1.4);

    ctx.restore();   // release the containment clip
    ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';
  }

  function drawHitbox(hb, active) {
    ctx.save();
    ctx.translate(hb.cx, hb.cy);
    ctx.rotate(hb.ang);
    ctx.fillStyle   = active ? 'rgba(255,80,80,0.28)' : 'rgba(255,80,80,0.12)';
    ctx.fillRect(-hb.halfLen, -hb.halfW, hb.halfLen*2, hb.halfW*2);
    ctx.strokeStyle = active ? 'rgba(255,230,0,1)' : 'rgba(255,230,0,0.6)';
    ctx.lineWidth=2;
    ctx.strokeRect(-hb.halfLen, -hb.halfW, hb.halfLen*2, hb.halfW*2);
    ctx.restore();
  }
  function drawNameplate(text, x, y, color) {
    const sc = Math.max(0.85, Math.min(1.1, getViewport().w/520));
    ctx.font=`bold ${Math.round(12*sc)}px system-ui,sans-serif`;
    ctx.textAlign='center'; ctx.textBaseline='middle';
    const nkey = text + '|' + sc.toFixed(3);
    let tw = nameplateCache.get(nkey);
    if (tw === undefined) { tw = ctx.measureText(text).width; nameplateCache.set(nkey, tw); }
    const w = tw + 14*sc;
    ctx.fillStyle='rgba(0,0,0,0.5)';
    roundRect(x-w/2, y-9*sc, w, 18*sc, 9*sc); ctx.fill();
    ctx.fillStyle=color; ctx.fillText(text, x, y);
    ctx.textAlign='left'; ctx.textBaseline='alphabetic';
  }
  function drawCharRow(r, id, selected, sc) {
    sc = sc || 1;
    const skin = CHAR_SKINS[id];
    ctx.fillStyle   = selected ? 'rgba(255,220,120,0.18)' : 'rgba(255,255,255,0.06)';
    roundRect(r.x, r.y, r.w, r.h, 10*sc); ctx.fill();
    ctx.strokeStyle = selected ? 'rgba(255,220,120,0.9)' : 'rgba(255,255,255,0.18)';
    ctx.lineWidth   = selected ? 2.5 : 1.5;
    roundRect(r.x, r.y, r.w, r.h, 10*sc); ctx.stroke();
    const sx=r.x+24*sc, sy=r.y+r.h/2, sr=12*sc;
    const g=ctx.createRadialGradient(sx-sr*0.3, sy-sr*0.3, sr*0.2, sx, sy, sr);
    g.addColorStop(0, skin.c0); g.addColorStop(1, skin.c1);
    ctx.beginPath(); ctx.arc(sx, sy, sr, 0, Math.PI*2); ctx.fillStyle=g; ctx.fill();
    ctx.lineWidth=1.5; ctx.strokeStyle=skin.stroke; ctx.stroke();
    ctx.fillStyle='#fff'; ctx.font=`bold ${Math.round(18*sc)}px system-ui,sans-serif`; ctx.textAlign='left'; ctx.textBaseline='middle';
    ctx.fillText(skin.name, r.x+46*sc, sy);
    if (selected){ ctx.fillStyle='rgba(255,220,120,0.95)'; ctx.font=`bold ${Math.round(12*sc)}px system-ui,sans-serif`; ctx.textAlign='right'; ctx.fillText('SELECTED', r.x+r.w-14*sc, sy); }
  }

  // ---------- draw ----------
  function draw() {
    const vp=getViewport();
    ctx.clearRect(0,0,vp.w,vp.h);

    // ---- ambient background gradient + drifting dust motes (drawn under everything, no shake) ----
    ctx.fillStyle = cachedBgGradient || '#14161d'; ctx.fillRect(0,0,vp.w,vp.h);

    // trauma-based screen shake: squared falloff = smooth but punchy, with slight rotation
    const shk = trauma*trauma;
    const shakeMag = shk * 14;
    const sx = Math.sin(shakeAngle*2.7) * shakeMag + camKickX;
    const sy = Math.cos(shakeAngle*3.1) * shakeMag + camKickY;
    const srot = Math.sin(shakeAngle*1.9) * shk * 0.035;
    ctx.save();
    const cxCenter = map.x + map.w/2, cyCenter = map.y + map.h/2;
    ctx.translate(cxCenter, cyCenter);
    ctx.rotate(srot);
    ctx.scale(camZoom, camZoom);
    ctx.translate(-cxCenter + sx, -cyCenter + sy);

    // map floor: pre-rendered once per resize (grid, vignette, border, accent glow)
    if (floorCanvas) ctx.drawImage(floorCanvas.canvas, map.x - floorCanvas.pad, map.y - floorCanvas.pad, floorCanvas.w, floorCanvas.h);
    else { ctx.fillStyle='#20242f'; ctx.fillRect(map.x, map.y, map.w, map.h); }

    // ambient dust motes
    for (const m of ambientMotes){
      const mx = map.x + m.x*map.w, my = map.y + m.y*map.h;
      const tw = 0.6+0.4*Math.sin(m.phase*1.3);
      ctx.beginPath(); ctx.arc(mx, my, m.size, 0, Math.PI*2);
      ctx.fillStyle = `rgba(200,215,255,${m.alpha*tw})`; ctx.fill();
    }

    // ---- Deep Wound blood trail drips (under the bigger splatters) ----
    for (const tr of bloodTrails){
      const k = tr.life/tr.max;
      const a = 0.55 * (k < 0.3 ? k/0.3 : 1);
      ctx.save(); ctx.translate(tr.x, tr.y); ctx.rotate(tr.rot); ctx.scale(1, 0.7);
      ctx.fillStyle = `rgba(125,6,6,${a})`;
      ctx.beginPath(); ctx.arc(0, 0, tr.r, 0, Math.PI*2); ctx.fill();
      ctx.restore();
    }

    // ---- blood splatter on ground ----
    for (const st of bloodStains){
      const k=st.life/st.max;
      const a=st.alpha*(k<0.25 ? k/0.25 : 1);
      ctx.save(); ctx.translate(st.x, st.y); ctx.rotate(st.rot);
      ctx.fillStyle=`rgba(110,8,8,${a})`;
      ctx.beginPath(); ctx.arc(0,0,st.r,0,Math.PI*2); ctx.fill();
      for (const d of st.drops){ ctx.beginPath(); ctx.arc(d.x,d.y,d.r,0,Math.PI*2); ctx.fill(); }
      ctx.restore();
    }

    // ---- GHOST TRAPS (world) ----
    // Drawn after the floor decals but before the characters so entities stand on top of them.
    for (const t of ghostTraps) {
      const vis = clamp(t.reveal, 0, 1);
      if (vis <= 0.012) continue;                    // fully hidden from this viewpoint
      const spawnK = easeOutBack(clamp(t.spawnT, 0, 1));
      const lifeK = clamp(t.life / t.max, 0, 1);
      // fade out over the last second of life so it dissolves rather than vanishing
      const fade = t.holding ? 1 : clamp(t.life / 1.0, 0, 1);
      const a = vis * fade;
      const pulse = 0.5 + 0.5*Math.sin(t.pulse*3.2);
      const rr = GHOST.radius * GHOST.drawScale * Math.max(0.05, spawnK);
      ctx.save();
      ctx.translate(t.x, t.y);

      // ---- flat 2D sprite ----
      // Drawn as a true top-down emblem: perfect circles, no vertical squash, no gradient
      // "recess". Flat colour bands + hard-edged shapes, matching the game's other 2D icons.
      // outer aura (flat, circular)
      const aur = ctx.createRadialGradient(0, 0, rr*0.75, 0, 0, rr*1.42);
      aur.addColorStop(0, `rgba(143,108,255,${0.26*a})`);
      aur.addColorStop(1, 'rgba(143,108,255,0)');
      ctx.fillStyle = aur;
      ctx.beginPath(); ctx.arc(0, 0, rr*1.42, 0, Math.PI*2); ctx.fill();

      // flat dark base disc
      ctx.beginPath(); ctx.arc(0, 0, rr, 0, Math.PI*2);
      ctx.fillStyle = `rgba(24,10,50,${0.82*a})`; ctx.fill();
      ctx.strokeStyle = `rgba(168,138,255,${(0.9+0.1*pulse)*a})`;
      ctx.lineWidth = 3.2; ctx.stroke();

      // jaw teeth pointing INWARD from the rim (flat triangles, evenly spaced)
      ctx.save();
      ctx.rotate(t.pulse*0.45);
      ctx.fillStyle = `rgba(236,228,255,${(0.9+0.1*pulse)*a})`;
      const teeth = 12;
      for (let i=0;i<teeth;i++){
        const ang = i*(Math.PI*2/teeth);
        const outR = rr*0.97, inR = rr*0.62, hw = 0.115;
        ctx.beginPath();
        ctx.moveTo(Math.cos(ang-hw)*outR, Math.sin(ang-hw)*outR);
        ctx.lineTo(Math.cos(ang)*inR,     Math.sin(ang)*inR);
        ctx.lineTo(Math.cos(ang+hw)*outR, Math.sin(ang+hw)*outR);
        ctx.closePath(); ctx.fill();
      }
      ctx.restore();

      // inner rune ring, counter-rotating (flat stroke)
      ctx.save();
      ctx.rotate(-t.pulse*0.8);
      ctx.beginPath(); ctx.arc(0, 0, rr*0.54, 0, Math.PI*2);
      ctx.strokeStyle = `rgba(236,228,255,${(0.7+0.3*pulse)*a})`;
      ctx.lineWidth = 2.4; ctx.stroke();
      // four rune ticks on the inner ring
      ctx.lineWidth = 2.8;
      for (let i=0;i<4;i++){
        const ang = i*(Math.PI/2);
        ctx.beginPath();
        ctx.moveTo(Math.cos(ang)*rr*0.40, Math.sin(ang)*rr*0.40);
        ctx.lineTo(Math.cos(ang)*rr*0.54, Math.sin(ang)*rr*0.54);
        ctx.stroke();
      }
      ctx.restore();

      // flat core disc (no soft 3D falloff — a solid dot with a ring)
      const coreR = rr*0.24*(0.9+0.16*pulse);
      ctx.beginPath(); ctx.arc(0, 0, Math.max(0.05, coreR), 0, Math.PI*2);
      ctx.fillStyle = `rgba(232,222,255,${0.95*a})`; ctx.fill();
      ctx.beginPath(); ctx.arc(0, 0, Math.max(0.05, coreR*1.75), 0, Math.PI*2);
      ctx.strokeStyle = `rgba(176,146,255,${0.6*a})`; ctx.lineWidth = 1.8; ctx.stroke();


      // snap flash
      if (t.popFX > 0) {
        ctx.save();
        ctx.globalAlpha = t.popFX * a;
        ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 3;
        ctx.beginPath(); ctx.arc(0, 0, rr*(1 + (1-t.popFX)*1.5), 0, Math.PI*2); ctx.stroke();
        ctx.restore();
      }

      // life ring (killer's own view only — the survivor shouldn't get a countdown)
      if (mode === 'killer' && !t.holding) {
        ctx.beginPath();
        ctx.arc(0, 0, rr*1.22, -Math.PI/2, -Math.PI/2 + lifeK*Math.PI*2);
        ctx.strokeStyle = `rgba(143,108,255,${0.5*a})`; ctx.lineWidth = 2; ctx.stroke();
      }
      ctx.restore();

      // ---- captured survivor UI: escape progress + skill-check gauge ----
      if (t.holding) {
        const ent = t.holding;
        // pips showing how many GREATs are banked
        ctx.save();
        for (let i=0;i<GHOST.checksNeeded;i++){
          const px = ent.x + (i - (GHOST.checksNeeded-1)/2) * 12;
          const py = ent.y - ent.r - 40;
          const done = i < t.checksDone;
          ctx.beginPath(); ctx.arc(px, py, 4.4, 0, Math.PI*2);
          ctx.fillStyle = done ? '#ffe16a' : 'rgba(255,255,255,0.16)';
          ctx.fill();
          ctx.strokeStyle = done ? 'rgba(255,240,190,0.95)' : 'rgba(255,255,255,0.4)';
          ctx.lineWidth = 1.3; ctx.stroke();
        }
        ctx.fillStyle = 'rgba(224,212,255,0.92)';
        ctx.font = 'bold 10px system-ui,sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'alphabetic';
        ctx.fillText('TRAPPED — GREEN +1 / GOLD +2', ent.x, clamp(ent.y - ent.r - 52, 12, vp.h - 8));
        ctx.textAlign = 'left';
        ctx.restore();

        // the escape skill check itself (same visual language as generator checks)
        if (t.check) {
          const rr2 = 44, dur = t.check.dur;
          const cursor = (t.check.timer/dur)*Math.PI*2;
          const successHalf = GHOST.successZone*0.5;
          const greatHalf = successHalf * GHOST.greatZoneFrac;
          ctx.save(); ctx.translate(ent.x, ent.y);
          ctx.strokeStyle='rgba(0,0,0,0.65)'; ctx.lineWidth=9;
          ctx.beginPath(); ctx.arc(0,0,rr2,0,Math.PI*2); ctx.stroke();
          // GOOD band — counts for +1 pip, so it is drawn bright and solid
          ctx.strokeStyle='#6dff8a'; ctx.lineWidth=9;
          ctx.beginPath(); ctx.arc(0,0,rr2,t.check.zone-successHalf,t.check.zone+successHalf); ctx.stroke();
          // GREAT sliver — worth double (+2 pips)
          ctx.strokeStyle='#ffe16a'; ctx.lineWidth=9;
          ctx.beginPath(); ctx.arc(0,0,rr2,t.check.zone-greatHalf,t.check.zone+greatHalf); ctx.stroke();
          ctx.strokeStyle='#fff'; ctx.lineWidth=3; ctx.lineCap='round';
          ctx.beginPath(); ctx.moveTo(0,0); ctx.lineTo(Math.cos(cursor)*rr2, Math.sin(cursor)*rr2); ctx.stroke();
          ctx.beginPath(); ctx.arc(0,0,4,0,Math.PI*2); ctx.fillStyle='#fff'; ctx.fill();
          ctx.restore();
        }
      }
    }

    // ---- generator objective (reworked sprite: industrial engine block + warning stripes) ----
    const genNear = canInteractGen();
    ctx.save();
    drawShadow(gen.x, gen.y, gen.r);
    const gpulse = gen.repairing ? 0.5+0.5*Math.sin(performance.now()/180) : 0;
    ctx.translate(gen.x, gen.y);

    // docking-spot markers (N/S/E/W) — show survivors exactly where they'll snap to
    if (mode === 'survivor' && playerChar === 'jame' && gen.progress < 1 && !genLock.active) {
      const dShow = gen.r + player.r + GEN.lockGap;
      const nearestSide = genNear ? nearestGenSide() : null;
      const sides = [['north',0,-1],['south',0,1],['east',1,0],['west',-1,0]];
      for (const [name,ddx,ddy] of sides) {
        const hi = name === nearestSide;
        ctx.beginPath(); ctx.arc(ddx*dShow, ddy*dShow, hi?7:5, 0, Math.PI*2);
        ctx.fillStyle = hi ? 'rgba(255,225,120,0.9)' : 'rgba(255,255,255,0.22)';
        ctx.fill();
        if (hi) { ctx.strokeStyle='rgba(255,255,255,0.9)'; ctx.lineWidth=1.6; ctx.stroke(); }
      }
    }

    ctx.save();
    if (gen.repairing) ctx.rotate(gen.spin*0.15);
    // main octagonal engine-block body (reads more like machinery than a plain circle)
    const octR = gen.r;
    const genSpr = gen.progress>=1 ? spriteCache.genDone : spriteCache.genWork;
    if (genSpr) ctx.drawImage(genSpr.canvas, -genSpr.half, -genSpr.half, genSpr.span, genSpr.span);
    ctx.beginPath();
    for (let i=0;i<8;i++){
      const a = Math.PI/8 + i*Math.PI/4;
      const px = Math.cos(a)*octR, py = Math.sin(a)*octR;
      if (i===0) ctx.moveTo(px,py); else ctx.lineTo(px,py);
    }
    ctx.closePath();
    ctx.lineWidth=3; ctx.strokeStyle=genNear ? 'rgba(255,255,255,0.9)' : 'rgba(20,24,30,0.9)'; ctx.stroke();
    // cartoon gear teeth (spinning core)
    ctx.save(); ctx.rotate(gen.spin);
    ctx.strokeStyle='rgba(255,255,255,0.85)'; ctx.lineWidth=3; ctx.lineCap='round';
    for (let i=0;i<8;i++){ const a=i*Math.PI/4; ctx.beginPath(); ctx.moveTo(Math.cos(a)*11,Math.sin(a)*11); ctx.lineTo(Math.cos(a)*18,Math.sin(a)*18); ctx.stroke(); }
    ctx.restore();
    ctx.beginPath(); ctx.arc(0,0,8,0,Math.PI*2); ctx.fillStyle='rgba(20,25,32,0.8)'; ctx.fill();
    ctx.beginPath(); ctx.arc(0,0,8,0,Math.PI*2); ctx.strokeStyle='rgba(255,255,255,0.25)'; ctx.lineWidth=1; ctx.stroke();
    ctx.restore();
    // progress ring: drawn unrotated, so 0% is always at 12 o'clock and the arc never drifts after a survivor leaves
    ctx.strokeStyle='rgba(0,0,0,0.45)'; ctx.lineWidth=5; ctx.beginPath(); ctx.arc(0,0,gen.r+7,0,Math.PI*2); ctx.stroke();
    ctx.strokeStyle=gen.progress>=1 ? '#ffe16a' : (gen.repairing ? '#78e6ff' : '#7ef0a1');
    ctx.lineWidth=5; ctx.beginPath(); ctx.arc(0,0,gen.r+7,-Math.PI/2,-Math.PI/2+gen.progress*Math.PI*2); ctx.stroke();
    if (gen.flash>0 || gen.completeFlash>0){ ctx.beginPath(); ctx.arc(0,0,gen.r+12,0,Math.PI*2); ctx.strokeStyle=`rgba(255,255,180,${Math.max(gen.flash/0.35, gen.completeFlash/1.2)*0.8})`; ctx.lineWidth=3; ctx.stroke(); }
    if (gen.failFlash>0){ ctx.beginPath(); ctx.arc(0,0,gen.r+12,0,Math.PI*2); ctx.strokeStyle=`rgba(255,80,80,${gen.failFlash/0.35})`; ctx.lineWidth=4; ctx.stroke(); }
    ctx.restore();
    if (genNear && gen.progress<1) {
      ctx.fillStyle='rgba(0,0,0,0.55)'; ctx.font='bold 11px system-ui,sans-serif'; ctx.textAlign='center'; ctx.textBaseline='middle';
      const label = gen.check ? 'SKILL CHECK!' : (genLock.active ? 'REPAIRING (EXIT to leave)' : 'INTERACT');
      const w=ctx.measureText(label).width+14; roundRect(gen.x-w/2, gen.y-gen.r-30, w, 18, 9); ctx.fill();
      ctx.fillStyle=gen.check ? '#fff3a0' : '#dfffe8'; ctx.fillText(label, gen.x, gen.y-gen.r-21);
    }
    // ---- skill-check: dual-zone gauge (GOOD ring + inner GREAT sliver) with a sweeping needle ----
    if (gen.check) {
      const rr=46, dur = gen.check.dur || GEN.checkDuration;
      const cursor=(gen.check.timer/dur)*Math.PI*2;
      const zoneScale = gen.check.zoneScale || 1;
      const successHalf = GEN.successZone*0.5*zoneScale;
      const greatHalf = successHalf * GEN.greatZoneFrac;
      ctx.save(); ctx.translate(gen.x, gen.y);
      // track
      ctx.strokeStyle='rgba(0,0,0,0.65)'; ctx.lineWidth=9; ctx.beginPath(); ctx.arc(0,0,rr,0,Math.PI*2); ctx.stroke();
      // GOOD zone (green band)
      ctx.strokeStyle='#6dff8a'; ctx.lineWidth=9;
      ctx.beginPath(); ctx.arc(0,0,rr,gen.check.zone-successHalf,gen.check.zone+successHalf); ctx.stroke();
      // GREAT zone (gold sliver, inside GOOD)
      ctx.strokeStyle='#ffe16a'; ctx.lineWidth=9;
      ctx.beginPath(); ctx.arc(0,0,rr,gen.check.zone-greatHalf,gen.check.zone+greatHalf); ctx.stroke();
      // faint spinning tick marks for texture
      ctx.strokeStyle='rgba(255,255,255,0.18)'; ctx.lineWidth=1.4;
      for (let i=0;i<24;i++){ const a=i*Math.PI/12; ctx.beginPath(); ctx.moveTo(Math.cos(a)*(rr-6),Math.sin(a)*(rr-6)); ctx.lineTo(Math.cos(a)*(rr+6),Math.sin(a)*(rr+6)); ctx.stroke(); }
      // sweeping needle
      ctx.strokeStyle='#fff'; ctx.lineWidth=3; ctx.lineCap='round';
      ctx.beginPath(); ctx.moveTo(0,0); ctx.lineTo(Math.cos(cursor)*rr, Math.sin(cursor)*rr); ctx.stroke();
      ctx.beginPath(); ctx.arc(0,0,4,0,Math.PI*2); ctx.fillStyle='#fff'; ctx.fill();
      ctx.fillStyle='#fff'; ctx.font='bold 10px system-ui,sans-serif'; ctx.textAlign='center'; ctx.fillText('TAP', 0, rr+18);
      ctx.restore();
    }
    // floating GOOD / GREAT! / MISS popup text
    for (const p of genPopups) {
      const k = p.life/p.max;
      ctx.save();
      ctx.globalAlpha = Math.min(1, k*1.6);
      ctx.translate(p.x, p.y - (1-k)*20);
      ctx.fillStyle = p.color; ctx.font='bold 13px system-ui,sans-serif'; ctx.textAlign='center'; ctx.textBaseline='middle';
      ctx.fillText(p.text, 0, 0);
      ctx.restore();
    }

    // ---- dummy ----
    const dx2 = dummy.x, dy2 = dummy.y;
    const isKiller = (mode === 'survivor');
    let dalpha = 1;
    if (!dummy.dead && dummy.spawnT < 1) dalpha *= dummy.spawnT;
    if (dummy.dead) dalpha *= lerp(1, 0.55, dummy.deathT);
    drawShadow(dx2, dy2, dummy.r);
    ctx.save();
    ctx.globalAlpha = Math.max(0, dalpha);
    ctx.translate(dx2, dy2);
    if (!dummy.dead && dummy.spawnT < 1) {
      const sp = easeOutBack(dummy.spawnT);
      ctx.scale(Math.max(0.05, sp), Math.max(0.05, sp));
    }
    ctx.rotate(dummy.spin);
    const dSprKey = isKiller ? (dummy.dead ? 'dummy_killer_dead' : 'dummy_killer')
                             : (dummy.dead ? 'dummy_surv_dead' : 'dummy_surv');
    const dSpr = spriteCache.bodies[dSprKey];
    if (dSpr) ctx.drawImage(dSpr.canvas, -dSpr.half, -dSpr.half, dSpr.span, dSpr.span);
    // mark: X for killer, + for training
    const s2=dummy.r*0.42;
    if (isKiller) {
      ctx.save(); ctx.rotate(dummy.face);
      ctx.strokeStyle = dummy.dead ? '#888' : '#ffd2cf'; ctx.lineWidth=2.5;
      ctx.beginPath();
      ctx.moveTo(-s2,-s2); ctx.lineTo(s2,s2);

      ctx.moveTo(s2,-s2); ctx.lineTo(-s2,s2);
      ctx.stroke();
      ctx.restore();
    } else {
      ctx.strokeStyle = dummy.dead ? '#555' : '#8a3b2e'; ctx.lineWidth=2.5;
      ctx.beginPath(); ctx.moveTo(-s2,0); ctx.lineTo(s2,0); ctx.moveTo(0,-s2); ctx.lineTo(0,s2); ctx.stroke();
    }
    if (dummy.flash>0){
      ctx.beginPath(); ctx.arc(0,0,dummy.r,0,Math.PI*2);
      ctx.fillStyle=`rgba(255,255,255,${Math.min(1,0.6*dummy.flash/0.12)})`; ctx.fill();
    }
    ctx.restore();
    // killer sword + slash trail (survivor mode)
    if (isKiller && dummy.swinging && !dummy.dead) {
      const p = dummy.swingT/ATTACK.duration;
      const so = swingOffset(p);
      const reach = GRIP_DIST + BLADE_LEN*0.8;
      const a0 = dummy.face + REST_SO, a1 = dummy.face + so;
      const lo = Math.min(a0,a1), hi = Math.max(a0,a1);
      ctx.lineCap='round';
      ctx.strokeStyle='rgba(255,200,200,0.28)'; ctx.lineWidth=11;
      ctx.beginPath(); ctx.arc(dx2, dy2, reach, lo, hi); ctx.stroke();
      ctx.strokeStyle='rgba(255,255,255,0.5)'; ctx.lineWidth=4;
      ctx.beginPath(); ctx.arc(dx2, dy2, reach, lo, hi); ctx.stroke();
      drawBladeTrail(swordTrailD, 'rgba(255,150,140,ALPHA)');
      const striking = dummy.swingT>=ATTACK.hitStart*ATTACK.duration && dummy.swingT<=ATTACK.hitEnd*ATTACK.duration;
      drawSword(dx2, dy2, dummy.face + so, '#c0392b', striking);
    }

    // dummy health bar (killer mode only)
    if ((dummy.hp < 100 || dummy.dead) && mode === 'killer'){
      const bw=46, bh=6, bx0=dx2-bw/2, by0=dy2-dummy.r-16;
      ctx.fillStyle='rgba(0,0,0,0.55)'; ctx.fillRect(bx0-1, by0-1, bw+2, bh+2);
      // lag bar (damage echo) fades from bright to dim as it catches up
      if (!dummy.dead) { ctx.fillStyle='rgba(255,210,120,0.85)'; ctx.fillRect(bx0, by0, bw*(dummy.hpLag/100), bh); }
      ctx.fillStyle = dummy.dead ? '#666' : (dummy.hp<=25 ? `rgba(255,${60+70*Math.sin(performance.now()/120)},60,1)` : '#ff4d4d');
      ctx.fillRect(bx0, by0, bw*(dummy.hpDisp/100), bh);
      ctx.strokeStyle='rgba(255,255,255,0.25)'; ctx.lineWidth=1; ctx.strokeRect(bx0-0.5, by0-0.5, bw+1, bh+1);
    }

    const near=Math.hypot(player.x-dummy.x, player.y-dummy.y) < 72;
    if (near && !dummy.dead){
      const pulse=0.5+0.5*Math.sin(performance.now()/300);
      ctx.beginPath(); ctx.arc(dx2, dy2, dummy.r+6+pulse*4, 0, Math.PI*2);
      ctx.strokeStyle=`rgba(255,91,82,${0.30+0.40*pulse})`; ctx.lineWidth=2; ctx.stroke();
    }

    // Status labels under the dummy are stacked into slots so SLOWED and DEEP WOUND can never
    // draw on top of each other when both are active at once.
    let statusSlot = 0;
    const statusY = () => dy2 + dummy.r + 24 + (statusSlot++)*14;

    if (dummy.slowT > 0 && !dummy.dead){
      const k = dummy.slowT / THROW.slowTime;
      ctx.beginPath(); ctx.arc(dx2, dy2, dummy.r+10, 0, Math.PI*2);
      ctx.strokeStyle=`rgba(100,180,255,${0.25+0.45*k})`; ctx.lineWidth=3; ctx.stroke();
      ctx.fillStyle=`rgba(150,210,255,${0.7*k})`; ctx.font='bold 11px system-ui,sans-serif'; ctx.textAlign='center'; ctx.fillText('SLOWED', dx2, statusY());
    }

    // ---- GHOST TRAP: escape haste on the survivor dummy ----
    if (dummy.hasteT > 0 && !dummy.dead) {
      drawHasteFX(dx2, dy2, dummy.r, dummy.hasteT, dummy.face, dummy.vx, dummy.vy, dummy.hasteBurst, 'dummy');
    }

    // ---- DEEP WOUND status on the survivor ----
    // A ragged red bleeding ring that drains as the wound expires, dripping motes, and a small
    // countdown label. Sits on a stacked slot so it never collides with SLOWED / the HP bar.
    if (dummy.deepT > 0 && !dummy.dead){
      const k = clamp(dummy.deepT / HARDSTAB.deepDuration, 0, 1);
      const beat = 0.5 + 0.5*Math.sin(performance.now()/150);
      const ringR = dummy.r + 8;
      ctx.save();
      // dark backing ring
      ctx.beginPath(); ctx.arc(dx2, dy2, ringR, 0, Math.PI*2);
      ctx.strokeStyle = 'rgba(60,0,0,0.55)'; ctx.lineWidth = 4; ctx.stroke();
      // draining bleed ring (remaining duration)
      ctx.save();
      glowRing(dx2, dy2, ringR, -Math.PI/2, -Math.PI/2 + k*Math.PI*2, '255,40,30', 4, 0.75 + 0.25*beat);
      ctx.strokeStyle = `rgba(220,25,25,${0.75+0.25*beat})`; ctx.lineWidth = 4; ctx.lineCap = 'round';
      ctx.beginPath(); ctx.arc(dx2, dy2, ringR, -Math.PI/2, -Math.PI/2 + k*Math.PI*2); ctx.stroke();
      ctx.restore();
      // tick pip: brightens right as each 1s bleed tick lands
      const tickK = 1 - clamp(dummy.deepTick / HARDSTAB.deepTickTime, 0, 1);
      ctx.beginPath(); ctx.arc(dx2, dy2, ringR + 4, -Math.PI/2, -Math.PI/2 + tickK*Math.PI*2);
      ctx.strokeStyle = `rgba(255,120,100,${0.25+0.4*tickK})`; ctx.lineWidth = 1.6; ctx.stroke();
      // impact flash right on a tick
      if (dummy.deepFlash > 0) {
        const fk = dummy.deepFlash/0.4;
        ctx.beginPath(); ctx.arc(dx2, dy2, ringR + 6 + (1-fk)*10, 0, Math.PI*2);
        ctx.strokeStyle = `rgba(255,70,60,${0.55*fk})`; ctx.lineWidth = 2.5; ctx.stroke();
      }
      // dripping blood motes running down the ring
      for (let i=0;i<3;i++){
        const a = performance.now()/700 + i*Math.PI*2/3;
        const drip = (performance.now()/420 + i*0.33) % 1;
        const px = dx2 + Math.cos(a)*ringR;
        const py = dy2 + Math.sin(a)*ringR + drip*11;
        ctx.beginPath(); ctx.arc(px, py, 2.1*(1-drip*0.55), 0, Math.PI*2);
        ctx.fillStyle = `rgba(190,15,15,${0.75*(1-drip)})`; ctx.fill();
      }
      ctx.restore();
      ctx.fillStyle = `rgba(255,105,95,${0.75+0.25*beat})`;
      ctx.font = 'bold 11px system-ui,sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'alphabetic';
      ctx.fillText(`DEEP WOUND ${dummy.deepT.toFixed(1)}s`, dx2, statusY());
    }
    if (dummy.stunT > 0 && !dummy.dead){
      const k = dummy.stunT / BLOCK.stunTime;
      ctx.beginPath(); ctx.arc(dx2, dy2, dummy.r+14, 0, Math.PI*2);
      ctx.strokeStyle=`rgba(170,230,255,${0.35+0.45*k})`; ctx.lineWidth=3; ctx.stroke();
      ctx.fillStyle=`rgba(220,245,255,${0.85*k})`; ctx.font='bold 12px system-ui,sans-serif'; ctx.textAlign='center';
      ctx.fillText('STUNNED', dx2, dy2-dummy.r-24);
      for (let i=0;i<3;i++){
        const a=performance.now()/260 + i*Math.PI*2/3;
        ctx.beginPath(); ctx.arc(dx2+Math.cos(a)*(dummy.r+12), dy2-16+Math.sin(a)*5, 3.2, 0, Math.PI*2); ctx.fill();
      }
    }

    // ---- player center (with anticipation lean on wind-up) ----
    let cx=player.x, cy=player.y;
    if (attack.active){
      const ap=attack.timer/ATTACK.duration;
      if (ap<0.18){ const k=ap/0.18; cx-=Math.cos(player.angle)*3*k; cy-=Math.sin(player.angle)*3*k; }
    }



    // lunge blur — layered motion streak afterimages (extra reach/brightness when overcharged)
    if (attack.active && attack.timer < ATTACK.lungeTime){
      const back=player.angle+Math.PI;
      const lp = attack.timer/ATTACK.lungeTime;
      const energizedLunge = attack.overcharged;
      const stabLunge = attack.hardStab;
      ctx.save();
      // the 1.2x stab lunge covers more ground, so it gets a longer, denser afterimage streak
      const trailCount = energizedLunge ? 6 : (stabLunge ? 7 : 4);
      for (let i=1;i<=trailCount;i++){
        const off = i*(energizedLunge?9:(stabLunge?10:7))*(0.4+lp*0.8);
        ctx.globalAlpha = (energizedLunge?0.22:(stabLunge?0.24:0.16)) * (1-i/(trailCount+1));
        ctx.fillStyle = energizedLunge ? '#c98bff' : (stabLunge ? '#ff7a66' : CHAR_SKINS[playerChar].c0);
        ctx.beginPath(); ctx.arc(cx+Math.cos(back)*off, cy+Math.sin(back)*off, player.r*(0.92-i*0.05), 0, Math.PI*2); ctx.fill();
      }
      if (stabLunge) {
        ctx.globalAlpha = 0.55*(1-lp);
        ctx.strokeStyle = 'rgba(255,140,120,0.85)'; ctx.lineWidth = 3;
        ctx.beginPath(); ctx.moveTo(cx, cy); ctx.lineTo(cx+Math.cos(back)*52, cy+Math.sin(back)*52); ctx.stroke();
      }
      if (energizedLunge) {
        ctx.globalAlpha = 0.5*(1-lp);
        ctx.strokeStyle = 'rgba(220,180,255,0.8)'; ctx.lineWidth = 2.5;
        ctx.beginPath(); ctx.moveTo(cx, cy); ctx.lineTo(cx+Math.cos(back)*40, cy+Math.sin(back)*40); ctx.stroke();
      }
      ctx.restore();
    }

    // player body (skinned by selected character)
    drawShadow(cx, cy, player.r);
    const skin = CHAR_SKINS[playerChar];
    const bodySpr = spriteCache.bodies[playerChar];
    if (bodySpr) ctx.drawImage(bodySpr.canvas, cx-bodySpr.half, cy-bodySpr.half, bodySpr.span, bodySpr.span);
    if (player.flash>0){
      ctx.beginPath(); ctx.arc(cx, cy, player.r, 0, Math.PI*2);
      ctx.fillStyle=`rgba(255,255,255,${Math.min(1,0.6*player.flash/0.14)})`; ctx.fill();
    }

    // Jame's small circle hands + smoother BLOCK animation (close, readable, cartoon style)
    if (mode === 'survivor' && playerChar === 'jame') {
      const f=player.angle, ca=Math.cos(f), sa=Math.sin(f), px=-sa, py=ca;
      let front=player.r*0.34, side=player.r*0.86, handR=4.4;
      let glow=false, alpha=0.95;
      let armAlpha=0.72;
      if (playerChar === 'jame' && block.state === 'windup') {
        const k=clamp(block.timer/BLOCK.windup,0,1);
        const e=easeInOut(k);
        // Fast 0.3s anticipation: hands tuck in, then push to guard.
        front=lerp(player.r*0.25, player.r*0.66, e);
        side=lerp(player.r*0.88, player.r*0.54, e);
        handR=lerp(4.4,5.25,e);
        alpha=0.82+0.18*e;
        const pulse=Math.sin(k*Math.PI);
        ctx.beginPath();
        ctx.arc(cx+ca*(player.r*0.55), cy+sa*(player.r*0.55), player.r+4+pulse*2, f-0.62, f+0.62);
        ctx.strokeStyle=`rgba(255,255,255,${0.18+0.22*e})`; ctx.lineWidth=2.5+1.5*e; ctx.lineCap='round'; ctx.stroke();
      } else if (playerChar === 'jame' && block.state === 'active') {
        const k=clamp(block.timer/BLOCK.active,0,1);
        const intro=easeOut(clamp(k/0.12,0,1));
        const outro=1-easeIn(clamp((k-0.88)/0.12,0,1));
        const hold=Math.max(0, Math.min(intro,outro));
        const pulse=0.5+0.5*Math.sin(performance.now()/110);
        front=player.r*0.70 + hold*2.0 + pulse*0.5;
        side=lerp(player.r*0.68, player.r*0.45, hold);
        handR=lerp(4.8,5.7,hold);
        glow=true; armAlpha=0.86;
        // Close white cartoon shield arcs — no color, less noisy.
        ctx.save();
        ctx.lineCap='round';
        glowRing(cx+ca*(player.r*0.70), cy+sa*(player.r*0.70), player.r+7+pulse*1.4, f-0.82, f+0.82, '255,255,255', 4.5*hold, 0.5*hold);
        ctx.beginPath(); ctx.arc(cx+ca*(player.r*0.70), cy+sa*(player.r*0.70), player.r+7+pulse*1.4, f-0.82, f+0.82);
        ctx.strokeStyle=`rgba(255,255,255,${0.42*hold+0.16*pulse*hold})`; ctx.lineWidth=4.5*hold; ctx.stroke();
        ctx.beginPath(); ctx.arc(cx, cy, player.r+4+pulse*1.5, 0, Math.PI*2);
        ctx.strokeStyle=`rgba(255,255,255,${0.10+0.10*pulse})`; ctx.lineWidth=1.7; ctx.stroke();
        ctx.restore();
      } else if (player.blockSlowT > 0) {
        alpha=0.65; armAlpha=0.45;
      }
      // draw short cartoon arms first, then hands. Arms are close to body so hands do not look detached.
      for (const sign of [-1,1]){
        const shoulderX=cx+px*player.r*0.42*sign+ca*player.r*0.05;
        const shoulderY=cy+py*player.r*0.42*sign+sa*player.r*0.05;
        const hx=cx+ca*front+px*side*sign, hy=cy+sa*front+py*side*sign;
        ctx.save();
        ctx.lineCap='round';
        ctx.strokeStyle=`rgba(220,255,235,${armAlpha})`; ctx.lineWidth=3.2;
        ctx.beginPath(); ctx.moveTo(shoulderX, shoulderY);
        const midX=(shoulderX+hx)/2 - px*sign*2;
        const midY=(shoulderY+hy)/2 - py*sign*2;
        ctx.quadraticCurveTo(midX, midY, hx, hy); ctx.stroke();
        if (glow) glowDisk(hx, hy, handR*2.8, '255,255,255', 0.6);
        const hg=ctx.createRadialGradient(hx-handR*0.35,hy-handR*0.35,1,hx,hy,handR);
        hg.addColorStop(0,'rgba(255,255,255,0.98)');
        hg.addColorStop(1,`rgba(220,255,240,${alpha})`);
        ctx.beginPath(); ctx.arc(hx, hy, handR, 0, Math.PI*2);
        ctx.fillStyle=hg; ctx.fill();
        ctx.shadowBlur=0; ctx.lineWidth=1.4; ctx.strokeStyle=glow?'rgba(255,255,255,0.95)':'rgba(20,90,70,0.75)'; ctx.stroke();
        ctx.restore();
      }
    }

    // ---- HARD STAB armed aura on Jason himself ----
    // A forward-pointing red arc so the player can read the buff while looking at the character
    // instead of the HUD. Drawn at player.r+7 — inside the block-slow ring (r+10) radius band is
    // unused in killer mode, so this never stacks with another world indicator.
    if (mode === 'killer' && playerChar === 'jason' && hardStabGlow > 0.02) {
      const gk = hardStabGlow;
      const beat = 0.5 + 0.5*Math.sin(hardStabPulse*5.5);
      const f = player.angle;
      ctx.save();
      ctx.lineCap = 'round';
      glowRing(cx, cy, player.r + 7 + beat*1.5, f-0.75, f+0.75, '255,50,40', 3.2*gk, 0.75*gk);
      ctx.strokeStyle = `rgba(255,70,58,${(0.45+0.3*beat)*gk})`; ctx.lineWidth = 3.2*gk;
      ctx.beginPath(); ctx.arc(cx, cy, player.r + 7 + beat*1.5, f-0.75, f+0.75); ctx.stroke();
      ctx.shadowBlur = 0;
      // small chevron ahead of him pointing where the stab will go
      const ca2 = Math.cos(f), sa2 = Math.sin(f), pxn = -sa2, pyn = ca2;
      const cd = player.r + 15 + beat*2;
      ctx.strokeStyle = `rgba(255,140,120,${(0.4+0.3*beat)*gk})`; ctx.lineWidth = 2*gk;
      ctx.beginPath();
      ctx.moveTo(cx + ca2*(cd-5) + pxn*6, cy + sa2*(cd-5) + pyn*6);
      ctx.lineTo(cx + ca2*cd, cy + sa2*cd);
      ctx.lineTo(cx + ca2*(cd-5) - pxn*6, cy + sa2*(cd-5) - pyn*6);
      ctx.stroke();
      ctx.restore();
    }

    // ---- RESURGEON: merge channel on Jame (rooted in place) ----
    // Communicates two things at once: the charges fusing, and that he CANNOT move while it
    // runs. The ground anchor + converging orbs make the commitment obvious at a glance.
    if (mode === 'survivor' && playerChar === 'jame' && resHolding && resHoldT > 0.001) {
      const hk = clamp(resHoldT / RESURGEON.holdTime, 0, 1);
      const eK = easeInOut(hk);
      ctx.save();

      // ground anchor: a flattened rooted ring that tightens as the channel completes
      ctx.save();
      ctx.translate(cx, cy + player.r*0.62); ctx.scale(1, 0.40);
      ctx.strokeStyle = `rgba(60,224,138,${0.30+0.45*hk})`;
      ctx.lineWidth = 2.4;
      ctx.beginPath(); ctx.arc(0, 0, player.r*(1.75 - 0.55*eK), 0, Math.PI*2); ctx.stroke();
      // rooting spokes pinning him to the spot
      ctx.strokeStyle = `rgba(150,255,200,${0.22+0.35*hk})`;
      ctx.lineWidth = 1.6;
      for (let i = 0; i < 6; i++) {
        const a = i*Math.PI/3 + resPulse*0.5;
        const r0 = player.r*(1.75 - 0.55*eK), r1 = r0 + 5 + 4*Math.sin(resPulse*6 + i);
        ctx.beginPath();
        ctx.moveTo(Math.cos(a)*r0, Math.sin(a)*r0);
        ctx.lineTo(Math.cos(a)*r1, Math.sin(a)*r1);
        ctx.stroke();
      }
      ctx.restore();

      // three charge orbs spiralling into his chest, mirroring the button animation
      for (let i = 0; i < RESURGEON.maxCharges; i++) {
        const a = -Math.PI/2 + i*(Math.PI*2/3) + eK*Math.PI*1.35;
        const orbR = (player.r + 26) * (1 - eK*0.92);
        const ox = cx + Math.cos(a)*orbR, oy = cy + Math.sin(a)*orbR;
        ctx.save();
        ctx.globalAlpha = 0.30 + 0.4*eK;
        ctx.strokeStyle = 'rgba(60,224,138,0.9)'; ctx.lineWidth = 2; ctx.lineCap = 'round';
        ctx.beginPath(); ctx.arc(cx, cy, orbR, a - 0.6*(1-eK*0.6), a); ctx.stroke();
        ctx.restore();
        ctx.save();
        glowDisk(ox, oy, 8, '120,255,190', 0.85);
        ctx.fillStyle = '#eafff4';
        ctx.beginPath(); ctx.arc(ox, oy, Math.max(0.1, 3.4 - 1.3*eK), 0, Math.PI*2); ctx.fill();
        ctx.restore();
      }

      // gathering core over his body
      const coreR = Math.max(0.1, 2 + 9*easeIn(hk));
      const cg2 = ctx.createRadialGradient(cx, cy, 0.2, cx, cy, coreR);
      cg2.addColorStop(0, `rgba(255,255,255,${0.55+0.45*hk})`);
      cg2.addColorStop(0.5, `rgba(214,255,236,${0.35*hk})`);
      cg2.addColorStop(1, 'rgba(60,224,138,0)');
      ctx.fillStyle = cg2;
      ctx.beginPath(); ctx.arc(cx, cy, coreR, 0, Math.PI*2); ctx.fill();

      // channel progress arc + ROOTED caption
      ctx.strokeStyle = `rgba(214,255,236,${0.75})`; ctx.lineWidth = 2.6; ctx.lineCap = 'round';
      ctx.beginPath(); ctx.arc(cx, cy, player.r + 16, -Math.PI/2, -Math.PI/2 + hk*Math.PI*2); ctx.stroke();
      ctx.restore();

      // Caption sits ABOVE the nameplate (which occupies cy - r - 30) so the two never overlap,
      // and is clamped so it can't slide off the top of the screen.
      ctx.fillStyle = `rgba(180,255,215,${0.7+0.3*Math.sin(resPulse*9)})`;
      ctx.font = 'bold 10px system-ui,sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'alphabetic';
      ctx.fillText('MERGING - ROOTED', cx, clamp(cy - player.r - 46, 12, vp.h - 8));
      ctx.textAlign = 'left';
    }

    // interrupted-merge caption on Jame
    if (mode === 'survivor' && playerChar === 'jame' && resIntFX > 0.02) {
      const ik = clamp(resIntFX, 0, 1);
      ctx.save();
      ctx.strokeStyle = `rgba(255,107,107,${0.65*ik})`; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.arc(cx, cy, player.r + 6 + (1-ik)*22, 0, Math.PI*2); ctx.stroke();
      ctx.restore();
      ctx.fillStyle = `rgba(255,160,160,${0.95*ik})`;
      ctx.font = 'bold 10px system-ui,sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'alphabetic';
      ctx.fillText('MERGE INTERRUPTED', cx, clamp(cy - player.r - 46, 12, vp.h - 8));
      ctx.textAlign = 'left';
    }

    // ---- RESURGEON: immunity aura + heal burst on Jame ----
    if (mode === 'survivor' && playerChar === 'jame' && player.immuneT > 0) {
      const k = clamp(player.immuneT / (player.immuneFull || RESURGEON.immuneTime), 0, 1);
      const spin = performance.now()/900;
      const beat = 0.5 + 0.5*Math.sin(performance.now()/220);
      ctx.save();
      // rotating hex-shield lattice — clearly different from the block ring / slow rings
      ctx.strokeStyle = `rgba(60,224,138,${0.30+0.30*beat})`;
      ctx.lineWidth = 2;
      ctx.beginPath();
      for (let i=0;i<=6;i++){
        const a = spin + i*Math.PI/3;
        const px2 = cx + Math.cos(a)*(player.r+9), py2 = cy + Math.sin(a)*(player.r+9);
        if (i===0) ctx.moveTo(px2,py2); else ctx.lineTo(px2,py2);
      }
      ctx.stroke();
      // duration ring that visibly drains over the 20s
      ctx.strokeStyle = `rgba(150,255,200,${0.5+0.3*beat})`; ctx.lineWidth = 2.6; ctx.lineCap='round';
      ctx.beginPath(); ctx.arc(cx, cy, player.r+13, -Math.PI/2, -Math.PI/2 + k*Math.PI*2); ctx.stroke();
      ctx.restore();
      ctx.fillStyle = `rgba(170,255,215,${0.8})`;
      ctx.font = 'bold 10px system-ui,sans-serif'; ctx.textAlign = 'center';
      ctx.fillText(`IMMUNE ${player.immuneT.toFixed(1)}s`, cx, cy - player.r - 18);
      ctx.textAlign = 'left';
    }
    // ---- GHOST TRAP: escape haste on the player ----
    if (player.hasteT > 0) {
      drawHasteFX(cx, cy, player.r, player.hasteT, player.angle, player.vx, player.vy, player.hasteBurst, 'player');
    }
    if (player.healFlash > 0 && mode === 'survivor') {
      const hk = clamp(player.healFlash, 0, 1);
      ctx.save();
      ctx.strokeStyle = `rgba(90,255,170,${0.6*hk})`; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.arc(cx, cy, player.r + (1-hk)*34, 0, Math.PI*2); ctx.stroke();
      ctx.restore();
    }

    // recovery slow indicator (dashed ring while movement is at 60%)
    if (attack.active && attack.timer >= ATTACK.duration) {
      ctx.beginPath(); ctx.arc(cx, cy, player.r+5, 0, Math.PI*2);
      ctx.strokeStyle='rgba(255,210,90,0.6)'; ctx.lineWidth=2; ctx.setLineDash([4,4]);
      ctx.stroke(); ctx.setLineDash([]);
    }
    // character nameplate (clamped so it can never leave the screen, e.g. near the top edge)
    const ny = clamp(cy - player.r - 30, 16, vp.h - 16);
    drawNameplate(CHAR_SKINS[playerChar].name, cx, ny, CHAR_SKINS[playerChar].stroke);

    // forward arrow (white for contrast on any body colour)
    ctx.save();
    ctx.translate(cx, cy); ctx.rotate(player.angle);
    const a=player.r;
    ctx.fillStyle='#f4f6ff'; ctx.strokeStyle='rgba(0,0,0,0.45)'; ctx.lineWidth=1.5;
    ctx.beginPath();
    ctx.moveTo(-a*0.50,-a*0.13); ctx.lineTo(a*0.15,-a*0.13);
    ctx.lineTo(a*0.15,-a*0.42); ctx.lineTo(a*0.58,0);
    ctx.lineTo(a*0.15, a*0.42); ctx.lineTo(a*0.15, a*0.13);
    ctx.lineTo(-a*0.50, a*0.13); ctx.closePath();
    ctx.fill(); ctx.stroke();
    ctx.restore();

    // player sword (killer mode only, hidden while Jason's knife is thrown/returning)
    if (player.blade && mode === 'killer' && hasSword()) {
      const striking   = attack.active && attack.timer>=ATTACK.hitStart*ATTACK.duration && attack.timer<=ATTACK.hitEnd*ATTACK.duration;
      const inspecting = attack.active && attack.timer >= ATTACK.duration;
      const isSecond = playerChar === 'second';
      const energized = isSecond && attack.active && attack.overcharged;
      const stabbingNow = inHardStabSwing();
      // While Hard Stab is armed (before the swing) the blade already glows red so the player can
      // see the buff on the character itself, not just on the button.
      const armedGlow = hardStabGlow > 0.05 && playerChar === 'jason' && !attack.active;
      const guardColor = energized ? '#c98bff' : (isSecond ? '#9a6fd9' : ((stabbingNow || armedGlow) ? '#ff6a5a' : '#d9b24a'));
      const glowColor = energized ? 'rgba(180,110,255,0.95)'
                      : (stabbingNow ? 'rgba(255,60,50,0.95)'
                      : (armedGlow ? `rgba(255,70,60,${0.5*hardStabGlow})`
                      : (inspecting ? 'rgba(255,220,120,0.85)' : 'rgba(255,120,120,0.9)')));
      drawSword(cx, cy, player.angle + player.blade.so, guardColor,
                striking || inspecting || energized || stabbingNow || armedGlow,
                glowColor, player.blade.bladeLen,
                { longsword: isSecond, energized, stab: stabbingNow, ext: player.blade.ext || 0 });
    }
    // (Jason's hand is simply left empty while his knife is thrown — no placeholder marker)

    // player health bar (survivor mode)
    if (mode==='survivor'){
      const bw=46, bh=6, bx0=cx-bw/2, by0=cy-player.r-16;
      ctx.fillStyle='rgba(0,0,0,0.55)'; ctx.fillRect(bx0-1, by0-1, bw+2, bh+2);
      ctx.fillStyle = player.hp<=0 ? '#666' : '#4dd24d';
      ctx.fillRect(bx0, by0, bw*(player.hp/100), bh);
    }

    if (player.blockSlowT > 0 && mode==='survivor' && player.immuneT <= 0){
      const k=player.blockSlowT/BLOCK.missSlowTime;
      ctx.beginPath(); ctx.arc(cx, cy, player.r+10, 0, Math.PI*2);
      ctx.strokeStyle=`rgba(120,160,255,${0.25+0.35*k})`; ctx.lineWidth=3; ctx.stroke();
      ctx.fillStyle=`rgba(180,205,255,${0.65*k})`; ctx.font='bold 10px system-ui,sans-serif'; ctx.textAlign='center';
      ctx.fillText('BLOCK MISS SLOW', cx, cy+player.r+26);
    }

    // Second's post-overcharge-hit slow: a soft purple ring, distinct from the block-miss slow above
    if (player.overchargeSlowT > 0 && mode==='killer' && playerChar === 'second'){
      const k=player.overchargeSlowT/SECOND.overchargeSpeedTimeHit;
      ctx.beginPath(); ctx.arc(cx, cy, player.r+10, 0, Math.PI*2);
      ctx.strokeStyle=`rgba(180,110,255,${0.25+0.35*k})`; ctx.lineWidth=3; ctx.stroke();
      ctx.fillStyle=`rgba(220,180,255,${0.65*k})`; ctx.font='bold 10px system-ui,sans-serif'; ctx.textAlign='center';
      ctx.fillText('OVERCHARGE DRAINED', cx, cy+player.r+26);
    }
    // Overcharge passive armed: the next full charge breaks at once (no 3 s hold)
    if (overchargePrimed && playerChar === 'second' && !overcharged){
      const pulse = 0.6 + 0.4*Math.sin(performance.now()/180);
      ctx.fillStyle=`rgba(200,150,255,${0.55+0.35*pulse})`; ctx.font='bold 10px system-ui,sans-serif'; ctx.textAlign='center';
      ctx.fillText('OVERCHARGE PRIMED', cx, cy+player.r+40);
    }


    // Ghost Trap slow on the player (from the admin console, or any future slow source): the same
    // blue SLOWED ring the survivor dummy gets, with a live countdown so the slow is readable.
    if (player.slowT > 0 && player.immuneT <= 0){
      const k=player.slowT/THROW.slowTime;
      ctx.beginPath(); ctx.arc(cx, cy, player.r+10, 0, Math.PI*2);
      ctx.strokeStyle=`rgba(100,180,255,${0.25+0.45*k})`; ctx.lineWidth=3; ctx.stroke();
      ctx.fillStyle=`rgba(150,210,255,${0.75*k+0.25})`; ctx.font='bold 10px system-ui,sans-serif'; ctx.textAlign='center';
      ctx.fillText(`SLOWED ${player.slowT.toFixed(1)}s`, cx, cy+player.r+26);
    }

    // charge bar beside the player. Second's Overcharge (purple), a Burst (orange, orange
    // shown once armed after holding 0.5s at max charge), and a Burst+Overcharge Combo (gold/
    // purple dual-tone) each recolor & expand this SAME bar — never the whole screen — with a
    // one-shot "break" pulse right as each tier triggers.
    if (charging){
      const bar = chargeBarRect();
      const isSecond = playerChar === 'second';
      const overK = isSecond ? clamp(overchargeT/SECOND.overchargeHoldTime, 0, 1) : 0;
      const burstK = (burstCharges > 0 && !burstReady) ? clamp(burstHoldT/BURST.holdTime, 0, 1) : (burstReady ? 1 : 0);
      const comboArmed = overcharged && burstReady;

      // subtle anticipation shake building up right before each tier breaks
      let shakeX = 0, shakeY = 0;
      if (charge >= 1) {
        const shk = Math.max(isSecond && !overcharged ? overK*overK : 0, burstCharges>0 && !burstReady ? burstK*burstK : 0);
        shakeX = (Math.random()-0.5) * 2.4 * shk;
        shakeY = (Math.random()-0.5) * 1.3 * shk;
      }
      // one-shot break pulse: the frame is briefly larger/brighter right when a tier triggers
      const breakPulse = Math.max(overchargeBreakFX, burstBreakFX, comboBreakFX);
      const bx = bar.x + shakeX, by = bar.y + shakeY;
      const bw = bar.w + breakPulse*6, bh = bar.h;
      const frameX = bx - bw/2 + bar.w/2, frameY = by - breakPulse*4;
      const t = performance.now()/1000;

      if (comboArmed || overcharged || burstReady) {
        const glowColor = comboArmed ? 'rgba(255,190,90,0.9)' : (burstReady ? 'rgba(255,157,61,0.85)' : 'rgba(180,110,255,0.85)');
        ctx.save(); ctx.globalCompositeOperation = 'lighter'; ctx.globalAlpha = 0.4 + 0.2*breakPulse;
        ctx.strokeStyle = glowColor; ctx.lineWidth = 6 + breakPulse*6;
        roundRect(frameX-1, frameY-1, bw+2, bh+2, 3); ctx.stroke(); ctx.restore();
      }
      ctx.fillStyle='rgba(0,0,0,0.55)'; roundRect(frameX-1, frameY-1, bw+2, bh+2, 3); ctx.fill();

      const fh=bh*charge;
      if (comboArmed) {
        // combo: dual-tone gold+purple energy braided fill with brighter, faster streaks
        const g = ctx.createLinearGradient(frameX, 0, frameX+bw, 0);
        g.addColorStop(0, '#ff9d3d'); g.addColorStop(0.5, '#fff0c2'); g.addColorStop(1, '#b56cff');
        ctx.fillStyle = g;
        roundRect(frameX, frameY+bh-fh, bw, Math.max(0.01,fh), 3); ctx.fill();
        ctx.save();
        roundRect(frameX, frameY+bh-fh, bw, Math.max(0.01,fh), 3); ctx.clip();
        for (let i=0;i<4;i++){
          const yy = frameY+bh - ((t*110 + i*bh/4) % bh);
          ctx.fillStyle = i%2===0 ? `rgba(255,240,210,${0.5+0.3*Math.sin(t*12+i)})` : `rgba(220,180,255,${0.4+0.3*Math.cos(t*11+i)})`;
          ctx.fillRect(frameX, yy, bw, 3.2);
        }
        ctx.restore();
        ctx.strokeStyle=`rgba(255,235,190,${0.75+0.25*Math.sin(t*13)})`; ctx.lineWidth=2.4;
        roundRect(frameX, frameY, bw, bh, 3); ctx.stroke();
      } else if (burstReady) {
        // burst armed: fiery orange energy fill, brighter/faster than a plain overcharge
        const g = ctx.createLinearGradient(frameX, 0, frameX+bw, 0);
        g.addColorStop(0, '#a85a1a'); g.addColorStop(0.5, BURST.color); g.addColorStop(1, '#a85a1a');
        ctx.fillStyle = g;
        roundRect(frameX, frameY+bh-fh, bw, Math.max(0.01,fh), 3); ctx.fill();
        ctx.save();
        roundRect(frameX, frameY+bh-fh, bw, Math.max(0.01,fh), 3); ctx.clip();
        ctx.fillStyle = `rgba(255,230,180,${0.4+0.3*Math.sin(t*11)})`;
        for (let i=0;i<3;i++){
          const yy = frameY+bh - ((t*90 + i*bh/3) % bh);
          ctx.fillRect(frameX, yy, bw, 3);
        }
        ctx.restore();
        ctx.strokeStyle=`rgba(255,220,180,${0.75+0.25*Math.sin(t*12)})`; ctx.lineWidth=2.2;
        roundRect(frameX, frameY, bw, bh, 3); ctx.stroke();
      } else if (burstCharges > 0 && charge >= 1) {
        // pre-burst-trigger: bar flickers orange-hot the closer it gets to arming the burst
        const flick = 0.5+0.5*Math.sin(performance.now()/45);
        ctx.fillStyle = `hsl(${Math.round(lerp(45,30,burstK))},95%,${Math.round(lerp(55,72,burstK*flick))}%)`;
        roundRect(frameX, frameY+bh-fh, bw, Math.max(0.01,fh), 3); ctx.fill();
        ctx.strokeStyle=`rgba(255,220,160,${0.5+0.5*burstK*flick})`; ctx.lineWidth=1.5+burstK*1.5;
        roundRect(frameX, frameY, bw, bh, 3); ctx.stroke();
      } else if (overcharged) {
        // purple energy fill with a bright animated core + faint upward-scrolling streaks
        const g = ctx.createLinearGradient(frameX, 0, frameX+bw, 0);
        g.addColorStop(0, '#5b1fa8'); g.addColorStop(0.5, SECOND.barColor); g.addColorStop(1, '#5b1fa8');
        ctx.fillStyle = g;
        roundRect(frameX, frameY+bh-fh, bw, Math.max(0.01,fh), 3); ctx.fill();
        ctx.save();
        roundRect(frameX, frameY+bh-fh, bw, Math.max(0.01,fh), 3); ctx.clip();
        ctx.fillStyle = `rgba(240,210,255,${0.35+0.25*Math.sin(t*9)})`;
        for (let i=0;i<3;i++){
          const yy = frameY+bh - ((t*70 + i*bh/3) % bh);
          ctx.fillRect(frameX, yy, bw, 3);
        }
        ctx.restore();
        ctx.strokeStyle=`rgba(230,190,255,${0.7+0.3*Math.sin(t*10)})`; ctx.lineWidth=2;
        roundRect(frameX, frameY, bw, bh, 3); ctx.stroke();
      } else if (isSecond && charge >= 1) {
        // pre-overcharge-break: bar flickers hotter (white-hot) the closer it gets to breaking
        const flick = 0.5+0.5*Math.sin(performance.now()/40);
        ctx.fillStyle = `hsl(${Math.round(lerp(280,300,overK))},90%,${Math.round(lerp(55,80,overK*flick))}%)`;
        roundRect(frameX, frameY+bh-fh, bw, Math.max(0.01,fh), 3); ctx.fill();
        ctx.strokeStyle=`rgba(255,255,255,${0.5+0.5*overK*flick})`; ctx.lineWidth=1.5+overK*1.5;
        roundRect(frameX, frameY, bw, bh, 3); ctx.stroke();
      } else {
        ctx.fillStyle=`hsl(${Math.round(lerp(200,0,charge))},90%,55%)`;
        roundRect(frameX, frameY+bh-fh, bw, Math.max(0.01,fh), 3); ctx.fill();
        if (charge>=1){ ctx.strokeStyle='rgba(255,255,255,0.9)'; ctx.lineWidth=2; roundRect(frameX,frameY,bw,bh,3); ctx.stroke(); }
      }
    }

    // slash trail (player swing, killer mode)
    if (attack.active && attack.timer < ATTACK.duration && player.blade && mode === 'killer') {
      const reach = GRIP_DIST + (player.blade.bladeLen||BLADE_LEN)*0.8;
      const a0 = player.angle + REST_SO;
      const a1 = player.angle + player.blade.so;
      const lo = Math.min(a0,a1), hi = Math.max(a0,a1);
      ctx.lineCap='round';
      if (attack.hardStab) {
        // HARD STAB: no sweeping arc — a straight forward spear of energy along the thrust line,
        // plus converging "impact chevrons" that snap inward as the blade drives home.
        const p = attack.timer / ATTACK.duration;
        const ca = Math.cos(player.angle), sa = Math.sin(player.angle);
        const ext = player.blade.ext || 0;
        const tipD = GRIP_DIST + ext + (player.blade.bladeLen||BLADE_LEN);
        // thrust intensity: 0 during coil, peaks through the strike, fades on withdraw
        const thrustK = p < 0.22 ? 0 : (p < 0.42 ? easeIn((p-0.22)/0.20) : (p < 0.62 ? 1 : 1-easeOut(clamp((p-0.62)/0.38,0,1))));
        if (thrustK > 0.01) {
          ctx.save();
          ctx.lineCap = 'round';
          // wide soft spear glow
          ctx.strokeStyle = `rgba(190,25,25,${0.30*thrustK})`; ctx.lineWidth = 15*thrustK;
          ctx.beginPath(); ctx.moveTo(cx + ca*GRIP_DIST*0.5, cy + sa*GRIP_DIST*0.5);
          ctx.lineTo(cx + ca*(tipD+10*thrustK), cy + sa*(tipD+10*thrustK)); ctx.stroke();
          // hot core line
          ctx.strokeStyle = `rgba(255,105,90,${0.70*thrustK})`; ctx.lineWidth = 6*thrustK;
          ctx.beginPath(); ctx.moveTo(cx + ca*GRIP_DIST*0.6, cy + sa*GRIP_DIST*0.6);
          ctx.lineTo(cx + ca*(tipD+6*thrustK), cy + sa*(tipD+6*thrustK)); ctx.stroke();
          // bright white spike
          ctx.strokeStyle = `rgba(255,235,225,${0.9*thrustK})`; ctx.lineWidth = 2.2*thrustK;
          ctx.beginPath(); ctx.moveTo(cx + ca*GRIP_DIST*0.7, cy + sa*GRIP_DIST*0.7);
          ctx.lineTo(cx + ca*(tipD+3*thrustK), cy + sa*(tipD+3*thrustK)); ctx.stroke();
          // converging chevrons ahead of the tip
          const px2 = -sa, py2 = ca;
          for (let i=0;i<3;i++){
            const cd = tipD + 8 + i*9 - thrustK*18;
            const spreadC = (7 + i*3) * (1.15 - thrustK*0.5);
            ctx.strokeStyle = `rgba(255,90,70,${0.42*thrustK*(1-i*0.24)})`; ctx.lineWidth = 2.2;
            ctx.beginPath();
            ctx.moveTo(cx + ca*(cd-5) + px2*spreadC, cy + sa*(cd-5) + py2*spreadC);
            ctx.lineTo(cx + ca*cd, cy + sa*cd);
            ctx.lineTo(cx + ca*(cd-5) - px2*spreadC, cy + sa*(cd-5) - py2*spreadC);
            ctx.stroke();
          }
          ctx.restore();
        }
        drawBladeTrail(swordTrailP, 'rgba(255,110,95,ALPHA)');
      } else if (attack.overcharged) {
        // wider, brighter purple energy arc for Second's overcharged swing
        ctx.strokeStyle='rgba(150,80,230,0.35)'; ctx.lineWidth=16;
        ctx.beginPath(); ctx.arc(cx, cy, reach, lo, hi); ctx.stroke();
        ctx.strokeStyle='rgba(220,180,255,0.7)'; ctx.lineWidth=6;
        ctx.beginPath(); ctx.arc(cx, cy, reach, lo, hi); ctx.stroke();
        ctx.strokeStyle='rgba(255,255,255,0.85)'; ctx.lineWidth=2.4;
        ctx.beginPath(); ctx.arc(cx, cy, reach, lo, hi); ctx.stroke();
        drawBladeTrail(swordTrailP, 'rgba(210,150,255,ALPHA)');
      } else {
        ctx.strokeStyle='rgba(210,230,255,0.28)'; ctx.lineWidth=11;
        ctx.beginPath(); ctx.arc(cx, cy, reach, lo, hi); ctx.stroke();
        ctx.strokeStyle='rgba(255,255,255,0.55)'; ctx.lineWidth=4;
        ctx.beginPath(); ctx.arc(cx, cy, reach, lo, hi); ctx.stroke();
        drawBladeTrail(swordTrailP, 'rgba(255,235,180,ALPHA)');
      }
    }

    // Jason throwing knife / boomerang
    if (knife.state !== 'ready') {
      if (knife.state === 'return') {
        ctx.strokeStyle='rgba(120,200,255,0.28)'; ctx.lineWidth=3; ctx.setLineDash([6,6]);
        ctx.beginPath(); ctx.moveTo(knife.x, knife.y); ctx.lineTo(player.x, player.y); ctx.stroke(); ctx.setLineDash([]);
      }
      if (knife.state === 'out' || knife.state === 'return') {
        for (let i=0;i<knifeTrail.length;i++){
          const t = knifeTrail[i], k = i/knifeTrail.length;
          ctx.globalAlpha = k*0.5 * Math.max(0, t.life/t.max);
          ctx.fillStyle = 'rgba(170,220,255,1)';
          ctx.beginPath(); ctx.arc(t.x, t.y, 2.2+k*3.5, 0, Math.PI*2); ctx.fill();
        }
        ctx.globalAlpha = 1;
      }
      drawKnife(knife.x, knife.y, knife.angle);
    }

    // shockwave rings (weapon impacts, deaths)
    for (const sw of shockwaves){
      const k = 1 - sw.life/sw.max;
      const rr = lerp(sw.r0, sw.r1, easeOut(k));
      const alpha = (1-k) * 0.8;
      ctx.strokeStyle = sw.color.replace('ALPHA', alpha.toFixed(3));
      ctx.lineWidth = 3 * (1-k) + 1;
      ctx.beginPath(); ctx.arc(sw.x, sw.y, rr, 0, Math.PI*2); ctx.stroke();
    }

    // impact rings + blood particles
    if (impacts.length) {
      ctx.lineWidth=3;
      for (const im of impacts){
        const k=1-im.life/im.max, rr=6+k*26;
        if (k < 0.6) glowDisk(im.x, im.y, 10 + k*34, '255,236,190', 0.7*(1-k/0.6));
        ctx.strokeStyle=`rgba(255,230,150,${((1-k)*0.9).toFixed(3)})`;
        ctx.beginPath(); ctx.arc(im.x, im.y, rr, 0, Math.PI*2); ctx.stroke();
      }
      ctx.lineWidth=1.4;
      for (const im of impacts){
        const k=1-im.life/im.max, rr=6+k*26;
        ctx.strokeStyle=`rgba(255,255,255,${((1-k)*0.5).toFixed(3)})`;
        ctx.beginPath(); ctx.arc(im.x, im.y, rr*0.6, 0, Math.PI*2); ctx.stroke();
      }
    }
    // particles: batched without per-item save/restore (cheaper); shadowBlur only toggled on state change
    // Particles: glow is a soft translucent halo + bright core (no per-particle shadowBlur).
    for (let i = 0; i < particles.length; i++){
      const pt = particles[i];
      if (pt.glow) continue;
      ctx.globalAlpha = Math.max(0, pt.life/pt.max);
      ctx.fillStyle = pt.color;
      ctx.beginPath(); ctx.arc(pt.x, pt.y, pt.size, 0, Math.PI*2); ctx.fill();
    }
    // sparks are additive, so overlapping sparks bloom into bright highlights
    ctx.globalCompositeOperation = 'lighter';
    for (let i = 0; i < particles.length; i++){
      const pt = particles[i];
      if (!pt.glow) continue;
      const a = Math.max(0, pt.life/pt.max);
      ctx.globalAlpha = a * 0.22;
      ctx.fillStyle = pt.color;
      ctx.beginPath(); ctx.arc(pt.x, pt.y, pt.size*3.2, 0, Math.PI*2); ctx.fill();
      ctx.globalAlpha = a;
      ctx.beginPath(); ctx.arc(pt.x, pt.y, pt.size, 0, Math.PI*2); ctx.fill();
    }
    ctx.globalCompositeOperation = 'source-over';
    ctx.globalAlpha=1;

    // ---- debug hitboxes ----
    if (debug) {
      ctx.lineWidth=1.5;
      ctx.strokeStyle='rgba(0,220,255,0.9)';
      ctx.beginPath(); ctx.arc(player.x, player.y, player.r, 0, Math.PI*2); ctx.stroke();
      ctx.beginPath(); ctx.arc(dummy.x, dummy.y, dummy.r, 0, Math.PI*2); ctx.stroke();
      ctx.beginPath(); ctx.arc(gen.x, gen.y, gen.r, 0, Math.PI*2); ctx.stroke();
      if (player.hitbox && mode==='killer') drawHitbox(player.hitbox, attack.active && attack.timer>=ATTACK.hitStart*ATTACK.duration && attack.timer<=ATTACK.hitEnd*ATTACK.duration);
      if (knife.state !== 'ready') { ctx.strokeStyle='rgba(120,220,255,0.9)'; ctx.beginPath(); ctx.arc(knife.x, knife.y, THROW.radius, 0, Math.PI*2); ctx.stroke(); }
      if (mode==='survivor' && dummy.swinging) {
        const a = dummy.face + swingOffset(dummy.swingT/ATTACK.duration);
        const ca=Math.cos(a), sa=Math.sin(a);
        drawHitbox({ cx:dummy.x+ca*BOX.fwd, cy:dummy.y+sa*BOX.fwd, ang:a, halfLen:BOX.halfLen, halfW:BOX.halfW },
          dummy.swingT>=ATTACK.hitStart*ATTACK.duration && dummy.swingT<=ATTACK.hitEnd*ATTACK.duration);
      }
    }

    ctx.restore(); // end world (shake)

    // ---- full-frame effects (no shake) ----
    for (const fl of screenFlashes){
      const k = fl.life/fl.max;
      ctx.fillStyle = `rgba(${fl.color},${(k*fl.alpha).toFixed(3)})`;
      ctx.fillRect(0,0,vp.w,vp.h);
    }
    if (vignettePulse > 0){
      const vg = ctx.createRadialGradient(vp.w/2, vp.h/2, Math.min(vp.w,vp.h)*0.25, vp.w/2, vp.h/2, Math.max(vp.w,vp.h)*0.72);
      vg.addColorStop(0, 'rgba(160,0,0,0)');
      vg.addColorStop(1, `rgba(160,0,0,${(vignettePulse*0.45).toFixed(3)})`);
      ctx.fillStyle = vg; ctx.fillRect(0,0,vp.w,vp.h);
    }
    // persistent low-hp vignette (survivor mode)
    if (mode === 'survivor' && player.hp < 40) {
      const k = 1 - player.hp/40;
      const pulse = 0.6+0.4*Math.sin(performance.now()/260);
      const vg = ctx.createRadialGradient(vp.w/2, vp.h/2, Math.min(vp.w,vp.h)*0.22, vp.w/2, vp.h/2, Math.max(vp.w,vp.h)*0.7);
      vg.addColorStop(0, 'rgba(140,0,0,0)');
      vg.addColorStop(1, `rgba(140,0,0,${(k*0.35*pulse).toFixed(3)})`);
      ctx.fillStyle = vg; ctx.fillRect(0,0,vp.w,vp.h);
    }

    // ---- UI (no shake) ----
    if (throwAim.active){
      const sl=aimSlider(), sc=uiScale();
      ctx.fillStyle='rgba(15,28,42,0.82)'; roundRect(sl.x, sl.y, sl.w, sl.h, 12*sc); ctx.fill();
      ctx.strokeStyle='rgba(120,220,255,0.65)'; ctx.lineWidth=2; roundRect(sl.x, sl.y, sl.w, sl.h, 12*sc); ctx.stroke();
      ctx.lineCap='round';
      ctx.strokeStyle='rgba(255,255,255,0.25)'; ctx.lineWidth=4*sc;
      ctx.beginPath(); ctx.moveTo(sl.x+12*sc, sl.cy); ctx.lineTo(sl.x+sl.w-12*sc, sl.cy); ctx.stroke();
      ctx.fillStyle='rgba(255,255,255,0.55)'; ctx.beginPath(); ctx.arc(sl.cx, sl.cy, 3.5*sc, 0, Math.PI*2); ctx.fill();
      ctx.beginPath(); ctx.arc(throwAim.knobX, throwAim.knobY, 10*sc, 0, Math.PI*2);
      ctx.fillStyle='rgba(120,220,255,0.98)'; ctx.fill();
      ctx.strokeStyle='#fff'; ctx.lineWidth=2; ctx.stroke();
      ctx.fillStyle='rgba(255,255,255,0.95)'; ctx.font=`bold ${Math.round(10*sc)}px system-ui,sans-serif`; ctx.textAlign='center'; ctx.textBaseline='middle';
      ctx.fillText('AIM', sl.cx, sl.y-8*sc);
    }
    if (throwAim.active){
      const dx=throwAim.dx || Math.cos(player.angle), dy=throwAim.dy || Math.sin(player.angle);
      const halfCone = THROW.aimCone * 0.5;
      const c0 = throwAim.baseAngle - halfCone, c1 = throwAim.baseAngle + halfCone;
      const ox=player.x, oy=player.y;
      ctx.strokeStyle='rgba(120,220,255,0.22)'; ctx.lineWidth=2; ctx.setLineDash([5,7]);
      ctx.beginPath();
      ctx.moveTo(ox, oy); ctx.lineTo(ox+Math.cos(c0)*THROW.range, oy+Math.sin(c0)*THROW.range);
      ctx.moveTo(ox, oy); ctx.lineTo(ox+Math.cos(c1)*THROW.range, oy+Math.sin(c1)*THROW.range);
      ctx.stroke();
      const sx=player.x+dx*(player.r+12), sy=player.y+dy*(player.r+12);
      ctx.strokeStyle='rgba(120,220,255,0.65)'; ctx.lineWidth=3; ctx.setLineDash([8,6]);
      ctx.beginPath(); ctx.moveTo(sx, sy); ctx.lineTo(sx+dx*THROW.range, sy+dy*THROW.range); ctx.stroke(); ctx.setLineDash([]);
    }
    if (joy.active){
      ctx.beginPath(); ctx.arc(joy.baseX, joy.baseY, joy.maxR, 0, Math.PI*2);
      ctx.fillStyle='rgba(255,255,255,0.08)'; ctx.fill();
      ctx.strokeStyle='rgba(255,255,255,0.25)'; ctx.lineWidth=2; ctx.stroke();
      ctx.beginPath(); ctx.arc(joy.knobX, joy.knobY, 26, 0, Math.PI*2);
      ctx.fillStyle='rgba(255,91,82,0.85)'; ctx.fill();
    }
    // ---- HUD buttons ---- (all dimmed to 20% opacity while docked at a generator, so the
    // skill-check gauge and generator itself stay clearly visible without button clutter)
    ctx.save();
    if (genLock.active) ctx.globalAlpha = 0.2;
    // survivor generator interact / skill-check button (main round button, bottom-right)
    // While trapped, the main round button becomes the ESCAPE (skill-check) button.
    if (mode === 'survivor' && player.trapped) {
      const btn=attackButton();
      const sc=uiScale();
      const tr = player.trapped;
      const live = !!tr.check;
      ctx.save();
      ctx.beginPath(); ctx.arc(btn.x, btn.y, btn.r, 0, Math.PI*2);
      ctx.fillStyle = live ? 'rgba(255,220,80,0.94)' : 'rgba(120,90,200,0.88)';
      ctx.fill();
      ctx.strokeStyle='rgba(255,255,255,0.5)'; ctx.lineWidth=2; ctx.stroke();
      if (live) {
        const prog = clamp(tr.check.timer / tr.check.dur, 0, 1);
        ctx.strokeStyle='rgba(255,255,255,0.95)'; ctx.lineWidth=4*sc; ctx.lineCap='round';
        ctx.beginPath(); ctx.arc(btn.x, btn.y, btn.r-7*sc, -Math.PI/2, -Math.PI/2 + prog*Math.PI*2); ctx.stroke();
      }
      ctx.fillStyle='#fff'; ctx.font=`bold ${Math.round(11*sc)}px system-ui,sans-serif`;
      ctx.textAlign='center'; ctx.textBaseline='middle';
      ctx.fillText(live ? 'HIT' : 'HELD', btn.x, btn.y);
      ctx.font=`bold ${Math.round(8*sc)}px system-ui,sans-serif`;
      ctx.fillText(`${tr.checksDone}/${GHOST.checksNeeded}`, btn.x, btn.y + btn.r*0.56);
      ctx.textAlign='left'; ctx.textBaseline='alphabetic';
      ctx.restore();
    }
    else if (mode === 'survivor' && playerChar === 'jame' && (canInteractGen() || gen.repairing || gen.check)) {
      const btn=attackButton();
      const sc=uiScale();
      ctx.save();
      if (gen.repairing && !gen.check) ctx.globalAlpha = 0.5;
      ctx.beginPath(); ctx.arc(btn.x, btn.y, btn.r, 0, Math.PI*2);
      ctx.fillStyle = gen.check ? 'rgba(255,220,80,0.92)' : (genLock.active ? 'rgba(80,200,235,0.86)' : 'rgba(90,210,130,0.86)');
      ctx.fill(); ctx.strokeStyle='rgba(255,255,255,0.45)'; ctx.lineWidth=2; ctx.stroke();
      if (gen.repairing && !gen.check) {
        const prog = 1 - clamp(gen.skillT/Math.max(0.001,gen.skillTotal),0,1);
        ctx.strokeStyle='rgba(255,255,255,0.95)'; ctx.lineWidth=4*sc;
        ctx.beginPath(); ctx.arc(btn.x, btn.y, btn.r-7*sc, -Math.PI/2, -Math.PI/2 + prog*Math.PI*2); ctx.stroke();
      }
      ctx.fillStyle='#fff'; ctx.font=`bold ${Math.round(gen.check?11*sc:10*sc)}px system-ui,sans-serif`; ctx.textAlign='center'; ctx.textBaseline='middle';
      ctx.fillText(gen.check ? 'HIT' : (genLock.active ? 'FIX' : 'GEN'), btn.x, btn.y);
      ctx.restore();
    }

    // RESURGEON button (Jame) — beside the GEN/FIX button
    {
      const rVis = resurgeonVisible();
      const rf = stateFade('resVis', rVis ? 'in' : 'out', 0.12);
      if (rVis || rf < 0.99) {
        const rd = resurgeonButton();
        const rA = rVis ? rf : (1 - rf);
        const rS = rVis ? (0.86 + 0.14 * rf) : (1 - 0.1 * rf);
        ctx.save();
        ctx.globalAlpha *= rA;
        ctx.translate(rd.x, rd.y); ctx.scale(rS, rS); ctx.translate(-rd.x, -rd.y);
        drawResurgeonButton();
        ctx.restore();
      }
    }

    // attack button (killer mode only — survivors have no sword). Shows: normal / charging /
    // Second-overcharged / burst-armed / combo colors, a banked-burst pip indicator, and the
    // M1 cooldown ring.
    if (mode === 'killer') {
      const btn=attackButton();
      const sc=uiScale();
      const unarmed = !hasSword();
      const ready = !attack.active && !unarmed;
      const comboArmed = overcharged && burstReady;
      ctx.beginPath(); ctx.arc(btn.x, btn.y, btn.r, 0, Math.PI*2);
      ctx.fillStyle = unarmed
        ? 'rgba(90,95,105,0.55)'
        : (comboArmed
          ? 'rgba(255,150,60,0.95)'
          : (burstReady
            ? 'rgba(255,157,61,0.92)'
            : (overcharged
              ? 'rgba(160,90,235,0.92)'
              : (charging
                ? `rgba(255,${Math.round(lerp(91,160,charge))},${Math.round(lerp(82,60,charge))},0.9)`
                : (ready ? 'rgba(255,91,82,0.85)' : 'rgba(120,120,120,0.5)')))));
      ctx.fill();
      if (comboArmed) { ctx.save(); ctx.globalCompositeOperation='lighter'; ctx.globalAlpha=0.4+0.15*Math.sin(performance.now()/90); ctx.strokeStyle='rgba(255,180,80,1)'; ctx.lineWidth=10; ctx.stroke(); ctx.restore(); ctx.save(); ctx.strokeStyle='rgba(255,225,170,0.95)'; ctx.lineWidth=3; ctx.stroke(); ctx.restore(); }
      else if (burstReady) { ctx.save(); ctx.globalCompositeOperation='lighter'; ctx.globalAlpha=0.35; ctx.strokeStyle='rgba(255,157,61,1)'; ctx.lineWidth=8; ctx.stroke(); ctx.restore(); ctx.save(); ctx.strokeStyle='rgba(255,220,180,0.9)'; ctx.lineWidth=2.5; ctx.stroke(); ctx.restore(); }
      else if (overcharged) { ctx.save(); ctx.globalCompositeOperation='lighter'; ctx.globalAlpha=0.35; ctx.strokeStyle='rgba(190,120,255,1)'; ctx.lineWidth=8; ctx.stroke(); ctx.restore(); ctx.save(); ctx.strokeStyle='rgba(230,190,255,0.9)'; ctx.lineWidth=2.5; ctx.stroke(); ctx.restore(); }
      else { ctx.strokeStyle='rgba(255,255,255,0.4)'; ctx.lineWidth=2; ctx.stroke(); }
      if (charging){
        ctx.strokeStyle='#fff'; ctx.lineWidth=4*sc;
        ctx.beginPath(); ctx.arc(btn.x, btn.y, btn.r-7*sc, -Math.PI/2, -Math.PI/2 + charge*Math.PI*2); ctx.stroke();
      } else if(mode==='survivor' && currentMap==='Test run' && killerAI.chargeGoal>0){
        const k=clamp(killerAI.charge/killerAI.chargeGoal,0,1);
        ctx.strokeStyle='#ffb45e'; ctx.lineWidth=4*sc;
        ctx.beginPath(); ctx.arc(btn.x,btn.y,btn.r-7*sc,-Math.PI/2,-Math.PI/2+k*Math.PI*2); ctx.stroke();
      }
      if (attack.active){   // M1 cooldown ring
        const total = ATTACK.duration + attackRecoverTime(attack);
        const prog = clamp(attack.timer/total, 0, 1);
        ctx.strokeStyle='rgba(255,255,255,0.9)'; ctx.lineWidth=4*sc;
        ctx.beginPath(); ctx.arc(btn.x, btn.y, btn.r-7*sc, -Math.PI/2, -Math.PI/2 + (1-prog)*Math.PI*2); ctx.stroke();
      }
      ctx.save();
      if (unarmed) ctx.globalAlpha = 0.45;
      ctx.translate(btn.x, btn.y); ctx.rotate(-Math.PI/4);
      drawSwordGlyph(sc * 1.3);
      ctx.restore();
      // ---- Burst streak + banked-charge orbit indicator ----
      // A slim outer ring smoothly fills as the hit-streak builds toward the next banked burst,
      // and each banked charge appears as a small glowing orb that continuously orbits the
      // button (speeding up once armed) — replaces the old static row of dots below the button.
      if (mode === 'killer' && !unarmed) {
        if (hitStreakAnim > 0.02 && hitStreak < BURST.streakNeeded) {
          const ringR = btn.r + 6*sc;
          ctx.save();
          ctx.lineCap = 'round';
          ctx.strokeStyle = 'rgba(255,255,255,0.12)'; ctx.lineWidth = 3*sc;
          ctx.beginPath(); ctx.arc(btn.x, btn.y, ringR, 0, Math.PI*2); ctx.stroke();
          const grad = ctx.createLinearGradient(btn.x-ringR, btn.y-ringR, btn.x+ringR, btn.y+ringR);
          grad.addColorStop(0, '#ffe3ad'); grad.addColorStop(1, BURST.color);
          ctx.strokeStyle = grad;
          ctx.globalAlpha = 0.55 + 0.45*hitStreakAnim;
          glowRing(btn.x, btn.y, ringR, -Math.PI/2, -Math.PI/2 + hitStreakAnim*Math.PI*2, '255,157,61', 3*sc, 0.45 + 0.35*hitStreakAnim);
          ctx.lineWidth = 3*sc;
          ctx.beginPath(); ctx.arc(btn.x, btn.y, ringR, -Math.PI/2, -Math.PI/2 + hitStreakAnim*Math.PI*2); ctx.stroke();
          ctx.restore();
        }
        if (burstCharges > 0 || burstBankedFX > 0) {
          const n = Math.max(1, burstCharges);
          const orbitR = btn.r + 15*sc;
          const spin = burstOrbitAngle * (burstReady ? 2.3 : 1);
          for (let i=0;i<n;i++){
            const isNewest = (i === n-1);
            const bankT = isNewest ? clamp(burstBankedFX,0,1) : 0;
            const popScale = isNewest ? Math.max(0.05, easeOutBack(1-bankT)) : 1;
            const ang = spin + i*(Math.PI*2/n);
            const ox = btn.x + Math.cos(ang)*orbitR, oy = btn.y + Math.sin(ang)*orbitR;
            // faint trailing arc behind each orb for a sense of continuous motion
            ctx.save();
            ctx.strokeStyle = 'rgba(255,157,61,0.28)'; ctx.lineWidth = 2*sc; ctx.lineCap='round';
            ctx.beginPath(); ctx.arc(btn.x, btn.y, orbitR, ang-0.4, ang); ctx.stroke();
            ctx.restore();
            const orbR = (2.6 + (isNewest ? bankT*2.4 : 0) + (burstReady?0.5:0)) * sc * popScale;
            ctx.save();
            glowDisk(ox, oy, orbR*3.2 + 2*sc, '255,180,90', 0.8);
            const g2 = ctx.createRadialGradient(ox-orbR*0.3, oy-orbR*0.3, orbR*0.15, ox, oy, Math.max(0.01,orbR));
            g2.addColorStop(0, '#fff3d6'); g2.addColorStop(1, BURST.color);
            ctx.fillStyle = g2;
            ctx.beginPath(); ctx.arc(ox, oy, Math.max(0.01,orbR), 0, Math.PI*2); ctx.fill();
            ctx.strokeStyle = 'rgba(255,240,210,0.9)'; ctx.lineWidth = 1*sc; ctx.stroke();
            ctx.restore();
            // one-time radiant burst ring when this orb is freshly banked
            if (isNewest && bankT > 0.01) {
              ctx.save();
              ctx.globalAlpha = bankT;
              ctx.strokeStyle = BURST.color; ctx.lineWidth = 1.6*sc;
              ctx.beginPath(); ctx.arc(ox, oy, orbR + (1-bankT)*10*sc, 0, Math.PI*2); ctx.stroke();
              ctx.restore();
            }
          }
        }
      }
      // ---- HARD STAB passive indicator (Jason only) ----
      // Deliberately placed as its own badge to the LEFT of the attack button so it can never
      // collide with the burst streak ring (btn.r+6), the orbiting burst orbs (btn.r+15), the
      // charge/cooldown rings (btn.r-7), the Throw button above it, or the map border.
      if (playerChar === 'jason' && !unarmed) {
        ctx.save();
        ctx.globalAlpha *= 0.6 + 0.4 * stateFade('hardStab', hardStabReady ? 'armed' : 'idle');
        drawHardStabBadge(btn, sc);
        ctx.restore();
      }
    }
    // Second GHOST TRAP skill button — always visible for Second; colour conveys the state.
    if (mode === 'killer' && playerChar === 'second') {
      const sb=skillButton();
      const sc=uiScale();
      const ready = canUseGhost();
      const onCD = ghostCD > 0;
      const armFX = clamp(ghostArmFX, 0, 1);
      const beatG = 0.5 + 0.5*Math.sin(performance.now()/240);
      ctx.save();
      // Contain every pixel of this control (including the arm pulse) inside its own circle.
      ctx.beginPath(); ctx.arc(sb.x, sb.y, sb.r + 7*sc, 0, Math.PI*2); ctx.clip();
      if (armFX > 0.01) {
        ctx.save();
        ctx.globalAlpha = armFX;
        ctx.strokeStyle = GHOST.color; ctx.lineWidth = 2.4*sc;
        ctx.beginPath(); ctx.arc(sb.x, sb.y, sb.r + (1-armFX)*7*sc, 0, Math.PI*2); ctx.stroke();
        ctx.restore();
      }
      const bgG = ctx.createRadialGradient(sb.x-sb.r*0.35, sb.y-sb.r*0.4, sb.r*0.1, sb.x, sb.y, sb.r);
      if (ready)      { bgG.addColorStop(0,'#a488ff'); bgG.addColorStop(1,'#4a1f9e'); }
      else if (onCD)  { bgG.addColorStop(0,'rgba(70,62,96,0.85)'); bgG.addColorStop(1,'rgba(34,28,52,0.85)'); }
      else            { bgG.addColorStop(0,'rgba(84,72,110,0.7)');  bgG.addColorStop(1,'rgba(40,32,58,0.7)'); }
      ctx.save();
      if (ready) glowDisk(sb.x, sb.y, sb.r*1.6 + 4*beatG*sc, '143,108,255', 0.55 + 0.25*beatG);

    // Jason Throw skill button (hold/drag to aim, release to throw) — fades between its states

    ctx.globalAlpha *= 0.6 + 0.4 * stateFade('knife', knife.state + (knife.cd > 0 ? '-cd' : ''));
    if (mode === 'killer' && playerChar === 'jason') {
